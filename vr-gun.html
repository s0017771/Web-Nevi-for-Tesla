<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리듬 건</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="vr-common.js"></script>
<script src="vr-gun-viz.js"></script>   <!-- GUNVIZ: 2D 반실사 캔버스 스프라이트 -->
<script src="vr-gun-audio.js"></script> <!-- GUNAUDIO: 리얼 총성 + 음악 리듬 베드 -->
<script>
/* 캐시된 스프라이트 src 헬퍼 (GUNVIZ 텍스처는 내부 캐시됨) */
function GVS(name, variant){ try{ return window.GUNVIZ ? (name==='enemy'?GUNVIZ.enemyTexture(variant):GUNVIZ[name+'Texture']()).src : ''; }catch(e){ return ''; } }

if(window.AFRAME){
  /* 총: 방아쇠 → 리얼 총성(GUNAUDIO) + 총구 섬광 스프라이트. 조준/명중은 레이저 커서가 처리 */
  AFRAME.registerComponent('gun',{
    init:function(){
      var el=this.el;
      // 손에서 앞으로 뻗은 네온 총신
      var barrel=document.createElement('a-cylinder');
      barrel.setAttribute('radius','0.018'); barrel.setAttribute('height','0.26');
      barrel.setAttribute('rotation','90 0 0'); barrel.setAttribute('position','0 0 -0.16');
      barrel.setAttribute('material','shader:flat; color:'+(el.id==='rhand'?'#6cf':'#f6c'));
      el.appendChild(barrel);
      el.addEventListener('triggerdown', this.fire.bind(this));
    },
    fire:function(){
      var hand=(this.el.id==='lhand')?'l':'r';
      if(window.GUNAUDIO) GUNAUDIO.shot(hand);
      if(window.pulseReticle) window.pulseReticle();
      // 총구 섬광(발광 스프라이트): 총구 끝에서 짧게 팽창·페이드
      var m=document.createElement('a-plane');
      m.setAttribute('width','0.34'); m.setAttribute('height','0.34');
      m.setAttribute('material','shader:flat; src:'+GVS('muzzle')+'; transparent:true; alphaTest:0.01; blending:additive; opacity:1; side:double; fog:false');
      m.setAttribute('position','0 0 -0.3'); m.setAttribute('billboard','');
      m.setAttribute('animation__s','property:scale; from:0.5 0.5 1; to:1.5 1.5 1; dur:100; easing:easeOutQuad');
      m.setAttribute('animation__o','property:material.opacity; from:1; to:0; dur:130; easing:easeInQuad');
      this.el.appendChild(m);
      setTimeout(function(){ if(m.parentNode) m.parentNode.removeChild(m); }, 170);
    }
  });
  // 네온 바닥/기둥이 다가오는 효과(전진감) — 지나가면 뒤로 되돌림(루프)
  AFRAME.registerComponent('scroll',{
    schema:{speed:{default:7}, reset:{default:-44}, limit:{default:4}},
    tick:function(t,dt){ if(!window.__gunPlaying) return; var p=this.el.object3D.position; p.z += this.data.speed*((dt||16)/1000);
      if(p.z>this.data.limit){ p.z += (this.data.reset-this.data.limit); } }
  });
  // 적: 앞(플레이어)으로 다가옴. 일부는 중간에 총알 발사. 플레이어에 닿으면 피해.
  AFRAME.registerComponent('approach',{
    schema:{speed:{default:4.6}},
    tick:function(t,dt){ if(!window.__gunPlaying || this.el.dataset.dead) return; var p=this.el.object3D.position; p.z += this.data.speed*((dt||16)/1000);
      if(this.el.dataset.shooter==='1' && this.el.dataset.shot!=='1' && p.z>-9){ this.el.dataset.shot='1'; if(window.__gunEnemyShoot) window.__gunEnemyShoot(this.el); }
      if(p.z>1.3){ if(window.__gunReached) window.__gunReached(this.el); } }
  });
  // 날아오는 총알: 플레이어 머리로. 닿으면 피해.
  AFRAME.registerComponent('incoming',{
    schema:{dx:{default:0},dy:{default:0},dz:{default:1},speed:{default:6}},
    init:function(){ this._v=new THREE.Vector3(); },
    tick:function(t,dt){ if(!window.__gunPlaying) return; var k=(dt||16)/1000, p=this.el.object3D.position;
      p.x+=this.data.dx*this.data.speed*k; p.y+=this.data.dy*this.data.speed*k; p.z+=this.data.dz*this.data.speed*k;
      var cam=this.el.sceneEl.camera; if(cam && !this.el.dataset.dead){ cam.getWorldPosition(this._v); if(this._v.distanceTo(p)<0.27){ if(window.__gunPlayerHit) window.__gunPlayerHit(this.el); return; } }
      if(Math.abs(p.x)>22||Math.abs(p.z)>24||p.y<-2){ if(this.el.parentNode) this.el.parentNode.removeChild(this.el); } }
  });

  /* 적 외계 함선 — 실제 3D 셰이딩(금속 MeshStandard + 이미시브 캐노피/엔진 + additive 글로우 할로).
     코 방향 +Z(플레이어 쪽). 살짝 롤/보브 애니메이션. 변주 3종. */
  var SHIP_COL=[
    {hull:0x3a2142, emi:0xff2a6d, eng:0xff6090},   // 마젠타
    {hull:0x12303a, emi:0x05d9e8, eng:0x66f0ff},   // 시안
    {hull:0x271a42, emi:0xb14bff, eng:0xcf9bff}    // 바이올렛
  ];
  AFRAME.registerComponent('enemy-ship',{
    schema:{variant:{default:0}},
    init:function(){
      var THREE=AFRAME.THREE, v=((this.data.variant%3)+3)%3, C=SHIP_COL[v];
      var g=new THREE.Group();
      var hull=new THREE.MeshStandardMaterial({color:C.hull, metalness:0.35, roughness:0.62, emissive:C.emi, emissiveIntensity:0.12});
      var trim=new THREE.MeshStandardMaterial({color:0x14141c, metalness:0.45, roughness:0.55});
      // 동체(콘, 코 +Z)
      var fus=new THREE.Mesh(new THREE.ConeGeometry(0.27,0.95,7), hull); fus.rotation.x=Math.PI/2; fus.position.z=0.12; g.add(fus);
      // 중앙 바디
      var body=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.24,0.6), hull); body.position.z=-0.22; g.add(body);
      // 스웹트 윙(좌우)
      for(var s=-1;s<=1;s+=2){
        var wing=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.05,0.34), hull);
        wing.position.set(s*0.33,-0.02,-0.18); wing.rotation.y=s*0.5; g.add(wing);
        // 윙팁 이미시브 포드
        var podMat=new THREE.MeshStandardMaterial({color:C.emi, emissive:C.emi, emissiveIntensity:1.3, metalness:0.3, roughness:0.2});
        var pod=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8), podMat); pod.position.set(s*0.56,-0.02,-0.1); g.add(pod);
        var podHalo=new THREE.Mesh(new THREE.SphereGeometry(0.14,10,8), new THREE.MeshBasicMaterial({color:C.emi,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false})); pod.add(podHalo);
      }
      // 꼬리 핀
      var fin=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.3,0.26), trim); fin.position.set(0,0.14,-0.34); g.add(fin);
      // 캐노피(발광 반구)
      var canMat=new THREE.MeshStandardMaterial({color:C.emi, emissive:C.emi, emissiveIntensity:1.6, metalness:0.1, roughness:0.08});
      var can=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,10,0,Math.PI*2,0,Math.PI*0.5), canMat); can.rotation.x=-Math.PI*0.5; can.position.set(0,0.12,0.02); g.add(can);
      var canHalo=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10), new THREE.MeshBasicMaterial({color:C.emi,transparent:true,opacity:0.28,blending:THREE.AdditiveBlending,depthWrite:false})); can.add(canHalo);
      // 엔진(뒤, 발광 + 글로우 할로)
      for(var e=-1;e<=1;e+=2){
        var eng=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,0.2,10), trim); eng.rotation.x=Math.PI/2; eng.position.set(e*0.14,-0.02,-0.52); g.add(eng);
        var glowMat=new THREE.MeshBasicMaterial({color:C.eng, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false});
        var core=new THREE.Mesh(new THREE.CircleGeometry(0.08,12), glowMat); core.position.set(e*0.14,-0.02,-0.63); core.rotation.y=Math.PI; g.add(core);
        var halo=new THREE.Mesh(new THREE.SphereGeometry(0.17,10,8), new THREE.MeshBasicMaterial({color:C.eng,transparent:true,opacity:0.33,blending:THREE.AdditiveBlending,depthWrite:false})); halo.position.set(e*0.14,-0.02,-0.6); g.add(halo);
      }
      this.el.setObject3D('model', g);
      this._g=g; this._ph=Math.random()*6.28; this._engs=g;
    },
    tick:function(t){ if(!this._g) return; var ph=this._ph+t*0.004;
      this._g.rotation.z=Math.sin(ph)*0.18;           // 롤
      this._g.position.y=Math.sin(ph*0.7)*0.05;       // 보브(모델 로컬)
    },
    remove:function(){ if(this.el.getObject3D('model')) this.el.removeObject3D('model'); this._g=null; }
  });

  /* 워프 스타필드 — 플레이어 쪽으로 흐르는 별 스트릭(하이퍼스페이스 느낌) */
  AFRAME.registerComponent('warp-stars',{
    init:function(){ var THREE=AFRAME.THREE; this.g=new THREE.Group(); this.stars=[];
      var mat=new THREE.MeshBasicMaterial({color:0xbfe8ff, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false});
      for(var i=0;i<64;i++){ var m=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.02,1), mat.clone()); this._reset(m,true); this.g.add(m); this.stars.push(m); }
      this.el.setObject3D('warp', this.g); },
    _reset:function(m,initial){ m.position.set((Math.random()*2-1)*8, Math.random()*5.5+0.1, initial?-(Math.random()*46):-46);
      m.scale.z=Math.random()*5+2; var o=0.3+Math.random()*0.6; if(m.material) m.material.opacity=o; },
    tick:function(t,dt){ if(!window.__gunPlaying) return; var k=(dt||16)/1000; for(var i=0;i<this.stars.length;i++){ var m=this.stars[i]; m.position.z+=19*k; if(m.position.z>3) this._reset(m,false); } }
  });
}
</script>
<style>
  html,body{margin:0;height:100%;background:#06030f;font-family:-apple-system,"Malgun Gothic","Segoe UI","Noto Sans KR",sans-serif}
  a.back{position:fixed;top:12px;left:12px;z-index:11;color:#d9c8ff;text-decoration:none;font-size:.9rem;background:#120a2acc;border:1px solid #3a2a63;border-radius:10px;padding:8px 12px}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#c9b6ff;font-size:.85rem;z-index:11;pointer-events:none;text-shadow:0 1px 4px #000}
</style>
</head>
<body>
<a-scene background="color:#06030f" fog="type:exponential; color:#0a0520; density:0.028" vr-mode-ui="enabled:true" device-orientation-permission-ui="enabled:false">
  <a-sky id="sky" color="#06030f" material="shader:flat; color:#06030f"></a-sky>
  <a-entity id="world"></a-entity>
  <a-entity id="warp" warp-stars></a-entity>

  <a-entity id="hud" visible="false">
    <a-entity id="scoreT" ktext="value: 점수 0; color:#8ff; size:0.28" position="-2.5 3.2 -5"></a-entity>
    <a-entity id="lvT" ktext="value: LV 1  0/10; color:#ffd23f; size:0.28" position="0 3.72 -5"></a-entity>
    <a-entity id="comboT" ktext="value: ; color:#f8f; size:0.32" position="0 3.4 -5"></a-entity>
    <a-entity id="livesT" ktext="value: ❤❤❤❤❤; color:#ff6a9a; size:0.28" position="2.5 3.2 -5"></a-entity>
    <a-circle id="beatDot" radius="0.08" color="#6cf" material="shader:flat; fog:false" position="0 3.04 -5"></a-circle>
    <a-entity id="banner" ktext="value: ; color:#fff; size:0.34" position="0 2.3 -4.5" visible="false"></a-entity>
  </a-entity>

  <a-entity id="field"></a-entity>

  <a-entity id="helpTxt" ktext="value: 🚀 비트에 맞춰 외계 함선을 격추하세요! (방아쇠/탭)&#10;날아오는 적탄은 몸·방향키로 회피&#10;함선이 코앞까지 오기 전에 처치!; color:#b9a6e8; size:0.22" position="0 1.5 -4"></a-entity>

  <a-entity id="startWrap" position="0 1.9 -3.2">
    <a-plane id="startBtn" class="clickable" width="2.9" height="0.9" material="shader:flat; color:#b14bff"></a-plane>
    <a-entity id="startTxt" ktext="value: ▶ 시작; color:#fff; size:0.34" position="0 0 0.02"></a-entity>
  </a-entity>

  <a-entity id="gameover" visible="false" position="0 2.6 -3.4">
    <a-plane width="3.5" height="1.3" material="shader:flat; color:#160a30; opacity:0.93"></a-plane>
    <a-entity id="goTitle" ktext="value: 격추됨 🚀; color:#fff; size:0.32" position="0 0.34 0.02"></a-entity>
    <a-entity id="finalScore" ktext="value: ; color:#8ff; size:0.26" position="0 -0.2 0.02"></a-entity>
  </a-entity>

  <a-entity light="type:hemisphere; intensity:0.5; color:#8fa0d0; groundColor:#241038"></a-entity>
  <a-entity light="type:directional; intensity:0.45; color:#cfd8f0" position="2 4 3"></a-entity>  <!-- 부드러운 키 라이트(과노출 방지) -->
  <a-entity light="type:point; intensity:0.7; distance:30; color:#ff2a6d" position="-4 3 -6"></a-entity>
  <a-entity light="type:point; intensity:0.6; distance:26; color:#05d9e8" position="4 2 0"></a-entity>

  <a-entity id="rig">
    <a-camera position="0 1.6 0" wasd-controls="enabled:true" look-controls="touchEnabled:false">
      <a-plane id="dmg" position="0 0 -0.6" width="4" height="4" material="shader:flat; color:#ff2070; opacity:0; transparent:true; fog:false"></a-plane>
      <a-entity cursor="rayOrigin:mouse" raycaster="objects:.clickable; far:40"></a-entity>
    </a-camera>
    <a-entity id="rhand" gun laser-controls="hand:right" raycaster="objects:.clickable; far:40; lineColor:#6cf" cursor="fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
    <a-entity id="lhand" gun laser-controls="hand:left"  raycaster="objects:.clickable; far:40; lineColor:#f6c" cursor="fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
  </a-entity>
</a-scene>

<a href="index.html" class="back">← 메뉴</a>
<div id="hint">🚀 VR 입장 → 비트에 맞춰 외계 함선 격추(방아쇠) · 적탄은 몸으로 회피! · 폰: 함선 탭=사격, 방향키·화면 쓸기로 회피</div>

<!-- 코크핏 HUD(1인칭): 중앙 레티클 + 모서리 프레임. 플레이 중 표시. -->
<div id="cockpit" aria-hidden="true">
  <div id="reticle"><span class="rc rc-t"></span><span class="rc rc-b"></span><span class="rc rc-l"></span><span class="rc rc-r"></span></div>
  <span class="cbk cbk-tl"></span><span class="cbk cbk-tr"></span><span class="cbk cbk-bl"></span><span class="cbk cbk-br"></span>
</div>
<style>
  #cockpit{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
  #cockpit.on{display:block}
  #reticle{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);transition:transform .08s ease, opacity .12s}
  #reticle:before{content:"";position:absolute;inset:0;border:1.5px solid rgba(127,233,255,.55);border-radius:50%;box-shadow:0 0 8px rgba(127,233,255,.4)}
  #reticle:after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;background:#7fe9ff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px #7fe9ff}
  #reticle .rc{position:absolute;background:rgba(127,233,255,.75)}
  .rc-t,.rc-b{left:50%;width:1.5px;height:8px;transform:translateX(-50%)} .rc-t{top:-5px} .rc-b{bottom:-5px}
  .rc-l,.rc-r{top:50%;height:1.5px;width:8px;transform:translateY(-50%)} .rc-l{left:-5px} .rc-r{right:-5px}
  #reticle.fire{transform:translate(-50%,-50%) scale(1.5);opacity:.7}
  #reticle.fire:before{border-color:#ff5a8a;box-shadow:0 0 14px #ff2a6d}
  .cbk{position:absolute;width:38px;height:38px;border:2px solid rgba(177,75,255,.35)}
  .cbk-tl{left:12px;top:12px;border-right:0;border-bottom:0} .cbk-tr{right:12px;top:12px;border-left:0;border-bottom:0}
  .cbk-bl{left:12px;bottom:88px;border-right:0;border-top:0} .cbk-br{right:12px;bottom:88px;border-left:0;border-top:0}
  @media (max-width:640px){ .cbk-bl,.cbk-br{bottom:118px} }
</style>

<!-- 모바일 이동 컨트롤(플레이 중 터치 기기에서 표시): 아날로그 조이스틱(드래그) + 중앙정렬 -->
<div id="mctl">
  <div id="joy" aria-label="이동 조이스틱"><div id="joyKnob"></div></div>
  <button id="recenterBtn" aria-label="중앙정렬">⊕<br><span>중앙</span></button>
</div>
<style>
  #mctl{position:fixed;left:0;right:0;bottom:0;z-index:12;display:none;justify-content:space-between;align-items:flex-end;padding:16px 18px calc(16px + env(safe-area-inset-bottom));pointer-events:none;user-select:none;-webkit-user-select:none;touch-action:none}
  #mctl.on{display:flex}
  #joy{pointer-events:auto;position:relative;width:128px;height:128px;border-radius:50%;border:1.5px solid rgba(127,233,255,.35);background:radial-gradient(circle at 50% 50%, rgba(20,16,46,.72), rgba(10,8,30,.55));box-shadow:0 2px 16px #0009, inset 0 0 22px rgba(90,70,160,.25);touch-action:none}
  #joy:before{content:"";position:absolute;inset:34%;border-radius:50%;border:1px dashed rgba(127,233,255,.2)}
  #joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 38% 34%, #b58bff, #6a3fd0 60%, #3a2170);border:1px solid rgba(220,200,255,.6);box-shadow:0 2px 10px #000a, 0 0 14px rgba(177,75,255,.5);transition:transform .05s linear;will-change:transform}
  #joy.act #joyKnob{transition:none}
  #recenterBtn{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:1px solid #2aa7c0;background:#06202acc;color:#7fe9ff;font-size:1.5rem;line-height:1.05;touch-action:none;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 10px #0008}
  #recenterBtn span{font-size:.62rem;letter-spacing:1px}
  #recenterBtn:active{background:#0a3a48cc;color:#fff}
</style>

<script>
'use strict';
window.__gunPlaying=false;
var scene=document.querySelector('a-scene'), field=document.getElementById('field'), world=document.getElementById('world');
var score=0, combo=0, maxCombo=0, lives=5, best=0, beatFallback=null, audioBeatSeen=false;
var BEATMS=500;
var level=1, kills=0, beatCount=0; var KILLS_PER=10, MAXLV=10;
/* 레벨별 난이도(1=쉬움 → 10=어려움). spd=함선 속도, maxE=동시 최대, shooter=적탄 발사 확률,
   dbl=한 비트에 2기 스폰 확률, bull=적탄 속도, every=스폰 간격(비트 수), feat=승급 안내 */
var LV=[
  {spd:[2.0,2.5], maxE:2, shooter:0.0,  dbl:0.0, bull:4.2, every:2, feat:'적 함선 격추 연습 — 적탄 없음'},
  {spd:[2.3,2.9], maxE:3, shooter:0.0,  dbl:0.0, bull:4.4, every:2, feat:'조금 더 빠른 함선'},
  {spd:[2.6,3.2], maxE:3, shooter:0.22, dbl:0.0, bull:4.8, every:2, feat:'⚠ 적탄 등장! 조이스틱·몸으로 회피'},
  {spd:[2.9,3.6], maxE:4, shooter:0.32, dbl:0.18,bull:5.1, every:1, feat:'동시 2기 출현'},
  {spd:[3.2,4.0], maxE:4, shooter:0.42, dbl:0.28,bull:5.4, every:1, feat:'사격 빈도 증가'},
  {spd:[3.5,4.4], maxE:5, shooter:0.5,  dbl:0.34,bull:5.8, every:1, feat:'더 빠른 적탄'},
  {spd:[3.8,4.8], maxE:5, shooter:0.58, dbl:0.4, bull:6.2, every:1, feat:'편대 공세'},
  {spd:[4.1,5.2], maxE:6, shooter:0.66, dbl:0.5, bull:6.6, every:1, feat:'고속 함선'},
  {spd:[4.5,5.6], maxE:6, shooter:0.74, dbl:0.6, bull:7.0, every:1, feat:'집중 포화'},
  {spd:[4.9,6.0], maxE:7, shooter:0.82, dbl:0.7, bull:7.4, every:1, feat:'최종 웨이브 — 살아남아라!'}
];
function curLV(){ return LV[Math.min(level,MAXLV)-1]; }
try{ best=parseInt(localStorage.getItem('gun_best')||'0',10)||0; }catch(e){}
function rand(a,b){return a+Math.random()*(b-a);}

/* ── 배경/바닥 반실사 텍스처 적용 (GUNVIZ, 1회) ── */
var visualsReady=false;
function applyVisuals(){ if(visualsReady || !window.GUNVIZ) return; visualsReady=true;
  try{ GUNVIZ.preload(); }catch(e){}
  try{ var sky=document.getElementById('sky'); if(sky) sky.setAttribute('material','shader:flat; color:#06030f; src:'+GUNVIZ.skyTexture().src); }catch(e){}
}

/* ── 스프라이트 연출(빌보드 평면 팽창·페이드) ── */
function spriteBurst(src, pos, w0, w1, dur){
  if(!src) return;
  var p=document.createElement('a-plane');
  p.setAttribute('width','1'); p.setAttribute('height','1');
  p.setAttribute('material','shader:flat; src:'+src+'; transparent:true; alphaTest:0.01; blending:additive; opacity:1; fog:false');
  p.setAttribute('billboard',''); p.setAttribute('position', pos);
  p.setAttribute('animation__s','property:scale; from:'+w0+' '+w0+' 1; to:'+w1+' '+w1+' 1; dur:'+dur+'; easing:easeOutCubic');
  p.setAttribute('animation__o','property:material.opacity; from:1; to:0; dur:'+(dur+60)+'; easing:easeInQuad');
  field.appendChild(p);
  setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, dur+120);
}
function worldPosStr(el, dy){ try{ var v=new AFRAME.THREE.Vector3(); el.object3D.getWorldPosition(v); return v.x.toFixed(2)+' '+(v.y+(dy||0)).toFixed(2)+' '+v.z.toFixed(2); }catch(e){ return '0 1.4 -6'; } }

/* ── 네온 게이트 링(우주 정거장 고리를 통과하는 전진감) — 가장자리만 감싸 중앙은 비움 ── */
function buildWorld(){ world.innerHTML='';
  for(var i=0;i<8;i++){ var z=-46+i*6;
    var ring=document.createElement('a-torus');
    ring.setAttribute('radius','4.2'); ring.setAttribute('radius-tubular','0.035'); ring.setAttribute('segments-tubular','8');
    ring.setAttribute('material','shader:flat; color:'+(i%2?'#13e9ff':'#ff3df0'));
    ring.setAttribute('position','0 1.4 '+z); ring.setAttribute('scroll','reset:-46; limit:5'); world.appendChild(ring);
  }
}

function updateHUD(){ var s=document.getElementById('scoreT'), c=document.getElementById('comboT'), l=document.getElementById('livesT'), lv=document.getElementById('lvT');
  if(s) s.setAttribute('ktext','value','점수 '+score); if(c) c.setAttribute('ktext','value', combo>1?('x'+combo+' 콤보'):' '); if(l) l.setAttribute('ktext','value', lives>0?'❤'.repeat(lives):'💀');
  if(lv) lv.setAttribute('ktext','value','LV '+level+'   '+kills+'/'+KILLS_PER); }
function flash(){ var d=document.getElementById('dmg'); if(!d) return; d.setAttribute('material','opacity',0.3); setTimeout(function(){ d.setAttribute('material','opacity',0); },140); }
var _banT=null;
function showBanner(txt, ms){ var b=document.getElementById('banner'); if(!b) return;
  b.setAttribute('ktext','value',txt); b.setAttribute('visible',true);
  clearTimeout(_banT); _banT=setTimeout(function(){ b.setAttribute('visible',false); }, ms||2200); }
function levelUp(){ level++;
  if(level>MAXLV){ winGame(); return; }
  kills=0; if(lives<6) lives++;                       // 승급 보너스: 생명 +1(최대 6)
  score+=100;                                          // 클리어 보너스
  if(window.GUNAUDIO){ GUNAUDIO.hit(true); }           // 승급 효과음
  showBanner('LV '+level+' 돌입!\n'+curLV().feat, 2400);
  updateHUD();
}

/* 게임 비트: 음악 리듬 베드(GUNAUDIO.onBeat)가 구동. 레벨별 스폰 간격/동시수. 오디오 불가 시 setInterval 폴백 */
function gameBeat(info){ audioBeatSeen=true; beatCount++;
  var dot=document.getElementById('beatDot'); if(dot){ dot.setAttribute('scale','1.6 1.6 1'); setTimeout(function(){ dot.setAttribute('scale','1 1 1'); },120); }
  var L=curLV();
  if(beatCount % L.every === 0){ spawnEnemy(); if(Math.random()<L.dbl) setTimeout(spawnEnemy,210); }
}

function spawnEnemy(){ if(!window.__gunPlaying) return; var L=curLV(); if(document.querySelectorAll('.enemy:not([data-dead])').length>=L.maxE) return;
  var lane=[-1.6,-0.8,0,0.8,1.6][Math.floor(Math.random()*5)];
  var variant=Math.floor(Math.random()*3);
  var e=document.createElement('a-entity'); e.setAttribute('class','enemy clickable');
  e.setAttribute('enemy-ship','variant:'+variant);                 // 실제 3D 셰이딩 외계 함선
  e.setAttribute('position', lane+' 1.4 -20'); e.setAttribute('approach','speed: '+rand(L.spd[0],L.spd[1]).toFixed(1));
  e.dataset.shooter = Math.random()<L.shooter ? '1':'0'; e.dataset.variant=variant;
  // 3D 함선은 틈이 있어 레이캐스트가 샐 수 있어, 보이지 않는 박스 콜라이더(투명·visible)를 자식으로 둠
  e.innerHTML='<a-box class="clickable" width="0.9" height="0.7" depth="0.9" material="shader:flat; opacity:0; transparent:true" data-hitbox="1"></a-box>';
  field.appendChild(e);
}
window.__gunEnemyShoot=function(enemyEl){ if(!window.__gunPlaying || enemyEl.dataset.dead) return;
  var ep={x:0,y:1.7,z:-9}; try{ var v=new AFRAME.THREE.Vector3(); enemyEl.object3D.getWorldPosition(v); ep={x:v.x,y:v.y+0.6,z:v.z}; }catch(e){}
  var cp={x:0,y:1.6,z:0}; try{ var cv=new AFRAME.THREE.Vector3(); scene.camera.getWorldPosition(cv); cp={x:cv.x,y:cv.y,z:cv.z}; }catch(e){}
  var dx=cp.x-ep.x, dy=cp.y-ep.y, dz=cp.z-ep.z, d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
  var b=document.createElement('a-plane'); b.setAttribute('class','bullet'); b.setAttribute('width','0.5'); b.setAttribute('height','0.5');
  b.setAttribute('material','shader:flat; src:'+GVS('bullet')+'; transparent:true; alphaTest:0.01; blending:additive; fog:false');
  b.setAttribute('billboard','');
  b.setAttribute('position', ep.x.toFixed(2)+' '+ep.y.toFixed(2)+' '+ep.z.toFixed(2));
  b.setAttribute('incoming','dx:'+(dx/d).toFixed(3)+'; dy:'+(dy/d).toFixed(3)+'; dz:'+(dz/d).toFixed(3)+'; speed:'+curLV().bull);
  field.appendChild(b); if(window.GUNAUDIO) GUNAUDIO.dryFire();
};
function isOnBeat(){ try{ return !!(window.GUNAUDIO && GUNAUDIO.beatInfo().onBeat); }catch(e){ return false; } }
function killEnemy(el){ if(el.dataset.dead) return; el.dataset.dead='1'; combo++; maxCombo=Math.max(maxCombo,combo);
  var onb=isOnBeat(); var pts=(onb?20:10)*Math.min(8,combo); score+=pts;
  kills++;
  if(window.GUNAUDIO) GUNAUDIO.hit(onb);
  spriteBurst(GVS('burst'), worldPosStr(el,0.3), 0.3, (onb?2.8:2.2), 260);
  el.setAttribute('scale','0.01 0.01 0.01'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },60);
  if(kills>=KILLS_PER){ levelUp(); } else { updateHUD(); } }
window.__gunReached=function(el){ if(el.dataset.dead) return; el.dataset.dead='1'; combo=0; lives--; flash(); if(window.GUNAUDIO) GUNAUDIO.playerHurt(); updateHUD();
  if(el.parentNode) el.parentNode.removeChild(el); if(lives<=0) endGame(); };
window.__gunPlayerHit=function(b){ if(b.dataset.dead) return; b.dataset.dead='1'; if(b.parentNode) b.parentNode.removeChild(b); combo=0; lives--; flash(); if(window.GUNAUDIO) GUNAUDIO.playerHurt(); updateHUD(); if(lives<=0) endGame(); };

function clearField(){ var xs=document.querySelectorAll('.enemy,.bullet'); for(var i=0;i<xs.length;i++) xs[i].parentNode.removeChild(xs[i]); }
function startGame(){ score=0; combo=0; maxCombo=0; lives=5; level=1; kills=0; beatCount=0; window.__gunPlaying=true; updateHUD(); applyVisuals(); buildWorld();
  document.getElementById('hud').setAttribute('visible',true);
  document.getElementById('startWrap').setAttribute('visible',false);
  document.getElementById('startBtn').setAttribute('visible',false);   // 레이캐스트에서 제외(빈 곳 탭 리셋 방지)
  document.getElementById('gameover').setAttribute('visible',false);
  showMobileCtl(true); showCockpit(true);
  document.getElementById('helpTxt').setAttribute('visible',false);
  clearField(); recenter();
  showBanner('LV 1 돌입!\n'+curLV().feat, 2600);
  // 음악 리듬 베드 시작 → onBeat가 스폰/비트연출 구동
  audioBeatSeen=false; clearInterval(beatFallback); beatFallback=null;
  if(window.GUNAUDIO){ GUNAUDIO.ensure(); GUNAUDIO.onBeat=function(info){ if(window.__gunPlaying) gameBeat(info); }; GUNAUDIO.music.start(120); }
  // 오디오가 막혀 비트가 안 오면 폴백 타이머로 진행
  setTimeout(function(){ if(window.__gunPlaying && !audioBeatSeen){ beatFallback=setInterval(function(){ if(window.__gunPlaying) gameBeat({downbeat:true}); }, BEATMS); } }, 1400);
  gameBeat({downbeat:true});
}
function winGame(){ endGame(true); }
function endGame(win){ window.__gunPlaying=false; clearInterval(beatFallback); beatFallback=null;
  if(window.GUNAUDIO){ GUNAUDIO.music.stop(); if(win){ GUNAUDIO.hit(true); } else { GUNAUDIO.playerHurt(); } GUNAUDIO.onBeat=null; }
  clearField();
  if(score>best){ best=score; try{localStorage.setItem('gun_best',String(best));}catch(e){} }
  document.getElementById('hud').setAttribute('visible',false);
  document.getElementById('goTitle').setAttribute('ktext','value', win?'전 구간 클리어! 🏆':'격추됨… LV '+level+' 🚀');
  document.getElementById('finalScore').setAttribute('ktext','value','점수 '+score+'  ·  LV '+level+'  ·  최고콤보 '+maxCombo+'  ·  최고 '+best);
  document.getElementById('gameover').setAttribute('visible',true);
  document.getElementById('startTxt').setAttribute('ktext','value','다시하기 ↻');
  document.getElementById('startWrap').setAttribute('visible',true);
  document.getElementById('startBtn').setAttribute('visible',true);
  showMobileCtl(false); showCockpit(false); recenter();
}
scene.addEventListener('click', function(evt){ var el=evt.target; if(!el) return;
  if(el.id==='startBtn'){ if(!window.__gunPlaying) startGame(); return; }
  if(window.__gunPlaying){ var en=(el.closest?el.closest('.enemy'):null)||(el.classList&&el.classList.contains('enemy')?el:null);
    if(en){ if(window.GUNAUDIO) GUNAUDIO.shot('r'); if(window.pulseReticle) window.pulseReticle(); killEnemy(en); } } });
/* 모바일: 적을 탭하면 사격(.clickable로 자동 처리), 빈 곳 탭은 발사음 피드백 */
window.__vrTapAt=function(){ if(window.__gunPlaying){ if(window.GUNAUDIO) GUNAUDIO.shot('r'); if(window.pulseReticle) window.pulseReticle(); } };

/* 로드되면 배경/바닥 반실사 텍스처 적용(시작 전에도 분위기) */
if(scene.hasLoaded) applyVisuals(); else scene.addEventListener('loaded', applyVisuals);

/* ══════ 모바일/터치 이동: 방향키 홀드 + 화면 쓸기(스와이프) + 중앙정렬 ══════
   화면을 쓸면 시점이 도는 대신(look-controls touchEnabled:false) 플레이어가 상하좌우로 회피.
   리그(#rig)를 좌우(x)·상하(y)로 이동 → 카메라 월드좌표가 움직여 날아오는 총알을 피함. */
var rig=document.getElementById('rig');
var off={x:0,y:0}, joyVec={x:0,y:0};     // joyVec: 아날로그 조이스틱 입력(-1..1)
var LIMX=2.6, LIMY_UP=0.95, LIMY_DN=-0.5;
function clampN(v,a,b){ return v<a?a:(v>b?b:v); }
function applyRig(){ try{ if(rig&&rig.object3D){ rig.object3D.position.x=off.x; rig.object3D.position.y=off.y; } }catch(e){} }
function nudge(dx,dy){ off.x=clampN(off.x+dx,-LIMX,LIMX); off.y=clampN(off.y+dy,LIMY_DN,LIMY_UP); applyRig(); }
function recenter(){ off.x=0; off.y=0; try{ if(rig&&rig.object3D){ rig.object3D.position.set(0,0,0); rig.object3D.rotation.set(0,0,0); } }catch(e){} }
function moveLoop(){ if(joyVec.x||joyVec.y){ var sp=0.075;    // 아날로그: 기울인 만큼 비례 이동
    off.x=clampN(off.x+joyVec.x*sp,-LIMX,LIMX); off.y=clampN(off.y+(-joyVec.y)*sp,LIMY_DN,LIMY_UP); applyRig(); }
  requestAnimationFrame(moveLoop); }
requestAnimationFrame(moveLoop);
var IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
function showMobileCtl(on){ var m=document.getElementById('mctl'); if(!m) return; if(on&&IS_TOUCH) m.classList.add('on'); else m.classList.remove('on'); }
function showCockpit(on){ var c=document.getElementById('cockpit'); if(c) c.classList.toggle('on', !!on); }
var _retT=null;
window.pulseReticle=function(){ var r=document.getElementById('reticle'); if(!r) return; r.classList.add('fire'); clearTimeout(_retT); _retT=setTimeout(function(){ r.classList.remove('fire'); },90); };
/* 아날로그 조이스틱: base 안에서 knob을 드래그 → joyVec(-1..1). 놓으면 중앙 복귀(이동 정지). */
(function(){ var pad=document.getElementById('mctl'); if(!pad) return;
  ['touchstart','touchend','touchmove','pointerdown','pointerup','pointermove'].forEach(function(ev){ pad.addEventListener(ev, function(e){ e.stopPropagation(); }, {passive:false}); });
  var joy=document.getElementById('joy'), knob=document.getElementById('joyKnob'); if(!joy||!knob) return;
  var R=44, active=false, pid=null;
  function setFromEvent(e){ var r=joy.getBoundingClientRect(); var cx=r.left+r.width/2, cy=r.top+r.height/2;
    var dx=e.clientX-cx, dy=e.clientY-cy, d=Math.sqrt(dx*dx+dy*dy); if(d>R){ dx=dx/d*R; dy=dy/d*R; }
    knob.style.transform='translate('+dx+'px,'+dy+'px)'; joyVec.x=dx/R; joyVec.y=dy/R; }
  function reset(){ active=false; pid=null; joyVec.x=0; joyVec.y=0; knob.style.transform='translate(0,0)'; joy.classList.remove('act'); }
  joy.addEventListener('pointerdown', function(e){ e.preventDefault(); active=true; pid=e.pointerId; joy.classList.add('act'); try{ joy.setPointerCapture(e.pointerId); }catch(_){} setFromEvent(e); });
  joy.addEventListener('pointermove', function(e){ if(active && (pid===null||e.pointerId===pid)){ e.preventDefault(); setFromEvent(e); } });
  joy.addEventListener('pointerup', function(e){ if(pid===null||e.pointerId===pid) reset(); });
  joy.addEventListener('pointercancel', reset); joy.addEventListener('pointerleave', function(e){ if(active && e.pointerId===pid){ /* 캡처 중이면 유지 */ } });
  var rc=document.getElementById('recenterBtn'); if(rc) rc.addEventListener('pointerdown', function(e){ e.preventDefault(); recenter(); });
})();
/* 빈 화면 쓸기(드래그) = 이동 한 칸. 탭(정지)은 vr-common이 사격으로 처리 */
(function(){ var s=null;
  window.addEventListener('touchstart', function(e){ if(e.touches.length===1){ var t=e.touches[0]; s=[t.clientX,t.clientY,Date.now()]; } }, {passive:true});
  window.addEventListener('touchend', function(e){ if(!s) return; var t=e.changedTouches[0];
    var dx=t.clientX-s[0], dy=t.clientY-s[1], dt=Date.now()-s[2]; s=null;
    if(dt>700) return; var ax=Math.abs(dx), ay=Math.abs(dy); if(ax<34&&ay<34) return;   // 탭은 사격
    if(ax>ay) nudge(dx>0?0.85:-0.85, 0); else nudge(0, dy<0?0.6:-0.6); }, {passive:true});
})();

window.__GUN_TEST__={ start:startGame, end:function(){ endGame(false); }, spawn:spawnEnemy, beat:function(){ gameBeat({downbeat:true}); },
  nudge:nudge, recenter:recenter, setJoy:function(x,y){ joyVec.x=x; joyVec.y=y; }, get offX(){return off.x}, get offY(){return off.y},
  get playing(){return window.__gunPlaying}, get score(){return score}, get combo(){return combo}, get lives(){return lives}, get best(){return best},
  get level(){return level}, get kills(){return kills}, get KILLS_PER(){return KILLS_PER}, get maxEnemies(){return curLV().maxE}, get shooterProb(){return curLV().shooter},
  get nEnemies(){return document.querySelectorAll('.enemy:not([data-dead])').length}, get nBullets(){return document.querySelectorAll('.bullet').length},
  killOne:function(){ var e=document.querySelector('.enemy:not([data-dead])'); if(e) killEnemy(e); },
  reachOne:function(){ var e=document.querySelector('.enemy:not([data-dead])'); if(e) window.__gunReached(e); },
  shoot:function(){ var e=document.querySelector('.enemy:not([data-dead])'); if(e) window.__gunEnemyShoot(e); },
  hitPlayer:function(){ var b=document.querySelector('.bullet'); if(b) window.__gunPlayerHit(b); else { lives--; updateHUD(); if(lives<=0) endGame(); } },
  renderOffline:function(s){ return (window.GUNAUDIO&&GUNAUDIO.renderOfflineTest)?GUNAUDIO.renderOfflineTest(s||3):Promise.resolve(null); } };
</script>
