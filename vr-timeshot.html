<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시간정지 슈터</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script>
if(window.AFRAME){
  // 내(머리+양손)가 움직인 양으로 시간 흐름(timeScale) 결정 — 멈추면 느려지고 움직이면 흐름
  AFRAME.registerComponent('motion-time',{
    init:function(){ this.c=new THREE.Vector3(); this.pc=new THREE.Vector3(); this.l=new THREE.Vector3(); this.pl=new THREE.Vector3();
      this.r=new THREE.Vector3(); this.pr=new THREE.Vector3(); this.lh=document.getElementById('lhand'); this.rh=document.getElementById('rhand'); this.ready=false;
      window.__timeScale=0.08; },
    tick:function(t,dt){ var cam=this.el.sceneEl.camera; if(!cam) return; dt=dt||16; cam.getWorldPosition(this.c);
      var lo=this.lh&&this.lh.object3D, ro=this.rh&&this.rh.object3D; if(lo) lo.getWorldPosition(this.l); if(ro) ro.getWorldPosition(this.r);
      if(!this.ready){ this.pc.copy(this.c); this.pl.copy(this.l); this.pr.copy(this.r); this.ready=true; return; }
      var mv=this.pc.distanceTo(this.c)+(lo?this.pl.distanceTo(this.l):0)+(ro?this.pr.distanceTo(this.r):0);
      this.pc.copy(this.c); this.pl.copy(this.l); this.pr.copy(this.r);
      var speed=mv/(dt/1000); var target=Math.min(1, 0.07+speed*0.4);
      window.__timeScale += (target-(window.__timeScale||0.08))*0.18; }
  });
  AFRAME.registerComponent('enemy',{
    init:function(){ this.shootT=0.8+Math.random()*1.6; },
    tick:function(t,dt){ if(!window.__shotPlaying || this.el.dataset.dead) return; var k=(dt||16)/1000*(window.__timeScale||0.08);
      var p=this.el.object3D.position; var d=Math.sqrt(p.x*p.x+p.z*p.z); if(d>2.1){ p.x-=p.x/d*0.55*k; p.z-=p.z/d*0.55*k; }
      this.shootT-=k; if(this.shootT<=0){ this.shootT=1.5+Math.random()*1.4; if(window.__enemyShoot) window.__enemyShoot(this.el); } }
  });
  AFRAME.registerComponent('bullet',{
    schema:{dx:{default:0},dy:{default:0},dz:{default:1},speed:{default:3}},
    init:function(){ this._v=new THREE.Vector3(); },
    tick:function(t,dt){ if(!window.__shotPlaying) return; var k=(dt||16)/1000*(window.__timeScale||0.08);
      var p=this.el.object3D.position; p.x+=this.data.dx*this.data.speed*k; p.y+=this.data.dy*this.data.speed*k; p.z+=this.data.dz*this.data.speed*k;
      var cam=this.el.sceneEl.camera; if(cam && !this.el.dataset.dead){ cam.getWorldPosition(this._v); if(this._v.distanceTo(p)<0.28){ if(window.__playerHit) window.__playerHit(this.el); return; } }
      if(Math.abs(p.x)>20||Math.abs(p.z)>20||p.y<-2||p.y>12){ if(this.el.parentNode) this.el.parentNode.removeChild(this.el); } }
  });
  AFRAME.registerComponent('timebar',{ tick:function(){ var ts=window.__timeScale||0.08; this.el.object3D.scale.x=Math.max(0.02,Math.min(1,ts));
    this.el.setAttribute('material','color', ts<0.3?'#49a0ff':(ts<0.7?'#ffb020':'#ff5a3c')); } });
}
</script>
<style>
  html,body{margin:0;height:100%;background:#0a0a12;font-family:-apple-system,"Malgun Gothic","Segoe UI","Noto Sans KR",sans-serif}
  a.back{position:fixed;top:12px;left:12px;z-index:11;color:#dde;text-decoration:none;font-size:.9rem;background:#0b0f17cc;border:1px solid #2a3545;border-radius:10px;padding:8px 12px}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#b7c0d6;font-size:.85rem;z-index:11;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<a-scene motion-time background="color:#0a0a12" vr-mode-ui="enabled:true" device-orientation-permission-ui="enabled:false">
  <a-sky color="#0a0a12"></a-sky>
  <a-plane rotation="-90 0 0" width="50" height="50" color="#f4f6fb" material="shader:flat"></a-plane>
  <a-plane rotation="-90 0 0" width="50" height="50" position="0 0.01 0" material="shader:flat; color:#d9dfea; opacity:0.0; transparent:true"></a-plane>

  <a-entity id="hud" visible="false">
    <a-text id="scoreT" value="점수 0" align="center" width="10" color="#13263b" position="-2.4 3.2 -5"></a-text>
    <a-text id="livesT" value="❤❤❤" align="center" width="10" color="#e23b3b" position="2.4 3.2 -5"></a-text>
    <a-text value="시간 흐름" align="center" width="8" color="#5a6b84" position="0 3.6 -5"></a-text>
    <a-plane id="tbar" timebar width="1.3" height="0.09" material="shader:flat; color:#49a0ff" position="0 3.32 -5"></a-plane>
  </a-entity>

  <a-entity id="field"></a-entity>

  <a-text id="helpTxt" value="가만히 있으면 시간이 느려져요. 움직이면 흘러요!&#10;총알을 피하고(머리 움직여 피하기), 빨간 적을 방아쇠로 쏘세요." align="center" width="5.4" color="#2a3850" position="0 1.5 -4"></a-text>

  <a-entity id="startWrap" position="0 1.9 -3.2">
    <a-plane id="startBtn" class="clickable" width="2.8" height="0.9" material="shader:flat; color:#2ec27e"></a-plane>
    <a-text id="startTxt" value="▶ 시작" align="center" width="6.5" color="#fff" position="0 0 0.01"></a-text>
  </a-entity>

  <a-entity id="gameover" visible="false" position="0 2.6 -3.4">
    <a-plane width="3.4" height="1.3" material="shader:flat; color:#0e1d30; opacity:0.92"></a-plane>
    <a-text value="게임 끝! ⏱️" align="center" width="6" color="#fff" position="0 0.34 0.01"></a-text>
    <a-text id="finalScore" value="" align="center" width="5.4" color="#8fe3c0" position="0 -0.2 0.01"></a-text>
  </a-entity>

  <a-entity light="type:ambient; intensity:0.95"></a-entity>
  <a-entity light="type:directional; intensity:0.3" position="1 3 1"></a-entity>

  <a-entity id="rig">
    <a-camera position="0 1.6 0" wasd-controls="enabled:true">
      <a-plane id="dmg" position="0 0 -0.6" width="4" height="4" material="shader:flat; color:#ff0000; opacity:0; transparent:true"></a-plane>
      <a-entity cursor="rayOrigin:mouse" raycaster="objects:.clickable; far:40"></a-entity>
    </a-camera>
    <a-entity id="rhand" laser-controls="hand:right" raycaster="objects:.clickable; far:40; lineColor:#4af" cursor="fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
    <a-entity id="lhand" laser-controls="hand:left"  raycaster="objects:.clickable; far:40; lineColor:#4af" cursor="fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
  </a-entity>
</a-scene>

<a href="index.html" class="back">← 메뉴</a>
<div id="hint">🥽 VR 입장 → 가만히=느린시간, 움직이면=시간흐름 · 총알 피하고 적 쏘기! (PC·폰 마우스 가능)</div>

<script>
'use strict';
window.__timeScale=0.08; window.__shotPlaying=false;
var scene=document.querySelector('a-scene'), field=document.getElementById('field');
var score=0, lives=3, best=0, spawner=null;
try{ best=parseInt(localStorage.getItem('timeshot_best')||'0',10)||0; }catch(e){}
function rand(a,b){return a+Math.random()*(b-a);}

var actx=null;
function beep(f,d,type){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  var o=actx.createOscillator(), g=actx.createGain(); o.type=type||'sawtooth'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0.13,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d); o.start(); o.stop(actx.currentTime+d);
}catch(e){} }

function updateHUD(){ var s=document.getElementById('scoreT'), l=document.getElementById('livesT');
  if(s) s.setAttribute('value','점수 '+score); if(l) l.setAttribute('value', lives>0? '❤'.repeat(lives) : '💀'); }
function flash(){ var d=document.getElementById('dmg'); if(!d) return; d.setAttribute('material','opacity',0.45);
  setTimeout(function(){ d.setAttribute('material','opacity',0); },150); }

function spawnEnemy(){ if(!window.__shotPlaying) return; if(document.querySelectorAll('.enemy').length>=6) return;
  var ang=rand(-1.25,1.25), dist=rand(5,8), x=Math.sin(ang)*dist, z=-Math.cos(ang)*dist;
  var e=document.createElement('a-entity'); e.setAttribute('class','enemy clickable');
  e.setAttribute('geometry','primitive: box; width:0.5; height:1.05; depth:0.32');
  e.setAttribute('material','shader:flat; color:#e23b3b'); e.setAttribute('position', x.toFixed(2)+' 1.0 '+z.toFixed(2)); e.setAttribute('enemy','');
  e.innerHTML='<a-sphere radius="0.21" color="#b92a2a" position="0 0.72 0" material="shader:flat"></a-sphere>';
  field.appendChild(e);
}
window.__enemyShoot=function(enemyEl){ if(!window.__shotPlaying || enemyEl.dataset.dead) return;
  var ep={x:0,y:1.7,z:-5}; try{ var v=new AFRAME.THREE.Vector3(); enemyEl.object3D.getWorldPosition(v); ep={x:v.x,y:v.y+0.7,z:v.z}; }catch(e){}
  var cp={x:0,y:1.6,z:0}; try{ var cv=new AFRAME.THREE.Vector3(); scene.camera.getWorldPosition(cv); cp={x:cv.x,y:cv.y,z:cv.z}; }catch(e){}
  var dx=cp.x-ep.x, dy=cp.y-ep.y, dz=cp.z-ep.z, d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
  var b=document.createElement('a-sphere'); b.setAttribute('class','bullet'); b.setAttribute('radius','0.1'); b.setAttribute('material','shader:flat; color:#ff5a3c');
  b.setAttribute('position', ep.x.toFixed(2)+' '+ep.y.toFixed(2)+' '+ep.z.toFixed(2));
  b.setAttribute('bullet','dx:'+(dx/d).toFixed(3)+'; dy:'+(dy/d).toFixed(3)+'; dz:'+(dz/d).toFixed(3)+'; speed:3.0');
  field.appendChild(b); beep(260,0.05,'square');
};
function killEnemy(el){ if(el.dataset.dead) return; el.dataset.dead='1'; score++; updateHUD(); beep(880,0.06,'square');
  el.setAttribute('scale','0.01 0.01 0.01'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },60); }
window.__playerHit=function(bulletEl){ if(bulletEl.dataset.dead) return; bulletEl.dataset.dead='1'; if(bulletEl.parentNode) bulletEl.parentNode.removeChild(bulletEl);
  lives--; updateHUD(); flash(); beep(150,0.22,'sawtooth'); if(lives<=0) endGame(); };

function clearField(){ var xs=document.querySelectorAll('.enemy,.bullet'); for(var i=0;i<xs.length;i++) xs[i].parentNode.removeChild(xs[i]); }
function startGame(){ score=0; lives=3; window.__shotPlaying=true; updateHUD();
  document.getElementById('hud').setAttribute('visible',true);
  document.getElementById('startWrap').setAttribute('visible',false);
  document.getElementById('gameover').setAttribute('visible',false);
  document.getElementById('helpTxt').setAttribute('visible',false);
  clearField(); clearInterval(spawner); spawner=setInterval(spawnEnemy,1500); spawnEnemy(); spawnEnemy();
}
function endGame(){ window.__shotPlaying=false; clearInterval(spawner); clearField();
  if(score>best){ best=score; try{localStorage.setItem('timeshot_best',String(best));}catch(e){} }
  document.getElementById('hud').setAttribute('visible',false);
  document.getElementById('finalScore').setAttribute('value','처치 '+score+'  ·  최고 '+best);
  document.getElementById('gameover').setAttribute('visible',true);
  document.getElementById('startTxt').setAttribute('value','다시하기 ↻');
  document.getElementById('startWrap').setAttribute('visible',true); beep(300,0.25,'sawtooth');
}
scene.addEventListener('click', function(evt){ var el=evt.target; if(!el) return;
  if(el.id==='startBtn'){ startGame(); return; }
  if(window.__shotPlaying && el.classList && el.classList.contains('enemy')){ killEnemy(el); beep(1200,0.04,'square'); } });

window.__SHOT_TEST__={ start:startGame, end:endGame, spawnEnemy:spawnEnemy,
  get playing(){return window.__shotPlaying}, get score(){return score}, get lives(){return lives}, get best(){return best},
  get nEnemies(){return document.querySelectorAll('.enemy').length}, get nBullets(){return document.querySelectorAll('.bullet').length},
  killOne:function(){ var e=document.querySelector('.enemy'); if(e) killEnemy(e); },
  shootAtPlayer:function(){ var e=document.querySelector('.enemy'); if(e) window.__enemyShoot(e); },
  hitPlayer:function(){ var b=document.querySelector('.bullet'); if(b){ window.__playerHit(b); } else { lives--; updateHUD(); if(lives<=0) endGame(); } } };
</script>
</body>
</html>
