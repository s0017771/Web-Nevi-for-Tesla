<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시간정지 슈터</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="vr-common.js"></script>
<script>
/* ═══════════════ GFX — 캔버스 반실사 스프라이트/환경 텍스처 (data URL, 캐싱) ═══════════════ */
window.GFX = (function () {
  'use strict';
  var BLANK = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
  var cache = {};
  function mk(w, h, drawFn) {
    try { var c = document.createElement('canvas'); c.width = w; c.height = h; var ctx = c.getContext('2d');
      if (!ctx) return BLANK; drawFn(ctx, w, h); return c.toDataURL('image/png'); } catch (e) { return BLANK; }
  }
  function cached(key, fn) { if (cache[key]) return cache[key]; var url; try { url = fn(); } catch (e) { url = BLANK; } cache[key] = url || BLANK; return cache[key]; }
  function grain(ctx, w, h, count, alpha, light, dark) {
    for (var i = 0; i < count; i++) { var x = Math.random()*w, y = Math.random()*h, a = Math.random()*alpha;
      ctx.fillStyle = (Math.random()<0.5?light:dark).replace(/A\)/, (a).toFixed(3)+')'); ctx.fillRect(x, y, 1, 1); }
  }
  function softShadow(ctx, cx, cy, rx, ry, alpha) {
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
    g.addColorStop(0, 'rgba(0,0,0,'+alpha+')'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry/rx); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
  function enemyPalette(v) {
    var P = [ { base:'#2a2d33', hi:'#565b66', rim:'#ff3b2f', accent:'#111317' }, { base:'#24303a', hi:'#4c6475', rim:'#ff5a2a', accent:'#0d141a' },
      { base:'#302730', hi:'#60505f', rim:'#ff2e6a', accent:'#140f14' }, { base:'#2b3330', hi:'#536159', rim:'#ff7a1f', accent:'#101512' } ];
    return P[((v|0)%P.length+P.length)%P.length];
  }
  function hexToRgb(hex) { var n = parseInt(hex.slice(1), 16); return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255); }
  function drawEnemy(ctx, w, h, v, hit) {
    var pal = enemyPalette(v), cx = w*0.5, lean = ((v%3)-1)*10;
    softShadow(ctx, cx, h*0.955, w*0.34, w*0.09, 0.55);
    function bodyFill(x0,y0,x1,y1){ var g=ctx.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,pal.hi); g.addColorStop(0.45,pal.base); g.addColorStop(1,pal.accent); return g; }
    ctx.save(); ctx.translate(lean, 0);
    ctx.fillStyle = bodyFill(cx-60,h*0.55,cx+40,h*0.95);
    ctx.beginPath(); ctx.moveTo(cx-48,h*0.60); ctx.lineTo(cx-10,h*0.60); ctx.lineTo(cx-14,h*0.93); ctx.lineTo(cx-46,h*0.93); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+10,h*0.60); ctx.lineTo(cx+48,h*0.60); ctx.lineTo(cx+46,h*0.93); ctx.lineTo(cx+14,h*0.93); ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.accent; ctx.fillRect(cx-50,h*0.915,40,22); ctx.fillRect(cx+10,h*0.915,40,22);
    ctx.fillStyle = bodyFill(cx-70,h*0.30,cx+60,h*0.62);
    ctx.beginPath(); ctx.moveTo(cx-70,h*0.35); ctx.lineTo(cx+70,h*0.35); ctx.lineTo(cx+52,h*0.62); ctx.lineTo(cx-52,h*0.62); ctx.closePath(); ctx.fill();
    var vg = ctx.createLinearGradient(0,h*0.37,0,h*0.58); vg.addColorStop(0,'rgba(0,0,0,0.35)'); vg.addColorStop(0.5,'rgba(0,0,0,0.05)'); vg.addColorStop(1,'rgba(0,0,0,0.4)');
    ctx.fillStyle = vg; ctx.fillRect(cx-40,h*0.37,80,h*0.24);
    ctx.fillStyle = bodyFill(cx-95,h*0.37,cx-55,h*0.62);
    ctx.beginPath(); ctx.moveTo(cx-66,h*0.37); ctx.lineTo(cx-50,h*0.37); ctx.lineTo(cx-54,h*0.60); ctx.lineTo(cx-80,h*0.58); ctx.closePath(); ctx.fill();
    // 오른팔: 앞으로 뻗어 소총을 쥠
    ctx.fillStyle = bodyFill(cx+30,h*0.34,cx+95,h*0.47);
    ctx.beginPath(); ctx.moveTo(cx+50,h*0.37); ctx.lineTo(cx+64,h*0.39); ctx.lineTo(cx+96,h*0.455); ctx.lineTo(cx+86,h*0.49); ctx.lineTo(cx+52,h*0.47); ctx.closePath(); ctx.fill();
    // 소총: 개머리판→몸통→총열 + 탄창 + 조준경 (가로로 또렷하게, 상단 금속 하이라이트)
    var gy=h*0.455;
    var wg = ctx.createLinearGradient(0,gy-10,0,gy+10); wg.addColorStop(0,'#515761'); wg.addColorStop(0.5,'#1a1e24'); wg.addColorStop(1,'#06080b');
    ctx.fillStyle = wg;
    ctx.beginPath(); ctx.moveTo(cx+16,gy-5); ctx.lineTo(cx+44,gy-7); ctx.lineTo(cx+44,gy+7); ctx.lineTo(cx+16,gy+9); ctx.closePath(); ctx.fill(); // 개머리판
    ctx.fillRect(cx+44,gy-9,46,18);          // 몸통(receiver)
    ctx.fillRect(cx+90,gy-4,38,8);           // 총열(barrel)
    ctx.beginPath(); ctx.moveTo(cx+58,gy+8); ctx.lineTo(cx+76,gy+8); ctx.lineTo(cx+82,gy+42); ctx.lineTo(cx+62,gy+42); ctx.closePath(); ctx.fill(); // 탄창
    ctx.fillStyle = '#0c0f13'; ctx.fillRect(cx+52,gy-17,30,7);   // 조준경
    ctx.fillStyle = '#05070a'; ctx.fillRect(cx+126,gy-5,5,10);   // 총구
    ctx.strokeStyle = 'rgba(205,218,232,0.40)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(cx+18,gy-6); ctx.lineTo(cx+126,gy-4); ctx.stroke(); // 상단 하이라이트
    ctx.fillStyle = pal.accent; ctx.beginPath(); ctx.arc(cx+54,gy+7,7,0,6.28); ctx.fill(); ctx.beginPath(); ctx.arc(cx+94,gy+2,6,0,6.28); ctx.fill(); // 두 손(그립)
    ctx.fillStyle = pal.accent; ctx.fillRect(cx-12,h*0.30,24,h*0.06);
    var hg = ctx.createRadialGradient(cx-10,h*0.235,4,cx,h*0.26,42); hg.addColorStop(0,pal.hi); hg.addColorStop(0.6,pal.base); hg.addColorStop(1,pal.accent);
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(cx,h*0.26,36,0,Math.PI*2); ctx.fill();
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(255,60,40,0.9)';
    ctx.beginPath(); ctx.arc(cx-12,h*0.255,3.5,0,6.28); ctx.fill(); ctx.beginPath(); ctx.arc(cx+12,h*0.255,3.5,0,6.28); ctx.fill(); ctx.restore();
    ctx.restore();
    ctx.save(); ctx.globalCompositeOperation='lighter';
    // 머리/어깨 뒤 은은한 붉은 글로우(세로 띠 아티팩트 제거)
    var gl = ctx.createRadialGradient(cx,h*0.28,6,cx,h*0.30,96); gl.addColorStop(0,'rgba('+hexToRgb(pal.rim)+',0.20)'); gl.addColorStop(1,'rgba('+hexToRgb(pal.rim)+',0)');
    ctx.fillStyle = gl; ctx.fillRect(0,h*0.10,w,h*0.5);
    // 오른쪽 윤곽만 얇은 림라이트
    ctx.strokeStyle = 'rgba('+hexToRgb(pal.rim)+',0.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx+68+lean,h*0.35); ctx.lineTo(cx+50+lean,h*0.62); ctx.lineTo(cx+46+lean,h*0.93); ctx.stroke(); ctx.restore();
    grain(ctx, w, h, 2600, 0.10, 'rgba(255,255,255,A)', 'rgba(0,0,0,A)');
    if (hit) {
      ctx.save(); ctx.globalCompositeOperation='source-atop';
      var fg = ctx.createLinearGradient(0,0,0,h); fg.addColorStop(0,'rgba(255,255,255,0.85)'); fg.addColorStop(1,'rgba(255,220,200,0.7)');
      ctx.fillStyle = fg; ctx.fillRect(0,0,w,h); ctx.restore();
      ctx.save(); ctx.globalCompositeOperation='lighter';
      var og = ctx.createRadialGradient(cx,h*0.45,20,cx,h*0.45,w*0.7); og.addColorStop(0,'rgba(255,240,210,0.35)'); og.addColorStop(1,'rgba(255,240,210,0)');
      ctx.fillStyle = og; ctx.fillRect(0,0,w,h); ctx.restore();
    }
  }
  function drawSky(ctx, w, h) {
    var g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0.0,'#0a0d1f'); g.addColorStop(0.35,'#172036'); g.addColorStop(0.62,'#39364a'); g.addColorStop(0.80,'#6b4f4e'); g.addColorStop(0.92,'#9a6a4d'); g.addColorStop(1.0,'#c08a55');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    ctx.save(); ctx.globalCompositeOperation='lighter';
    var hz = ctx.createRadialGradient(w*0.5,h*0.95,20,w*0.5,h*0.95,w*0.5); hz.addColorStop(0,'rgba(255,170,90,0.35)'); hz.addColorStop(1,'rgba(255,170,90,0)');
    ctx.fillStyle = hz; ctx.fillRect(0,h*0.55,w,h*0.45); ctx.restore();
    var hb = ctx.createLinearGradient(0,h*0.68,0,h*0.86); hb.addColorStop(0,'rgba(180,170,190,0)'); hb.addColorStop(0.5,'rgba(180,170,190,0.10)'); hb.addColorStop(1,'rgba(180,170,190,0)');
    ctx.fillStyle = hb; ctx.fillRect(0,h*0.68,w,h*0.18);
    var vg = ctx.createRadialGradient(w*0.5,h*0.2,h*0.2,w*0.5,h*0.2,w*0.7); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.35)');
    ctx.fillStyle = vg; ctx.fillRect(0,0,w,h);
    grain(ctx, w, h, 9000, 0.04, 'rgba(255,255,255,A)', 'rgba(0,0,0,A)');
  }
  function drawGround(ctx, w, h) {
    var g = ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'#15171b'); g.addColorStop(0.5,'#1c1f24'); g.addColorStop(1,'#101216'); ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    for (var i=0;i<40;i++){ var x=Math.random()*w, y=Math.random()*h, r=10+Math.random()*40, bg=ctx.createRadialGradient(x,y,0,x,y,r), a=0.04+Math.random()*0.05;
      bg.addColorStop(0,'rgba(120,135,150,'+a+')'); bg.addColorStop(1,'rgba(120,135,150,0)'); ctx.fillStyle=bg; ctx.fillRect(x-r,y-r,r*2,r*2); }
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=2; var step=w/8;
    for (var k=1;k<8;k++){ ctx.beginPath(); ctx.moveTo(k*step,0); ctx.lineTo(k*step,h); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,k*step); ctx.lineTo(w,k*step); ctx.stroke(); }
    ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1;
    for (var k2=1;k2<8;k2++){ ctx.beginPath(); ctx.moveTo(k2*step+1,0); ctx.lineTo(k2*step+1,h); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,k2*step+1); ctx.lineTo(w,k2*step+1); ctx.stroke(); }
    ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=1.4;
    for (var c=0;c<6;c++){ var px=Math.random()*w, py=Math.random()*h; ctx.beginPath(); ctx.moveTo(px,py);
      for (var s=0;s<6;s++){ px+=(Math.random()-0.5)*60; py+=(Math.random()-0.5)*60; ctx.lineTo(px,py); } ctx.stroke(); }
    ctx.save(); ctx.globalCompositeOperation='lighter';
    var lp = ctx.createRadialGradient(w*0.5,h*0.5,10,w*0.5,h*0.5,w*0.5); lp.addColorStop(0,'rgba(150,175,200,0.14)'); lp.addColorStop(1,'rgba(150,175,200,0)');
    ctx.fillStyle = lp; ctx.fillRect(0,0,w,h); ctx.restore();
    var vg2 = ctx.createRadialGradient(w*0.5,h*0.5,w*0.3,w*0.5,h*0.5,w*0.72); vg2.addColorStop(0,'rgba(0,0,0,0)'); vg2.addColorStop(1,'rgba(0,0,0,0.45)');
    ctx.fillStyle = vg2; ctx.fillRect(0,0,w,h);
    grain(ctx, w, h, 7000, 0.06, 'rgba(255,255,255,A)', 'rgba(0,0,0,A)');
  }
  function drawMuzzle(ctx, w, h) {
    var cx=w/2, cy=h/2; ctx.globalCompositeOperation='lighter';
    var bloom = ctx.createRadialGradient(cx,cy,0,cx,cy,w*0.5); bloom.addColorStop(0,'rgba(255,220,150,0.55)'); bloom.addColorStop(0.4,'rgba(255,150,50,0.25)'); bloom.addColorStop(1,'rgba(255,120,30,0)');
    ctx.fillStyle = bloom; ctx.fillRect(0,0,w,h);
    for (var i=0;i<9;i++){ var ang=(i/9)*Math.PI*2+Math.random()*0.2, len=w*(0.28+Math.random()*0.2), wid=6+Math.random()*8;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
      var sg=ctx.createLinearGradient(0,0,len,0); sg.addColorStop(0,'rgba(255,245,200,0.9)'); sg.addColorStop(0.5,'rgba(255,170,60,0.5)'); sg.addColorStop(1,'rgba(255,120,30,0)');
      ctx.fillStyle=sg; ctx.beginPath(); ctx.moveTo(0,-wid); ctx.lineTo(len,0); ctx.lineTo(0,wid); ctx.closePath(); ctx.fill(); ctx.restore(); }
    var core = ctx.createRadialGradient(cx,cy,0,cx,cy,w*0.14); core.addColorStop(0,'rgba(255,255,255,1)'); core.addColorStop(0.6,'rgba(255,240,190,0.9)'); core.addColorStop(1,'rgba(255,200,120,0)');
    ctx.fillStyle = core; ctx.beginPath(); ctx.arc(cx,cy,w*0.14,0,Math.PI*2); ctx.fill();
  }
  function drawImpact(ctx, w, h) {
    var cx=w/2, cy=h/2;
    var smoke = ctx.createRadialGradient(cx,cy,4,cx,cy,w*0.42); smoke.addColorStop(0,'rgba(120,120,125,0.45)'); smoke.addColorStop(0.6,'rgba(90,90,95,0.20)'); smoke.addColorStop(1,'rgba(70,70,75,0)');
    ctx.fillStyle = smoke; ctx.beginPath(); ctx.arc(cx,cy,w*0.42,0,6.28); ctx.fill();
    ctx.globalCompositeOperation='lighter';
    var flash = ctx.createRadialGradient(cx,cy,0,cx,cy,w*0.26); flash.addColorStop(0,'rgba(255,255,255,0.95)'); flash.addColorStop(0.5,'rgba(255,200,120,0.5)'); flash.addColorStop(1,'rgba(255,140,60,0)');
    ctx.fillStyle = flash; ctx.beginPath(); ctx.arc(cx,cy,w*0.26,0,6.28); ctx.fill();
    for (var i=0;i<12;i++){ var ang=(i/12)*Math.PI*2, len=w*(0.3+Math.random()*0.18);
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang); var sg=ctx.createLinearGradient(0,0,len,0); sg.addColorStop(0,'rgba(255,240,200,0.9)'); sg.addColorStop(1,'rgba(255,160,70,0)');
      ctx.strokeStyle=sg; ctx.lineWidth=1.5+Math.random()*1.5; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len,0); ctx.stroke(); ctx.restore(); }
    for (var d=0;d<18;d++){ var ang2=Math.random()*6.28, dist=w*(0.12+Math.random()*0.34), dx=cx+Math.cos(ang2)*dist, dy=cy+Math.sin(ang2)*dist;
      ctx.fillStyle='rgba(255,'+(180+Math.random()*60|0)+',120,'+(0.5+Math.random()*0.5).toFixed(2)+')'; ctx.fillRect(dx,dy,2,2); }
  }
  function drawTracer(ctx, w, h) {
    var cy=h/2; ctx.globalCompositeOperation='lighter';
    var halo = ctx.createRadialGradient(w*0.5,cy,2,w*0.5,cy,w*0.5); halo.addColorStop(0,'rgba(255,230,170,0.5)'); halo.addColorStop(0.5,'rgba(255,170,80,0.18)'); halo.addColorStop(1,'rgba(255,140,50,0)');
    ctx.fillStyle = halo; ctx.fillRect(0,0,w,h);
    var core = ctx.createLinearGradient(0,0,w,0); core.addColorStop(0.0,'rgba(255,200,120,0)'); core.addColorStop(0.35,'rgba(255,245,210,0.85)'); core.addColorStop(0.5,'rgba(255,255,255,1)'); core.addColorStop(0.65,'rgba(255,245,210,0.85)'); core.addColorStop(1.0,'rgba(255,200,120,0)');
    ctx.fillStyle = core; ctx.beginPath(); ctx.ellipse(w*0.5,cy,w*0.46,h*0.16,0,0,Math.PI*2); ctx.fill();
    var head = ctx.createRadialGradient(w*0.82,cy,0,w*0.82,cy,h*0.4); head.addColorStop(0,'rgba(255,255,255,1)'); head.addColorStop(1,'rgba(255,230,180,0)');
    ctx.fillStyle = head; ctx.beginPath(); ctx.arc(w*0.82,cy,h*0.4,0,6.28); ctx.fill();
  }
  function drawReticle(ctx, w, h) {
    var cx=w/2, cy=h/2; ctx.lineCap='round';
    ctx.strokeStyle='rgba(220,235,255,0.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,w*0.33,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(235,245,255,0.9)'; ctx.lineWidth=2; var gap=w*0.10, out=w*0.28;
    function tick(ang){ ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(gap,0); ctx.lineTo(out,0); ctx.stroke(); ctx.restore(); }
    tick(0); tick(Math.PI*0.5); tick(Math.PI); tick(Math.PI*1.5);
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.strokeStyle='rgba(120,180,255,0.25)'; ctx.lineWidth=4;
    tick(0); tick(Math.PI*0.5); tick(Math.PI); tick(Math.PI*1.5); ctx.restore();
    var dot = ctx.createRadialGradient(cx,cy,0,cx,cy,4); dot.addColorStop(0,'rgba(255,255,255,1)'); dot.addColorStop(1,'rgba(180,220,255,0)');
    ctx.fillStyle = dot; ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2); ctx.fill();
  }
  function drawTracerHead(ctx, w, h, hex) { var cx=w/2, cy=h/2, rgb=hexToRgb(hex); ctx.globalCompositeOperation='lighter';
    var g = ctx.createRadialGradient(cx,cy,0,cx,cy,w*0.5);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.26,'rgba(255,255,255,0.95)'); g.addColorStop(0.5,'rgba('+rgb+',0.9)'); g.addColorStop(1,'rgba('+rgb+',0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h); }
  return {
    enemy: function (variant, hit) { variant = variant|0; return cached('enemy_'+variant+(hit?'_h':''), function(){ return mk(256,512,function(ctx,w,h){ drawEnemy(ctx,w,h,variant,!!hit); }); }); },
    tracerHead: function (hex) { hex = hex||'#ffffff'; return cached('th_'+hex, function(){ return mk(128,128,function(ctx,w,h){ drawTracerHead(ctx,w,h,hex); }); }); },
    enemyHit: function (variant) { return this.enemy(variant|0, true); },
    sky: function () { return cached('sky', function(){ return mk(1024,512,drawSky); }); },
    ground: function () { return cached('ground', function(){ return mk(512,512,drawGround); }); },
    muzzle: function () { return cached('muzzle', function(){ return mk(256,256,drawMuzzle); }); },
    impact: function () { return cached('impact', function(){ return mk(256,256,drawImpact); }); },
    tracer: function () { return cached('tracer', function(){ return mk(256,64,drawTracer); }); },
    reticle: function () { return cached('reticle', function(){ return mk(128,128,drawReticle); }); },
    _blank: BLANK
  };
})();
</script>
<script>
/* ═══════════════ SND — 리얼 Web Audio SFX (노이즈+바디+빠른 엔벨로프, 생 비프음 금지) ═══════════════
   리버브 IR (1-t)^2.8 tail 1.6s wet0.22 send + 마스터 컴프(-16/knee12/ratio2.5/atk10/rel250)+makeup0.9 (사양서) */
window.SND = (function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext || null;
  var ctx = null, bus = null;
  var store = (typeof Map !== "undefined") ? new Map() : null;
  var ambienceOn = false, amb = null, heartbeatTimer = null, currentTimeScale = 1;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function noiseBuffer(c) {
    var rec = store && store.get(c); if (rec && rec.noise) return rec.noise;
    var len = Math.floor(c.sampleRate * 2.0); var buf = c.createBuffer(1, len, c.sampleRate); var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (store) store.set(c, { noise: buf }); return buf;
  }
  function noiseSrc(c) { var s = c.createBufferSource(); s.buffer = noiseBuffer(c); s.loop = true; return s; }
  function env(p, t0, peak, atk, end) {
    try { p.setValueAtTime(0.0001, t0); p.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + atk); p.exponentialRampToValueAtTime(0.0001, end); } catch (e) {}

<script>
if(window.AFRAME){
  AFRAME.registerComponent('motion-time',{
    init:function(){ this.c=new THREE.Vector3(); this.pc=new THREE.Vector3(); this.l=new THREE.Vector3(); this.pl=new THREE.Vector3();
      this.r=new THREE.Vector3(); this.pr=new THREE.Vector3(); this.lh=document.getElementById('lhand'); this.rh=document.getElementById('rhand'); this.ready=false; window.__timeScale=0.08; },
    tick:function(t,dt){ var cam=this.el.sceneEl.camera; if(!cam) return; dt=dt||16; cam.getWorldPosition(this.c);
      var lo=this.lh&&this.lh.object3D, ro=this.rh&&this.rh.object3D; if(lo) lo.getWorldPosition(this.l); if(ro) ro.getWorldPosition(this.r);
      if(!this.ready){ this.pc.copy(this.c); this.pl.copy(this.l); this.pr.copy(this.r); this.ready=true; return; }
      var mv=this.pc.distanceTo(this.c)+(lo?this.pl.distanceTo(this.l):0)+(ro?this.pr.distanceTo(this.r):0);
      this.pc.copy(this.c); this.pl.copy(this.l); this.pr.copy(this.r);
      var speed=mv/(dt/1000); var target=Math.min(1, 0.07+speed*0.4);
      window.__timeScale += (target-(window.__timeScale||0.08))*0.18;
      if(window.__updateBGM) window.__updateBGM(); }
  });
  AFRAME.registerComponent('enemy',{
    init:function(){ var d=window.__diff||{fireMin:1.6,fireMax:3.0}; this.shootT=0.8+Math.random()*(d.fireMax-d.fireMin+0.8); },
    tick:function(t,dt){ if(!window.__shotPlaying || this.el.dataset.dead) return; var k=(dt||16)/1000*(window.__timeScale||0.08);
      var p=this.el.object3D.position; var d=Math.sqrt(p.x*p.x+p.z*p.z); if(d>2.1){ p.x-=p.x/d*0.55*k; p.z-=p.z/d*0.55*k; }
      this.shootT-=k; if(this.shootT<=0){ var df=window.__diff||{fireMin:1.5,fireMax:2.9}; this.shootT=df.fireMin+Math.random()*(df.fireMax-df.fireMin); if(window.__enemyShoot) window.__enemyShoot(this.el); } }
  });
  AFRAME.registerComponent('bullet',{
    schema:{dx:{default:0},dy:{default:0},dz:{default:1},speed:{default:6},mine:{default:false}},
    init:function(){ this._v=new THREE.Vector3(); this._fw=new THREE.Vector3(); this._c=new THREE.Vector3(); this._n=new THREE.Vector3(); this._y=new THREE.Vector3(); this._z=new THREE.Vector3(); this._m=new THREE.Matrix4(); },
    orient:function(cam){ // 트레이서 긴 축(local X)=진행방향, 평면 노멀은 최대한 카메라를 향하게(stretched billboard)

      var _cam=this.el.sceneEl.camera; if(_cam) this.orient(_cam);
      if(this.data.mine){ var en=document.querySelectorAll('.enemy'); for(var i=0;i<en.length;i++){ if(en[i].dataset.dead) continue; en[i].object3D.getWorldPosition(this._v); if(this._v.distanceTo(p)<0.5){ if(window.__killEnemy) window.__killEnemy(en[i]); this.el.dataset.dead='1'; break; } } }
      else { var cam=this.el.sceneEl.camera; if(cam && !this.el.dataset.dead){ cam.getWorldPosition(this._v); var cd=this._v.distanceTo(p);
          if(cd<0.27){ if(window.__playerHit) window.__playerHit(this.el); return; }
          if(cd<1.25 && !this._whizzed){ this._whizzed=1; if(window.SND) SND.whizz(Math.max(-1,Math.min(1,(p.x-this._v.x)*2))); } } }
      if(Math.abs(p.x)>22||Math.abs(p.z)>24||p.y<-2||this.el.dataset.dead){ if(this.el.parentNode) this.el.parentNode.removeChild(this.el); } }
  });
  /* 시간정지 틴트: 멈출수록(저 timeScale) 화면에 차가운 블루 틴트가 짙어짐 → 슬로모 연출 */
  AFRAME.registerComponent('timetint',{
    init:function(){ this.mesh=null; },
    tick:function(){ if(!this.mesh){ this.mesh=this.el.getObject3D('mesh'); if(!this.mesh) return; }
      var ts=window.__timeScale||0.08; try{ this.mesh.material.opacity=Math.max(0, 0.36-ts*0.6); }catch(e){} }
  });
  AFRAME.registerComponent('shootgun',{
    init:function(){ var self=this; this._q=new THREE.Quaternion(); this._s=new THREE.Vector3(); this._d=new THREE.Vector3();
      this.el.addEventListener('triggerdown', function(){ self.fire(); }); },
    fire:function(){ if(!window.__shotPlaying) return; this.el.object3D.getWorldPosition(this._s); this.el.object3D.getWorldQuaternion(this._q); this._d.set(0,0,-1).applyQuaternion(this._q);
      if(window.__playerShoot) window.__playerShoot(this._s.x,this._s.y,this._s.z, this._d.x,this._d.y,this._d.z); }
  });
}
</script>

<div id="hint">🥽 VR: 멈추면 느린시간·움직이면 시간흐름 · 적 쏘고 총알 피하기! · 📱 폰: 방향패드로 이동(=시간이 흐르고 회피)·발사·정면</div>

<script>
'use strict';
window.__timeScale=0.08; window.__shotPlaying=false;
var scene=document.querySelector('a-scene'), field=document.getElementById('field');
var score=0, lives=3, best=0;
try{ best=parseInt(localStorage.getItem('timeshot_best')||'0',10)||0; }catch(e){}

/* ===== 사운드: 리얼 SND 모듈에 위임(기계 비프음 제거) ===== */
function S(){ return window.SND; }
/* 모바일/브라우저 오디오 언락: AudioContext는 사용자 제스처에서 시작/재개돼야 함.
   첫 실제 입력(터치/클릭/키)에서 SND.resume()를 보장(idempotent). */
(function audioUnlock(){ var done=false;
  function go(){ try{ if(window.SND){ SND.resume(); done=true; } }catch(e){} }
  ['pointerdown','touchend','mousedown','click','keydown'].forEach(function(ev){
    window.addEventListener(ev, go, {passive:true}); });
})();
// motion-time tick이 호출 → 적응형 긴장 BGM/심박을 timeScale로 스케일
window.__updateBGM=function(){ if(window.SND) SND.setTension(window.__timeScale||0.08); };

/* ===== 난이도 웨이브: 시간이 갈수록 적 수↑·스폰↑·발사속도↑ ===== */
window.__diff={maxEnemies:3, spawnMs:1700, fireMin:1.6, fireMax:3.0};
var gameT=0, diffTimer=null;
function rampDiff(){ gameT++;
  window.__diff.maxEnemies=Math.min(7, 3+Math.floor(gameT/11));
  window.__diff.spawnMs=Math.max(650, 1700-gameT*42);
  window.__diff.fireMin=Math.max(0.7, 1.6-gameT*0.03);
  window.__diff.fireMax=Math.max(1.5, 3.0-gameT*0.05);
  if(spawner){ clearInterval(spawner); spawner=setInterval(spawnEnemy, window.__diff.spawnMs); } }

/* ===== 반실사 스프라이트 헬퍼: 짧은 수명의 빌보드 플래시/임팩트/트레이서 ===== */
function tex(fn){ try{ return (window.GFX&&GFX[fn])?GFX[fn]():''; }catch(e){ return ''; } }
function burst(src, x,y,z, size, dur, toScale){ try{ var e=document.createElement('a-image');
  e.setAttribute('position', x+' '+y+' '+z); e.setAttribute('width',size); e.setAttribute('height',size);
  e.setAttribute('material','transparent:true; opacity:1; depthTest:false; blending:additive'); e.setAttribute('billboard','');
  e.setAttribute('animation__s','property: scale; from:0.5 0.5 0.5; to:'+toScale+' '+toScale+' '+toScale+'; dur:'+dur);
  e.setAttribute('animation__o','property: material.opacity; from:1; to:0; dur:'+dur);
  e.setAttribute('src',src); // src는 material 이후에(= material.src가 지워지지 않도록)
  scene.appendChild(e); setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); }, dur+40); }catch(err){} }
// 총알에 항상 카메라를 향하는 밝은 '머리' 점을 자식으로 붙임(정면에서도 보이게)
function bulletHead(b, hex, size){ try{ if(!tex('tracerHead')) return; var hd=document.createElement('a-image');
  hd.setAttribute('width',size||0.26); hd.setAttribute('height',size||0.26);
  hd.setAttribute('material','shader:flat; transparent:true; depthTest:false; blending:additive'); hd.setAttribute('billboard','');
  hd.setAttribute('src', GFX.tracerHead(hex)); b.appendChild(hd); }catch(e){} }

function updateHUD(){ document.getElementById('scoreT').setAttribute('ktext','value','점수 '+score);
  document.getElementById('livesT').setAttribute('ktext','value', lives>0?('생명 '+'❤'.repeat(lives)):'💀');
  var ts=window.__timeScale||0.08; var ind=document.getElementById('timeInd');
  ind.setAttribute('ktext','value', ts<0.3?'시간 느림':(ts<0.7?'시간 흐름':'시간 빠름')); }
function flash(){ var d=document.getElementById('dmg'); if(!d) return; d.setAttribute('material','opacity',0.5); setTimeout(function(){ d.setAttribute('material','opacity',0); },150); }

function spawnEnemy(){ if(!window.__shotPlaying) return; if(document.querySelectorAll('.enemy').length>=(window.__diff.maxEnemies||4)) return;
  var ang=rand(-1.25,1.25), dist=rand(5,8), x=Math.sin(ang)*dist, z=-Math.cos(ang)*dist;
  var variant=Math.floor(Math.random()*4);
  var e=document.createElement('a-image'); e.setAttribute('class','enemy clickable'); e.dataset.variant=variant;
  e.setAttribute('width','1.15'); e.setAttribute('height','2.0');
  e.setAttribute('material','shader:flat; transparent:true; alphaTest:0.45; side:double');
  e.setAttribute('position', x.toFixed(2)+' 1.02 '+z.toFixed(2)); e.setAttribute('enemy',''); e.setAttribute('billboard','');
  if(tex('enemy')) e.setAttribute('src', GFX.enemy(variant)); // src 마지막
  field.appendChild(e); if(window.SND) SND.spawnCue();
}
function rand(a,b){return a+Math.random()*(b-a);}
window.__enemyShoot=function(enemyEl){ if(!window.__shotPlaying || enemyEl.dataset.dead) return;
  var ep={x:0,y:1.5,z:-5}; try{ var v=new AFRAME.THREE.Vector3(); enemyEl.object3D.getWorldPosition(v); ep={x:v.x,y:v.y+0.35,z:v.z}; }catch(e){}
  var cp={x:0,y:1.6,z:0}; try{ var cv=new AFRAME.THREE.Vector3(); scene.camera.getWorldPosition(cv); cp={x:cv.x,y:cv.y,z:cv.z}; }catch(e){}
  var dx=cp.x-ep.x,dy=cp.y-ep.y,dz=cp.z-ep.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
  if(window.SND) SND.enemyShot(d);
  if(tex('muzzle')) burst(GFX.muzzle(), ep.x.toFixed(2), ep.y.toFixed(2), ep.z.toFixed(2), 0.55, 90, 1.6);
  var b=document.createElement('a-image'); b.setAttribute('class','bullet');
  b.setAttribute('width','0.5'); b.setAttribute('height','0.14'); b.setAttribute('material','shader:flat; transparent:true; depthTest:false; blending:additive');
  b.setAttribute('position', ep.x.toFixed(2)+' '+ep.y.toFixed(2)+' '+ep.z.toFixed(2));
  b.setAttribute('bullet','dx:'+(dx/d).toFixed(3)+'; dy:'+(dy/d).toFixed(3)+'; dz:'+(dz/d).toFixed(3)+'; speed:5.5; mine:false');
  if(tex('tracer')) b.setAttribute('src', GFX.tracer());
  field.appendChild(b); bulletHead(b, '#ff7a3c', 0.3); }; // 적 총알: 밝은 주황빨강 머리
// 내 총알 발사
window.__playerShoot=function(sx,sy,sz,dx,dy,dz){ if(!window.__shotPlaying) return; if(window.SND) SND.playerShot();
  if(tex('muzzle')) burst(GFX.muzzle(), (sx+dx*0.25).toFixed(2), (sy+dy*0.25).toFixed(2), (sz+dz*0.25).toFixed(2), 0.5, 75, 1.8);
  var b=document.createElement('a-image'); b.setAttribute('class','bullet mybullet');
  b.setAttribute('width','0.42'); b.setAttribute('height','0.12'); b.setAttribute('material','shader:flat; transparent:true; depthTest:false; blending:additive');
  b.setAttribute('position', sx+' '+sy+' '+sz); b.setAttribute('bullet','dx:'+dx.toFixed(3)+'; dy:'+dy.toFixed(3)+'; dz:'+dz.toFixed(3)+'; speed:14; mine:true');
  if(tex('tracer')) b.setAttribute('src', GFX.tracer()); field.appendChild(b); bulletHead(b, '#aee4ff', 0.24); }; // 내 총알: 밝은 청백색 머리
window.__killEnemy=function(el){ if(el.dataset.dead) return; el.dataset.dead='1'; score++; updateHUD(); if(window.SND) SND.enemyDeath();
  try{ if(tex('enemy')) el.setAttribute('src', GFX.enemyHit(el.dataset.variant|0)); }catch(e){}
  var px=0,py=1,pz=-5; try{ var v=new AFRAME.THREE.Vector3(); el.object3D.getWorldPosition(v); px=v.x; py=v.y+0.15; pz=v.z; }catch(e){}
  if(tex('impact')) burst(GFX.impact(), px.toFixed(2), py.toFixed(2), pz.toFixed(2), 1.1, 360, 2.6);
  try{ el.setAttribute('animation__d','property: scale; to:0.02 0.02 0.02; dur:120'); }catch(e){}
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },130); };
window.__playerHit=function(b){ if(b.dataset.dead) return; b.dataset.dead='1'; if(b.parentNode) b.parentNode.removeChild(b); lives--; updateHUD(); flash(); if(window.SND) SND.playerHit(); if(lives<=0) endGame(); };

// 마우스/시선 클릭으로도 처치(PC·폰)
scene.addEventListener('click', function(evt){ var el=evt.target; if(!el) return;
  if(el.id==='startBtn'){ startGame(); return; }
  if(window.__shotPlaying && el.classList && el.classList.contains('enemy') && !evt.target.sceneEl.is('vr-mode')){ window.__killEnemy(el); } });

// 모바일: 빈 곳 탭 → 카메라 정면으로 사격 (vr-common이 .clickable 못 맞힌 탭을 전달)
// 단, 방향패드/버튼을 만진 직후면 오발사 방지
window.__vrTapAt=function(x,y,ndc,cam,ray){ if(!window.__shotPlaying) return;
  if(Date.now()-(window.__mctlTouch||0)<500) return;
  try{ var o=ray.ray.origin, d=ray.ray.direction; window.__playerShoot(o.x,o.y,o.z, d.x,d.y,d.z); }catch(e){} };

/* ===== 모바일 조작: 방향패드 이동(=시간 흐름·회피) + 발사 + 정면(중앙정렬) ===== */
(function mobileControls(){
  var isTouch=(('ontouchstart' in window)||(navigator.maxTouchPoints>0)); if(!isTouch) return;
  var ui=document.getElementById('mctl'); if(!ui) return; ui.classList.add('show');
  var rigEl=document.getElementById('rig'); var held={f:0,b:0,l:0,r:0};
  function mark(){ window.__mctlTouch=Date.now(); }
  function bindHold(btn,dir){
    function on(e){ e.preventDefault(); mark(); held[dir]=1; btn.classList.add('on'); }
    function off(e){ if(e&&e.preventDefault) e.preventDefault(); held[dir]=0; btn.classList.remove('on'); }
    btn.addEventListener('touchstart',on,{passive:false}); btn.addEventListener('touchend',off,{passive:false}); btn.addEventListener('touchcancel',off,{passive:false});
    btn.addEventListener('mousedown',on); btn.addEventListener('mouseup',off); btn.addEventListener('mouseleave',off);
  }
  Array.prototype.forEach.call(ui.querySelectorAll('.mb'), function(b){ bindHold(b, b.dataset.d); });
  function fireForward(){ if(!window.__shotPlaying||!scene.camera||!window.THREE) return; try{
    var q=new THREE.Quaternion(), s=new THREE.Vector3(), d=new THREE.Vector3();
    scene.camera.getWorldPosition(s); scene.camera.getWorldQuaternion(q); d.set(0,0,-1).applyQuaternion(q);
    window.__playerShoot(s.x,s.y,s.z, d.x,d.y,d.z); }catch(e){} }
  function recenter(){ try{
    var lc=scene.camera&&scene.camera.el&&scene.camera.el.components['look-controls'];
    if(lc){ if(lc.pitchObject) lc.pitchObject.rotation.x=0; if(lc.yawObject) lc.yawObject.rotation.y=0;
      if(lc.magicWindowAbsoluteEuler&&lc.magicWindowAbsoluteEuler.set) lc.magicWindowAbsoluteEuler.set(0,0,0);
      if(lc.magicWindowDeltaEuler&&lc.magicWindowDeltaEuler.set) lc.magicWindowDeltaEuler.set(0,0,0); }
    if(rigEl&&rigEl.object3D) rigEl.object3D.position.set(0,0,0);
  }catch(e){} }
  var fb=document.getElementById('mfire'); if(fb){ fb.addEventListener('touchstart',function(e){ e.preventDefault(); mark(); fireForward(); },{passive:false}); fb.addEventListener('click',function(e){ e.preventDefault(); fireForward(); }); }
  var cb=document.getElementById('mcenter'); if(cb){ cb.addEventListener('touchstart',function(e){ e.preventDefault(); mark(); recenter(); },{passive:false}); cb.addEventListener('click',function(e){ e.preventDefault(); recenter(); }); }
  // 이동 루프: 눌린 방향으로 rig를 카메라 기준 이동 → 카메라 월드좌표가 변해 시간이 흐르고 총알을 회피
  var last=performance.now();
  function loop(now){ var dt=Math.min(0.05,(now-last)/1000); last=now;
    try{ if(window.__shotPlaying && rigEl && rigEl.object3D && scene.camera && window.THREE){
      var mx=(held.r-held.l), mz=(held.b-held.f);
      if(mx||mz){ var q=new THREE.Quaternion(); scene.camera.getWorldQuaternion(q);
        var f=new THREE.Vector3(0,0,-1).applyQuaternion(q); f.y=0; if(f.lengthSq()<1e-4) f.set(0,0,-1); f.normalize();
        var rt=new THREE.Vector3(1,0,0).applyQuaternion(q); rt.y=0; if(rt.lengthSq()<1e-4) rt.set(1,0,0); rt.normalize();
        var sp=2.6*dt, p=rigEl.object3D.position;
        p.x += (f.x*(-mz)+rt.x*mx)*sp; p.z += (f.z*(-mz)+rt.z*mx)*sp;
        var R=8.5; if(p.x>R)p.x=R; if(p.x<-R)p.x=-R; if(p.z>R)p.z=R; if(p.z<-R)p.z=-R;
      }
    } }catch(e){}
    requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  if(scene){ scene.addEventListener('enter-vr',function(){ ui.classList.remove('show'); }); scene.addEventListener('exit-vr',function(){ ui.classList.add('show'); }); }
  window.__MOBILE_TEST__={ press:function(d){ held[d]=1; }, release:function(d){ held[d]=0; }, fire:fireForward, recenter:recenter,
    get pos(){ var p=rigEl&&rigEl.object3D?rigEl.object3D.position:{x:0,z:0}; return {x:p.x,z:p.z}; } };
})();

// 환경 텍스처(반실사 하늘/바닥/레티클)를 캔버스로 생성해 주입 — 데이터URL은 3-인자 setAttribute로(파싱 깨짐 방지)
function initEnv(){ try{ if(!window.GFX) return;
  var sky=document.getElementById('sky'); if(sky) sky.setAttribute('src', GFX.sky());
  var gr=document.getElementById('ground'); if(gr) gr.setAttribute('material','src', GFX.ground());
  var ret=document.getElementById('reticle'); if(ret) ret.setAttribute('src', GFX.reticle());
}catch(e){} }
if(scene){ if(scene.hasLoaded) initEnv(); else scene.addEventListener('loaded', initEnv); }

function clearField(){ var xs=document.querySelectorAll('.enemy,.bullet'); for(var i=0;i<xs.length;i++) if(xs[i].parentNode) xs[i].parentNode.removeChild(xs[i]); }
var spawner=null;
function startGame(){ score=0; lives=3; gameT=0; window.__shotPlaying=true;
  window.__diff={maxEnemies:3, spawnMs:1700, fireMin:1.6, fireMax:3.0}; updateHUD();
  document.getElementById('hud').setAttribute('visible',true);
  document.getElementById('startWrap').setAttribute('visible',false);
  document.getElementById('gameover').setAttribute('visible',false);
  document.getElementById('helpWrap').setAttribute('visible',false);
  var ret=document.getElementById('reticle'); if(ret) ret.setAttribute('visible',true);
  clearField(); clearInterval(spawner); clearInterval(diffTimer);
  spawner=setInterval(spawnEnemy, window.__diff.spawnMs); diffTimer=setInterval(rampDiff,1000);
  spawnEnemy(); spawnEnemy();
  if(window.SND){ SND.resume(); SND.startAmbience(); SND.gameStart(); } }
function endGame(){ window.__shotPlaying=false; clearInterval(spawner); clearInterval(diffTimer); clearField();
  if(window.SND){ SND.stopAmbience(); SND.gameOver(); }
  if(score>best){ best=score; try{localStorage.setItem('timeshot_best',String(best));}catch(e){} }
  var ret=document.getElementById('reticle'); if(ret) ret.setAttribute('visible',false);
  document.getElementById('hud').setAttribute('visible',false);
  document.getElementById('finalScore').setAttribute('ktext','value','처치 '+score+'  ·  최고 '+best);
  document.getElementById('gameover').setAttribute('visible',true);
  document.getElementById('startTxt').setAttribute('ktext','value','다시하기 ↻');
  document.getElementById('startWrap').setAttribute('visible',true); }

window.__SHOT_TEST__={ start:startGame, end:endGame, spawnEnemy:spawnEnemy,
  get playing(){return window.__shotPlaying}, get score(){return score}, get lives(){return lives}, get best(){return best},
  get nEnemies(){return document.querySelectorAll('.enemy').length}, get nBullets(){return document.querySelectorAll('.bullet').length}, get nMine(){return document.querySelectorAll('.mybullet').length},
  killOne:function(){ var e=document.querySelector('.enemy'); if(e) window.__killEnemy(e); },
  shootAtPlayer:function(){ var e=document.querySelector('.enemy'); if(e) window.__enemyShoot(e); },
  myShoot:function(){ if(window.__playerShoot) window.__playerShoot(0,1.6,0, 0,0,-1); },
  hitPlayer:function(){ var b=document.querySelector('.bullet'); if(b) window.__playerHit(b); else { lives--; updateHUD(); if(lives<=0) endGame(); } },
  get maxEnemies(){ return window.__diff.maxEnemies; }, ramp:function(n){ for(var i=0;i<(n||1);i++) rampDiff(); },
  renderOffline:function(name,sec){ return window.SND ? SND.renderOffline(name,sec) : Promise.resolve(new Float32Array(0)); } };
</script>
</body>
