<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VR 사격</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="vr-common.js"></script>
<script>
if(window.AFRAME){
  // 방아쇠를 당기면 발사 효과(섬광+탄환+소리). 명중 판정은 과녁 click(레이저)로 처리.
  AFRAME.registerComponent('gun',{
    init:function(){ var self=this; this._q=new THREE.Quaternion(); this._s=new THREE.Vector3(); this._d=new THREE.Vector3();
      this.el.addEventListener('triggerdown', function(){ self.fire(); }); },
    fire:function(){ this.el.object3D.getWorldPosition(this._s); this.el.object3D.getWorldQuaternion(this._q); this._d.set(0,0,-1).applyQuaternion(this._q);
      var rc=this.el.components.raycaster; var inter=(rc&&rc.intersections&&rc.intersections.length)?rc.intersections[0]:null;
      var ex,ey,ez; if(inter){ ex=inter.point.x; ey=inter.point.y; ez=inter.point.z; } else { ex=this._s.x+this._d.x*18; ey=this._s.y+this._d.y*18; ez=this._s.z+this._d.z*18; }
      if(window.__shooterFX) window.__shooterFX(this._s.x,this._s.y,this._s.z, ex,ey,ez); }
  });
}
</script>
<style>
  html,body{margin:0;height:100%;background:#0a0e14;font-family:-apple-system,"Malgun Gothic","Segoe UI","Noto Sans KR",sans-serif}
  a.back{position:fixed;top:12px;left:12px;z-index:11;color:#fff;text-decoration:none;font-size:.9rem;background:#0b0f17cc;border:1px solid #2a3545;border-radius:10px;padding:8px 12px}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#cfe0f5;font-size:.85rem;z-index:11;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<a-scene background="color:#bfe3f2" vr-mode-ui="enabled:true" device-orientation-permission-ui="enabled:false">
  <a-sky color="#bfe3f2"></a-sky>
  <a-plane rotation="-90 0 0" width="60" height="60" color="#6f9d5c" material="shader:flat"></a-plane>
  <a-plane position="0 3.5 -6.3" width="24" height="9" color="#e7eef9" material="shader:flat"></a-plane>
  <a-box position="-5 1.2 -6" depth="0.3" width="0.3" height="2.4" color="#9aa7b5"></a-box>
  <a-box position="5 1.2 -6" depth="0.3" width="0.3" height="2.4" color="#9aa7b5"></a-box>

  <a-entity id="hud" visible="false">
    <a-entity id="scoreT" ktext="value: 점수 0; color:#13263b; size:0.34" position="-2.4 4.4 -5.6"></a-entity>
    <a-entity id="timeT"  ktext="value: 시간 45; color:#13263b; size:0.34" position="2.4 4.4 -5.6"></a-entity>
  </a-entity>

  <a-entity id="field"></a-entity>

  <a-entity id="helpWrap" position="0 1.35 -4">
    <a-entity ktext="value: 컨트롤러로 과녁을 조준 → 방아쇠(트리거)로 사격!\n가운데 노랑 10점 · 중간 5점 · 바깥 1점; color:#13263b; size:0.17; bg:#ffffffcc"></a-entity>
  </a-entity>

  <a-entity id="startWrap" position="0 2.3 -4">
    <a-plane id="startBtn" class="clickable" width="2.8" height="0.95" material="shader:flat; color:#2ec27e"></a-plane>
    <a-entity id="startTxt" ktext="value: ▶ 시작; color:#fff; size:0.32" position="0 0 0.02"></a-entity>
  </a-entity>

  <a-entity id="gameover" visible="false" position="0 3.3 -4.2">
    <a-plane width="3.4" height="1.3" material="shader:flat; color:#0e1d30; opacity:0.9"></a-plane>
    <a-entity ktext="value: 게임 끝! 🎯; color:#fff; size:0.26" position="0 0.33 0.02"></a-entity>
    <a-entity id="finalScore" ktext="value: ; color:#8fe3c0; size:0.2" position="0 -0.18 0.02"></a-entity>
  </a-entity>

  <a-entity light="type:ambient; intensity:0.9"></a-entity>
  <a-entity light="type:directional; intensity:0.45" position="1 3 1"></a-entity>

  <a-entity id="rig">
    <a-camera position="0 1.6 0" wasd-controls="enabled:true">
      <a-entity cursor="rayOrigin:mouse" raycaster="objects:.clickable; far:40"></a-entity>
    </a-camera>
    <a-entity id="rhand" laser-controls="hand:right" gun raycaster="objects:.clickable; far:40; lineColor:#ffd23f" cursor="fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
    <a-entity id="lhand" laser-controls="hand:left"  gun raycaster="objects:.clickable; far:40; lineColor:#ffd23f" cursor="fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
  </a-entity>
</a-scene>

<a href="index.html" class="back">← 메뉴</a>
<div id="hint">🥽 VR 입장 → 과녁 조준 + 방아쇠로 사격! (PC·폰은 마우스 클릭)</div>

<script>
'use strict';
var scene=document.querySelector('a-scene'), field=document.getElementById('field');
var N=6, playing=false, score=0, timeLeft=45, best=0, timer=null;
try{ best=parseInt(localStorage.getItem('shooter_best')||'0',10)||0; }catch(e){}
function rand(a,b){return a+Math.random()*(b-a);}

var actx=null;
function tone(f1,f2,d,type,vol){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  var o=actx.createOscillator(), g=actx.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f1,actx.currentTime);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,actx.currentTime+d); o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(vol||0.16,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d); o.start(); o.stop(actx.currentTime+d);
}catch(e){} }
function shotSound(){ tone(900,170,0.09,'square',0.16); }

// 발사 효과: 총구 섬광 + 날아가는 탄환
window.__shooterFX=function(sx,sy,sz, ex,ey,ez){ shotSound();
  var mf=document.createElement('a-sphere'); mf.setAttribute('radius','0.05'); mf.setAttribute('material','shader:flat; color:#fff3a0');
  mf.setAttribute('position', sx+' '+sy+' '+sz); mf.setAttribute('animation','property: scale; from:1 1 1; to:2.6 2.6 2.6; dur:90');
  scene.appendChild(mf); setTimeout(function(){ if(mf.parentNode) mf.parentNode.removeChild(mf); },100);
  var t=document.createElement('a-sphere'); t.setAttribute('radius','0.035'); t.setAttribute('material','shader:flat; color:#ffd23f');
  t.setAttribute('position', sx+' '+sy+' '+sz);
  t.setAttribute('animation','property: position; to: '+ex+' '+ey+' '+ez+'; dur:110; easing:linear');
  scene.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },150);
};

function placeTarget(t){ t.setAttribute('position', rand(-3.4,3.4).toFixed(2)+' '+rand(1.1,3.6).toFixed(2)+' '+rand(-5.6,-3.2).toFixed(2)); }
function makeTarget(){
  var t=document.createElement('a-entity'); t.setAttribute('class','clickable target');
  t.setAttribute('geometry','primitive: circle; radius: 0.33'); t.setAttribute('material','color:#d63a3a; shader:flat; side:double');
  t.innerHTML='<a-circle radius="0.25" color="#ffffff" position="0 0 0.001" material="shader:flat"></a-circle>'+
    '<a-circle radius="0.17" color="#d63a3a" position="0 0 0.002" material="shader:flat"></a-circle>'+
    '<a-circle radius="0.08" color="#ffcf3f" position="0 0 0.003" material="shader:flat"></a-circle>';
  placeTarget(t); field.appendChild(t); return t;
}
function clearTargets(){ var ts=document.querySelectorAll('.target'); for(var i=0;i<ts.length;i++) ts[i].parentNode.removeChild(ts[i]); }
function floatText(txt,pos,color){ var e=document.createElement('a-entity'); e.setAttribute('ktext','value: '+txt+'; color:'+(color||'#ffd23f')+'; size:0.3');
  e.setAttribute('position',pos); e.setAttribute('billboard','');
  var y=parseFloat(pos.split(' ')[1]); e.setAttribute('animation','property: position; to: '+pos.split(' ')[0]+' '+(y+0.6).toFixed(2)+' '+pos.split(' ')[2]+'; dur:600');
  scene.appendChild(e); setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },650); }

function hitTarget(t, inter){
  var pts=5;
  try{ if(inter && inter.point && t.object3D){ var lp=t.object3D.worldToLocal(inter.point.clone()); var r=Math.sqrt(lp.x*lp.x+lp.y*lp.y); pts=r<0.08?10:(r<0.18?5:1); } }catch(e){}
  score+=pts; updateHUD(); tone(pts>=10?1250:(pts>=5?880:620),0,0.09,'square',0.16);
  var pos=t.getAttribute('position'); if(pos){ floatText('+'+pts, (pos.x||0)+' '+((pos.y||2)+0.2)+' '+(pos.z||-4), pts>=10?'#ffcf3f':'#ffffff'); }
  t.setAttribute('scale','0.1 0.1 0.1'); setTimeout(function(){ if(!playing) return; placeTarget(t); t.setAttribute('scale','1 1 1'); },110);
}
function updateHUD(){ document.getElementById('scoreT').setAttribute('ktext','value','점수 '+score); document.getElementById('timeT').setAttribute('ktext','value','시간 '+Math.max(0,timeLeft)); }

function startGame(){ score=0; timeLeft=45; playing=true; updateHUD();
  document.getElementById('hud').setAttribute('visible',true);
  document.getElementById('startWrap').setAttribute('visible',false);
  document.getElementById('gameover').setAttribute('visible',false);
  document.getElementById('helpWrap').setAttribute('visible',false);
  clearTargets(); for(var i=0;i<N;i++) makeTarget();
  clearInterval(timer); timer=setInterval(tick,1000);
}
function tick(){ if(!playing) return; timeLeft--; updateHUD(); if(timeLeft<=0) endGame(); }
function endGame(){ playing=false; clearInterval(timer); clearTargets();
  if(score>best){ best=score; try{localStorage.setItem('shooter_best',String(best));}catch(e){} }
  document.getElementById('hud').setAttribute('visible',false);
  document.getElementById('finalScore').setAttribute('ktext','value','점수 '+score+'  ·  최고 '+best);
  document.getElementById('gameover').setAttribute('visible',true);
  document.getElementById('startTxt').setAttribute('ktext','value','다시하기 ↻');
  document.getElementById('startWrap').setAttribute('visible',true); tone(300,0,0.25,'sawtooth',0.14);
}
scene.addEventListener('click', function(evt){ var el=evt.target; if(!el) return;
  if(el.id==='startBtn'){ startGame(); return; }
  if(playing && el.classList && el.classList.contains('target')){ hitTarget(el, evt.detail && evt.detail.intersection); } });

window.__SHOOTER_TEST__={ start:startGame, tick:tick, end:endGame,
  get playing(){return playing}, get score(){return score}, get time(){return timeLeft}, get best(){return best},
  get nTargets(){return document.querySelectorAll('.target').length},
  hit:function(){ var t=document.querySelector('.target'); if(t) hitTarget(t,null); },
  fx:function(){ if(window.__shooterFX) window.__shooterFX(0,1.6,0, 0,2,-4); } };
</script>
</body>
</html>
