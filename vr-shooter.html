<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VR 사격</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0a0e14;font-family:-apple-system,"Malgun Gothic","Segoe UI","Noto Sans KR",sans-serif}
  a.back{position:fixed;top:12px;left:12px;z-index:11;color:#fff;text-decoration:none;font-size:.9rem;background:#0b0f17cc;border:1px solid #2a3545;border-radius:10px;padding:8px 12px}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#cfe0f5;font-size:.85rem;z-index:11;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<a-scene background="color:#bfe3f2" vr-mode-ui="enabled:true" device-orientation-permission-ui="enabled:false">
  <a-sky color="#bfe3f2"></a-sky>
  <!-- 사격장 -->
  <a-plane rotation="-90 0 0" width="60" height="60" color="#6f9d5c" material="shader:flat"></a-plane>
  <a-plane position="0 3.5 -6.3" width="24" height="9" color="#e7eef9" material="shader:flat"></a-plane>
  <a-box position="-5 1.2 -6" depth="0.3" width="0.3" height="2.4" color="#9aa7b5"></a-box>
  <a-box position="5 1.2 -6" depth="0.3" width="0.3" height="2.4" color="#9aa7b5"></a-box>

  <!-- HUD(점수/시간) -->
  <a-entity id="hud" visible="false">
    <a-text id="scoreT" value="점수 0" align="center" width="10" color="#13263b" position="-2.3 4.4 -5.8"></a-text>
    <a-text id="timeT"  value="시간 45" align="center" width="10" color="#13263b" position="2.3 4.4 -5.8"></a-text>
  </a-entity>

  <!-- 과녁들이 들어갈 곳 -->
  <a-entity id="field"></a-entity>

  <!-- 안내 -->
  <a-text id="helpTxt" value="컨트롤러로 과녁을 조준하고 방아쇠로 쏘세요!" align="center" width="6" color="#13263b" position="0 1.05 -4.2"></a-text>

  <!-- 시작 / 다시하기 버튼 -->
  <a-entity id="startWrap" position="0 2.3 -4">
    <a-plane id="startBtn" class="clickable" width="2.8" height="0.95" color="#2ec27e" material="shader:flat"></a-plane>
    <a-text id="startTxt" value="▶ 시작" align="center" width="6.5" color="#fff" position="0 0 0.01"></a-text>
  </a-entity>

  <!-- 게임오버 패널 -->
  <a-entity id="gameover" visible="false" position="0 3.3 -4.2">
    <a-plane width="3.4" height="1.3" color="#0e1d30" material="shader:flat;opacity:0.9"></a-plane>
    <a-text value="게임 끝! 🎯" align="center" width="6" color="#fff" position="0 0.33 0.01"></a-text>
    <a-text id="finalScore" value="" align="center" width="5.2" color="#8fe3c0" position="0 -0.18 0.01"></a-text>
  </a-entity>

  <a-entity light="type:ambient; intensity:0.9"></a-entity>
  <a-entity light="type:directional; intensity:0.45" position="1 3 1"></a-entity>

  <a-entity id="rig">
    <a-camera position="0 1.6 0" wasd-controls="enabled:true">
      <a-entity cursor="rayOrigin:mouse" raycaster="objects:.clickable; far:40"></a-entity>
    </a-camera>
    <a-entity laser-controls="hand:right" raycaster="objects:.clickable; far:40; lineColor:#ffd23f" cursor="fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
    <a-entity laser-controls="hand:left"  raycaster="objects:.clickable; far:40; lineColor:#ffd23f" cursor="fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
  </a-entity>
</a-scene>

<a href="index.html" class="back">← 메뉴</a>
<div id="hint">오른쪽 아래 🥽 로 VR 입장 → 과녁을 조준하고 방아쇠! (PC·폰에선 마우스로도 가능)</div>

<script>
'use strict';
var scene=document.querySelector('a-scene');
var field=document.getElementById('field');
var N=6, playing=false, score=0, timeLeft=45, best=0, timer=null;
try{ best=parseInt(localStorage.getItem('shooter_best')||'0',10)||0; }catch(e){}
function rand(a,b){return a+Math.random()*(b-a);}

var actx=null;
function beep(freq,dur){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  var o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=freq;
  o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.18,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur); o.start(); o.stop(actx.currentTime+dur);
}catch(e){} }

function placeTarget(t){ t.setAttribute('position', rand(-3.4,3.4).toFixed(2)+' '+rand(1.1,3.6).toFixed(2)+' '+rand(-5.6,-3.2).toFixed(2)); }
function makeTarget(){
  var t=document.createElement('a-entity');
  t.setAttribute('class','clickable target');
  t.setAttribute('geometry','primitive: circle; radius: 0.33');
  t.setAttribute('material','color:#d63a3a; shader:flat; side:double');
  t.innerHTML =
    '<a-circle radius="0.25" color="#ffffff" position="0 0 0.001" material="shader:flat"></a-circle>'+
    '<a-circle radius="0.17" color="#d63a3a" position="0 0 0.002" material="shader:flat"></a-circle>'+
    '<a-circle radius="0.08" color="#ffcf3f" position="0 0 0.003" material="shader:flat"></a-circle>';
  placeTarget(t); field.appendChild(t); return t;
}
function clearTargets(){ var ts=document.querySelectorAll('.target'); for(var i=0;i<ts.length;i++) ts[i].parentNode.removeChild(ts[i]); }

function floatText(txt, pos, color){
  try{ var e=document.createElement('a-text'); e.setAttribute('value',txt); e.setAttribute('align','center');
    e.setAttribute('width','7'); e.setAttribute('color',color||'#ffd23f'); e.setAttribute('position',pos);
    e.setAttribute('animation__up','property: position; to: '+pos.split(' ')[0]+' '+(parseFloat(pos.split(' ')[1])+0.6).toFixed(2)+' '+pos.split(' ')[2]+'; dur: 600');
    e.setAttribute('animation__fade','property: opacity; from:1; to:0; dur:600');
    scene.appendChild(e); setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },650);
  }catch(e){}
}

function hitTarget(t, inter){
  var pts=5;
  try{ if(inter && inter.point && t.object3D){ var lp=t.object3D.worldToLocal(inter.point.clone());
    var r=Math.sqrt(lp.x*lp.x+lp.y*lp.y); pts = r<0.08?10 : (r<0.18?5:1); } }catch(e){}
  score+=pts; updateHUD();
  beep(pts>=10?1200:(pts>=5?880:620), 0.09);
  var pos=t.getAttribute('position'); if(pos){ floatText('+'+pts, (pos.x||0)+' '+((pos.y||2)+0.2)+' '+(pos.z||-4), pts>=10?'#ffcf3f':'#ffffff'); }
  // 팝 후 재등장
  t.setAttribute('scale','0.1 0.1 0.1');
  setTimeout(function(){ if(!playing){ return; } placeTarget(t); t.setAttribute('scale','1 1 1'); }, 110);
}

function updateHUD(){ var s=document.getElementById('scoreT'), ti=document.getElementById('timeT');
  if(s) s.setAttribute('value','점수 '+score); if(ti) ti.setAttribute('value','시간 '+Math.max(0,timeLeft)); }

function startGame(){
  score=0; timeLeft=45; playing=true; updateHUD();
  document.getElementById('hud').setAttribute('visible',true);
  document.getElementById('startWrap').setAttribute('visible',false);
  document.getElementById('gameover').setAttribute('visible',false);
  document.getElementById('helpTxt').setAttribute('visible',false);
  clearTargets(); for(var i=0;i<N;i++) makeTarget();
  clearInterval(timer); timer=setInterval(tick,1000);
}
function tick(){ if(!playing) return; timeLeft--; updateHUD(); if(timeLeft<=0) endGame(); }
function endGame(){
  playing=false; clearInterval(timer); clearTargets();
  if(score>best){ best=score; try{localStorage.setItem('shooter_best',String(best));}catch(e){} }
  document.getElementById('hud').setAttribute('visible',false);
  document.getElementById('finalScore').setAttribute('value','점수 '+score+'  ·  최고 '+best);
  document.getElementById('gameover').setAttribute('visible',true);
  document.getElementById('startTxt').setAttribute('value','다시하기 ↻');
  document.getElementById('startWrap').setAttribute('visible',true);
  beep(300,0.25);
}

scene.addEventListener('click', function(evt){
  var el=evt.target; if(!el) return;
  if(el.id==='startBtn'){ startGame(); return; }
  if(playing && el.classList && el.classList.contains('target')){ hitTarget(el, evt.detail && evt.detail.intersection); }
});

window.__SHOOTER_TEST__={ start:startGame, tick:tick, end:endGame,
  get playing(){return playing}, get score(){return score}, get time(){return timeLeft}, get best(){return best},
  get nTargets(){return document.querySelectorAll('.target').length},
  hit:function(){ var t=document.querySelector('.target'); if(t) hitTarget(t,null); } };
</script>
</body>
</html>
