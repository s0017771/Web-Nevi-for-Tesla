<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VR 석궁</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="vr-common.js"></script>
<script>
if(window.AFRAME){
  var _w=new THREE.Vector3(), _cam=new THREE.Vector3();
  /* 화살: 중력 + 바람(수평 가속) 받는 탄도. incoming=상대가 쏜 화살(내게 접근 → 휘익 사운드).
     물리 1스텝은 window.__boltStep(아래 하단 스크립트)로 통일 → 헤드리스 검증이 동일 코드를 사용. */
  AFRAME.registerComponent('bolt',{
    schema:{vx:{default:0},vy:{default:0},vz:{default:-20}, incoming:{default:false}, owner:{default:'me'}},
    init:function(){ this.v=new THREE.Vector3(this.data.vx,this.data.vy,this.data.vz); this.life=0; this._tc=0; this._hit=false;
      this.prevDist=999; this.minCam=999; this._grazed=false; if(this.data.incoming && window.__startWhoosh) this.whoosh=window.__startWhoosh(); },
    tick:function(t,dt){ if(this.el.dataset.dead) return; var k=Math.min(0.05,(dt||16)/1000); this.life+=k; if(this.life>8){ return this.kill(); }
      var w=window.__wind||{x:0,z:0}; var p=this.el.object3D.position;
      window.__boltStep(this.v, p, k, (window.__grav||9.8), w);
      try{ this.el.object3D.lookAt(p.x+this.v.x,p.y+this.v.y,p.z+this.v.z); }catch(e){}
      this._tc++; if(this._tc%2===0){ var tr=document.createElement('a-entity'); tr.setAttribute('geometry','primitive:sphere; radius:0.022');
        tr.setAttribute('material','shader:flat; color:#fff1b0; opacity:0.8; transparent:true'); tr.setAttribute('position',p.x+' '+p.y+' '+p.z);
        tr.setAttribute('animation','property: material.opacity; to:0; dur:280'); this.el.sceneEl.appendChild(tr);
        (function(x){ setTimeout(function(){ if(x.parentNode) x.parentNode.removeChild(x); },300); })(tr); }
      // 날아오는 화살(상대가 나를 쏨): 카메라 최근접거리로 명중/스침 판정 + 휘익 사운드
      if(this.data.incoming){ var cam=this.el.sceneEl.camera; if(cam){ cam.getWorldPosition(_cam); var dist=_cam.distanceTo(p);
        var approaching=dist<this.prevDist; if(dist<this.minCam) this.minCam=dist;
        if(this.whoosh) window.__updWhoosh(this.whoosh, dist, approaching);
        if(dist<0.55){ this._hit=true; if(window.__playerStruck) window.__playerStruck('hit'); return this.kill(); }       // 직격
        if(!approaching && !this._grazed && this.minCam<1.6 && this.minCam>=0.55){ this._grazed=true; if(window.__playerStruck) window.__playerStruck('graze'); }  // 스침(최근접 통과)
        this.prevDist=dist; }
        if(p.y<0.02 || Math.abs(p.x)>80 || Math.abs(p.z)>90){ return this.kill(); }
        return; }
      if(p.y<0.02 || Math.abs(p.x)>80 || Math.abs(p.z)>90){ return this.kill(); }
      // 내 화살: 과녁/적(.target) 충돌
      var tg=document.querySelectorAll('.target');
      for(var i=0;i<tg.length;i++){ if(tg[i].dataset.dead) continue; tg[i].object3D.getWorldPosition(_w);
        var r=parseFloat(tg[i].dataset.r)||0.33; if(_w.distanceTo(p) < r+0.09){ this._hit=true; window.__boltHit(tg[i], _w.distanceTo(p)); return this.kill(); } } },
    kill:function(){ if(this.el.dataset.dead) return; this.el.dataset.dead='1';
      if(this.whoosh && window.__stopWhoosh) window.__stopWhoosh(this.whoosh);
      if(!this._hit && window.__onBoltEnd){ try{ window.__onBoltEnd(this.data.owner, this.data.incoming); }catch(e){} }
      if(this.el.parentNode) this.el.parentNode.removeChild(this.el); }
  });
  /* 석궁 모델 + 당기기(draw) 애니메이션. mount: hand(컨트롤러) | camera(모바일 화면중앙) */
  AFRAME.registerComponent('bow',{
    schema:{mount:{default:'hand'}},
    init:function(){ var self=this; this._q=new THREE.Quaternion(); this._s=new THREE.Vector3(); this._d=new THREE.Vector3();
      var m=document.createElement('a-entity'); m.innerHTML=
        '<a-box class="bwood" width="0.045" height="0.05" depth="0.5" position="0 0 -0.08" material="roughness:0.75;metalness:0.05;color:#6b4a2a"></a-box>'+
        '<a-box class="bwood" width="0.048" height="0.012" depth="0.5" position="0 0.031 -0.08" material="roughness:0.65;metalness:0.05;color:#8a6038"></a-box>'+ /* 윗면 하이라이트 엣지 */
        '<a-box class="bwood" width="0.05" height="0.014" depth="0.36" position="0 0.034 -0.14" material="roughness:0.75;metalness:0.05;color:#43301d"></a-box>'+
        '<a-box class="bwood" width="0.028" height="0.085" depth="0.06" position="0 -0.06 0.085" rotation="20 0 0" material="roughness:0.8;metalness:0;color:#3b2a18"></a-box>'+
        '<a-box class="bmetal" width="0.07" height="0.055" depth="0.07" position="0 0 -0.3" material="roughness:0.6;metalness:0.2;color:#2b2320"></a-box>'+
        '<a-box class="bmetal" width="0.3" height="0.03" depth="0.03" position="-0.14 0.01 -0.3" rotation="0 -24 0" material="roughness:0.6;metalness:0.15;color:#241d1a"></a-box>'+
        '<a-box class="bmetal" width="0.3" height="0.03" depth="0.03" position="0.14 0.01 -0.3" rotation="0 24 0" material="roughness:0.6;metalness:0.15;color:#241d1a"></a-box>'+
        '<a-cylinder class="bstring" radius="0.006" height="0.5" rotation="0 0 90" position="0 0.012 -0.2" material="shader:flat;color:#efe8d2"></a-cylinder>'+
        '<a-cone class="nock" radius-bottom="0.03" radius-top="0" height="0.14" position="0 0.012 -0.2" rotation="-90 0 0" material="shader:flat;color:#c8ccd4; visible:false"></a-cone>';
      this.el.appendChild(m); this.str=m.querySelector('.bstring'); this.nock=m.querySelector('.nock');
      if(window.__skinBow) setTimeout(function(){ window.__skinBow(m); }, 0);   // 생성 직후 스톡/금속 텍스처
      if(this.data.mount==='hand'){
        this.el.addEventListener('triggerdown', function(){ self.draw(); });
        this.el.addEventListener('triggerup', function(){ self.release(); }); } },
    draw:function(){ if(window.__drawStart) window.__drawStart(); if(this.nock) this.nock.setAttribute('visible',true); },
    release:function(){ this.el.object3D.getWorldPosition(this._s); this.el.object3D.getWorldQuaternion(this._q); this._d.set(0,0,-1).applyQuaternion(this._q);
      if(this.nock) this.nock.setAttribute('visible',false); if(this.str) this.str.setAttribute('position','0 0.012 -0.2');
      if(window.__drawRelease) window.__drawRelease(this._s.x,this._s.y,this._s.z, this._d.x,this._d.y,this._d.z); },
    tick:function(){ // 당기는 동안 시위/노크를 뒤로
      if(window.__drawing && this.str){ var pw=window.__drawPower?window.__drawPower():0; var back=-0.2+pw*0.12;
        this.str.setAttribute('position','0 0.012 '+back.toFixed(3)); if(this.nock) this.nock.setAttribute('position','0 0.012 '+back.toFixed(3)); } }
  });
  AFRAME.registerComponent('windflag',{
    init:function(){ this.anchor=this.el.querySelector('.flagAnchor'); this.t=Math.random()*6.28; },
    tick:function(tm,dt){ if(!this.anchor) return; var w=window.__wind||{x:0,z:0}; var mag=Math.sqrt(w.x*w.x+w.z*w.z);
      this.t+=(dt||16)/1000*(2+mag); var wave=Math.sin(this.t)*Math.min(14, 3+mag*3); var droop=Math.max(2, 82-mag*22);
      this.anchor.object3D.rotation.set(-droop*Math.PI/180, (w.x<0?Math.PI:0)+wave*Math.PI/180, 0); }
  });
  AFRAME.registerComponent('tmove',{
    schema:{type:{default:'static'}, ampx:{default:0}, ampy:{default:0}, speed:{default:1}, phase:{default:0}},
    init:function(){ var p=this.el.getAttribute('position'); this.bx=p.x; this.by=p.y; this.t=this.data.phase; },
    tick:function(tm,dt){ if(window.__xbowPlaying===false || this.el.dataset.dead) return; var k=(dt||16)/1000; var sp=this.data.speed;
      if(this.data.type==='accel') sp*=(1+this.t*0.12); else if(this.data.type==='decel') sp*=Math.max(0.25,1-this.t*0.08);
      this.t+=k*sp; var p=this.el.object3D.position; p.x=this.bx+Math.sin(this.t)*this.data.ampx; p.y=this.by+(this.data.ampy?Math.sin(this.t*1.6)*this.data.ampy:0); }
  });
  /* 정적 무대에 캔버스 텍스처 입히기: 씬 로드 후 1회 __skinScene 호출 */
  AFRAME.registerComponent('skin',{
    init:function(){ var self=this; var run=function(){ if(window.__skinScene) window.__skinScene(); };
      if(this.el.hasLoaded) run(); else this.el.addEventListener('loaded', run); }
  });
  /* 그라디언트 하늘: 천정은 진한 하늘, 지평선은 안개색 — 깊이 앵커(캔버스 텍스처, 외부자산 없음) */
  AFRAME.registerComponent('skygrad',{
    init:function(){ var sky=this.el.querySelector('a-sky'); if(!sky) return;
      var c=document.createElement('canvas'); c.width=2; c.height=256; var g=c.getContext('2d');
      var grd=g.createLinearGradient(0,0,0,256); grd.addColorStop(0,'#5b8bb8'); grd.addColorStop(0.55,'#9ec3de'); grd.addColorStop(1,'#c3d9e8');
      g.fillStyle=grd; g.fillRect(0,0,2,256);
      var apply=function(){ try{ var mesh=sky.getObject3D('mesh'); if(!mesh||!mesh.material) return;
        var tex=new THREE.CanvasTexture(c); if(THREE.SRGBColorSpace) tex.colorSpace=THREE.SRGBColorSpace;
        mesh.material.map=tex; if(mesh.material.color) mesh.material.color.set('#ffffff'); mesh.material.needsUpdate=true; }catch(e){} };
      if(sky.getObject3D('mesh')) apply(); else sky.addEventListener('loaded', apply); }
  });
  /* 모바일 자이로 조준 스무딩: look-controls가 쓴 카메라 방향을 slerp로 보간해 끊김 완화.
     look-controls 뒤에 tick해야 하므로 씬 로드 후 setAttribute로 부착(§하단). VR/비모바일은 그대로 통과. */
  AFRAME.registerComponent('aim-smooth',{
    schema:{factor:{default:0.35}},
    init:function(){ this.q=new THREE.Quaternion(); this.have=false; },
    tick:function(){ var sc=this.el.sceneEl; if(!sc) return;
      if(!window.__mobileAim || (sc.is&&sc.is('vr-mode'))){ this.have=false; return; }   // VR·비모바일: 스무딩 안 함
      var o=this.el.object3D; if(!this.have){ this.q.copy(o.quaternion); this.have=true; return; }
      this.q.slerp(o.quaternion, this.data.factor); o.quaternion.copy(this.q); }
  });
}
</script>
<style>
  html,body{margin:0;height:100%;background:#0a0e14;font-family:-apple-system,"Malgun Gothic","Segoe UI","Noto Sans KR",sans-serif}
  a.back{position:fixed;top:12px;left:12px;z-index:11;color:#fff;text-decoration:none;font-size:.9rem;background:#0b0f17cc;border:1px solid #2a3545;border-radius:10px;padding:8px 12px}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#cfe0f5;font-size:.8rem;z-index:11;pointer-events:none;text-shadow:0 1px 3px #000}
  /* 모바일 조작 오버레이 */
  #mob{position:fixed;inset:0;z-index:9;display:none}
  #mob.on{display:block}
  #recenter{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);z-index:12;background:#12203acc;color:#cfe0f5;border:1px solid #39527e;border-radius:12px;padding:10px 16px;font-size:.9rem}
  #pwrap{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);width:200px;height:12px;background:#0b0f17aa;border:1px solid #39527e;border-radius:8px;z-index:12;display:none;overflow:hidden}
  #pbar{height:100%;width:0;background:linear-gradient(90deg,#39d98a,#ffd23f,#ff5a5a)}
  #crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:26px;height:26px;pointer-events:none;display:none}
  #crosshair.on{display:block}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:#ffffffcc}
  #crosshair::before{left:12px;top:0;width:2px;height:26px}#crosshair::after{top:12px;left:0;height:2px;width:26px}
  /* 모바일 비네트: 가장자리를 어둡게 해 화면에 입체 프레임감(VR엔 영향 없음) */
  #vignette{position:fixed;inset:0;z-index:8;pointer-events:none;display:none;box-shadow:inset 0 0 180px 60px rgba(8,16,24,0.42)}
  #vignette.on{display:block}
  /* 피격 플래시: 직격=강한 붉은 비네트, 스침=흐릿한 붉은 빛 */
  #hitflash{position:fixed;inset:0;z-index:13;pointer-events:none;opacity:0}
  @keyframes hitpulse{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
  @keyframes grazepulse{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
  #hitflash.hit{background:radial-gradient(circle at 50% 50%, rgba(255,0,0,0) 20%, rgba(190,0,0,0.80) 100%);animation:hitpulse .55s ease-out}
  #hitflash.graze{background:radial-gradient(circle at 50% 50%, rgba(255,40,40,0) 45%, rgba(210,30,30,0.40) 100%);animation:grazepulse .45s ease-out}
</style>
</head>
<body>
<a-scene background="color:#c3d9e8" fog="type:linear; color:#c3d9e8; near:8; far:135" vr-mode-ui="enabled:true" device-orientation-permission-ui="enabled:true"
  renderer="colorManagement:true; physicallyCorrectLights:true; toneMapping:ACESFilmic; exposure:1.05; antialias:true; highRefreshRate:true" skygrad skin>
  <a-sky color="#9ec3de"></a-sky>
  <a-plane id="ground" rotation="-90 0 0" width="200" height="220" color="#6f9a54" material="roughness:1; metalness:0"></a-plane>
  <a-plane id="lane" rotation="-90 0 0" width="26" height="80" position="0 0.01 -30" color="#7caa5c" material="roughness:1; metalness:0"></a-plane>
  <a-plane position="0 9 -70" width="260" height="30" color="#8fb3cf" material="shader:flat"></a-plane>
  <a-plane position="0 1.8 -60" width="260" height="8" color="#4e7a44" material="shader:flat"></a-plane>

  <!-- 나무/구름/궁수/석궁/화살은 standard 재질(조명 반응) — 입체감. 땅·하늘·HUD·과녁·파티클은 flat 유지 -->
  <a-entity id="scenery">
    <a-entity position="-9 0 -18"><a-cylinder class="bark" radius="0.2" height="1.6" color="#5a3d22" material="roughness:1; metalness:0"></a-cylinder><a-cone class="foliage" radius-bottom="1.1" radius-top="0" height="2.6" position="0 2.1 0" color="#3f7a39" material="roughness:1; metalness:0"></a-cone></a-entity>
    <a-entity position="9 0 -19" scale="1.2 1.2 1.2"><a-cylinder class="bark" radius="0.2" height="1.6" color="#5a3d22" material="roughness:1; metalness:0"></a-cylinder><a-cone class="foliage" radius-bottom="1.1" radius-top="0" height="2.6" position="0 2.1 0" color="#357032" material="roughness:1; metalness:0"></a-cone></a-entity>
    <a-entity position="-16 0 -34" scale="1.6 1.8 1.6"><a-cylinder class="bark" radius="0.2" height="1.6" color="#5a5236" material="roughness:1; metalness:0"></a-cylinder><a-cone class="foliage" radius-bottom="1.1" radius-top="0" height="2.6" position="0 2.1 0" color="#5a8470" material="roughness:1; metalness:0"></a-cone></a-entity>
    <a-entity position="15 0 -40" scale="2 2.2 2"><a-cylinder class="bark" radius="0.2" height="1.6" color="#60593c" material="roughness:1; metalness:0"></a-cylinder><a-cone class="foliage" radius-bottom="1.1" radius-top="0" height="2.6" position="0 2.1 0" color="#6b9688" material="roughness:1; metalness:0"></a-cone></a-entity>
    <a-entity position="-8 9 -42" scale="1.3 0.82 1"><a-sphere radius="1.6" color="#ffffff" material="roughness:1; metalness:0"></a-sphere><a-sphere radius="1.2" position="1.8 -0.2 0" color="#eef3f8" material="roughness:1; metalness:0"></a-sphere><a-sphere radius="1.0" position="-1.5 -0.1 0.2" color="#e3ecf3" material="roughness:1; metalness:0"></a-sphere></a-entity>
    <a-entity position="12 12 -50" scale="1.8 1.0 1.3"><a-sphere radius="1.6" color="#ffffff" material="roughness:1; metalness:0"></a-sphere><a-sphere radius="1.2" position="1.8 -0.2 0" color="#eef3f8" material="roughness:1; metalness:0"></a-sphere><a-sphere radius="0.95" position="-1.6 -0.15 0.1" color="#e3ecf3" material="roughness:1; metalness:0"></a-sphere></a-entity>
  </a-entity>

  <a-entity windflag position="-4.2 0 -9.5">
    <a-cylinder class="pole" radius="0.04" height="3.2" position="0 1.6 0" color="#8a8a8a" material="roughness:0.4; metalness:0.75"></a-cylinder>
    <a-sphere class="finial" radius="0.07" position="0 3.22 0" color="#9a9a9a" material="roughness:0.3; metalness:0.85"></a-sphere>
    <a-entity class="flagAnchor" position="0 3.05 0"><a-plane class="cloth" width="0.9" height="0.5" position="0.45 0 0" color="#e23b4e" material="roughness:0.9; metalness:0; side:double"></a-plane></a-entity>
  </a-entity>
  <a-entity windflag position="4.2 0 -9.5">
    <a-cylinder class="pole" radius="0.04" height="3.2" position="0 1.6 0" color="#8a8a8a" material="roughness:0.4; metalness:0.75"></a-cylinder>
    <a-sphere class="finial" radius="0.07" position="0 3.22 0" color="#9a9a9a" material="roughness:0.3; metalness:0.85"></a-sphere>
    <a-entity class="flagAnchor" position="0 3.05 0"><a-plane class="cloth" width="0.9" height="0.5" position="0.45 0 0" color="#ffd23f" material="roughness:0.9; metalness:0; side:double"></a-plane></a-entity>
  </a-entity>

  <a-entity id="hud" visible="false">
    <a-entity id="lvlT"  ktext="value: 단계 1; color:#12263b; size:0.34" position="-2.6 4.6 -5.6"></a-entity>
    <a-entity id="scoreT" ktext="value: 점수 0; color:#12263b; size:0.34" position="0 4.6 -5.6"></a-entity>
    <a-entity id="leftT" ktext="value: 과녁 4; color:#12263b; size:0.34" position="2.6 4.6 -5.6"></a-entity>
    <a-entity id="windT" ktext="value: 바람 없음; color:#1a4a6b; size:0.26" position="0 4.1 -5.6"></a-entity>
  </a-entity>

  <a-entity id="field"></a-entity>
  <a-entity id="oppfield"></a-entity>
  <a-entity id="toastWrap" visible="false" position="0 2.6 -4"><a-entity id="toastT" ktext="value: ; color:#ffd23f; size:0.4" billboard></a-entity></a-entity>

  <a-entity id="helpWrap" position="0 1.5 -4">
    <a-entity ktext="value: 꾹 눌러 활시위를 당기고 — 조준하고 — 떼면 발사! (오래 당길수록 멀리)\n중력 포물선 + 바람 보정 · 모바일은 폰을 움직여 조준; color:#12263b; size:0.16; bg:#ffffffcc"></a-entity>
  </a-entity>

  <a-entity id="startWrap" position="0 2.1 -3.6">
    <a-entity id="menuTitle" ktext="value: 🏹 VR 석궁; color:#12263b; size:0.3" position="0 1.65 0"></a-entity>
    <a-plane id="modeBtn" class="clickable" width="3.4" height="0.46" position="0 1.08 0" material="shader:flat; color:#3a6ea5"></a-plane>
    <a-entity id="modeLbl" ktext="value: 조작: 🥽 VR 모드; color:#fff; size:0.17" position="0 1.08 0.02"></a-entity>
    <a-plane id="practiceBtn" class="clickable" width="3.4" height="0.58" position="0 0.44 0" material="shader:flat; color:#2ec27e"></a-plane>
    <a-entity ktext="value: ▶ 연습 (1~20단계, 11+는 원거리); color:#063; size:0.18" position="0 0.44 0.02"></a-entity>
    <a-plane id="duelBtn" class="clickable" width="3.4" height="0.58" position="0 -0.2 0" material="shader:flat; color:#c0504a"></a-plane>
    <a-entity ktext="value: ⚔️ 대전 (적과 1:1, 서로 쏘기); color:#fff; size:0.18" position="0 -0.2 0.02"></a-entity>
    <a-plane id="warBtn" class="clickable" width="3.4" height="0.58" position="0 -0.84 0" material="shader:flat; color:#7a4030"></a-plane>
    <a-entity ktext="value: 🎯 전쟁 (지붕 위 저격, 보초 제거); color:#fff; size:0.18" position="0 -0.84 0.02"></a-entity>
  </a-entity>

  <a-entity id="gameover" visible="false" position="0 3.0 -4.2">
    <a-plane width="3.8" height="1.35" material="shader:flat; color:#0e1d30; opacity:0.92"></a-plane>

<script>
'use strict';
window.__grav=9.8; window.__xbowPlaying=false;

/* ===== 물리 1스텝(세미암시적 오일러 + 바람 수평가속). bolt.tick과 __integrateBolt가 공유 =====
   v,p는 {x,y,z}(THREE.Vector3도 됨)를 제자리 변경. k=초단위 스텝(디바이스 dt를 0.05로 클램프). */
window.__boltStep=function(v,p,k,grav,wind){
  v.y += -grav*k; v.x += wind.x*k; v.z += wind.z*k;
  p.x += v.x*k;   p.y += v.y*k;    p.z += v.z*k;
};
/* 순수 적분: 발사점/속도벡터 → 궤적 샘플 + 착탄점. bolt와 같은 __boltStep을 써서 헤드리스 검증이 실제 경로와 일치. */
window.__integrateBolt=function(p0,v0,opts){ opts=opts||{};
  var grav=(opts.grav!=null)?opts.grav:(window.__grav||9.8);
  var wind=opts.wind||window.__wind||{x:0,z:0};
  var dt=(opts.dt!=null)?opts.dt:1/60;          // 디바이스 프레임(~60fps)
  var maxT=(opts.maxT!=null)?opts.maxT:8;
  var groundY=(opts.groundY!=null)?opts.groundY:0.02;
  var p={x:p0.x,y:p0.y,z:p0.z}, v={x:v0.x,y:v0.y,z:v0.z};
  var traj=[{t:0,x:p.x,y:p.y,z:p.z}], t=0;
  while(t<maxT){ var k=Math.min(0.05,dt); window.__boltStep(v,p,k,grav,wind); t+=k;
    traj.push({t:t,x:p.x,y:p.y,z:p.z}); if(p.y<groundY) break; }
  return { traj:traj, landing:{x:p.x,y:p.y,z:p.z,t:t}, v:{x:v.x,y:v.y,z:v.z} };
};
var scene=document.querySelector('a-scene'), field=document.getElementById('field'), oppfield=document.getElementById('oppfield');
var GMODE='vr', GTYPE='practice';
var playing=false, level=1, score=0, remaining=0, boltsLeft=0, shots=0, best=0;
var SPEED_MIN=16, SPEED_MAX=38, DRAW_MS=1200;
var duel=null, war=null;
try{ best=parseInt(localStorage.getItem('crossbow_best')||'0',10)||0; }catch(e){}
function rand(a,b){return a+Math.random()*(b-a);}
function isMobile(){ return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }

/* ===== 오디오 ===== */
var actx=null, GVERB=null, GMASTER=null;
function buildBus(){ try{ var c=actx.createDynamicsCompressor(); c.threshold.value=-16; c.ratio.value=2.5; c.attack.value=0.01; c.release.value=0.25;
  var g=actx.createGain(); g.gain.value=0.95; c.connect(g); g.connect(actx.destination); GMASTER=c;
  var len=Math.floor(actx.sampleRate*1.4), ir=actx.createBuffer(1,len,actx.sampleRate), d=ir.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);
  var conv=actx.createConvolver(); conv.buffer=ir; var wet=actx.createGain(); wet.gain.value=0.5; var pre=actx.createGain();
  pre.connect(conv); conv.connect(wet); wet.connect(GMASTER); GVERB=pre; }catch(e){} }
function gctx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); buildBus(); }catch(e){} } return actx; }
function gout(){ return GMASTER||actx.destination; }
function tone(f1,f2,d,type,vol){ try{ gctx(); var o=actx.createOscillator(), g=actx.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f1,actx.currentTime);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,actx.currentTime+d); o.connect(g); g.connect(gout());
  g.gain.setValueAtTime(vol||0.16,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d); o.start(); o.stop(actx.currentTime+d);
}catch(e){} }
function twang(pw){ tone(360+ (pw||0)*180,150,0.16,'sawtooth',0.2); }  // 당긴 힘이 클수록 높은 '팅'
/* 접근하는 화살 휘익(doppler): 루프 노이즈 + 밴드패스, 거리로 볼륨, 접근/후퇴로 피치 */
var _noiseBuf=null;
function noiseBuf(){ if(_noiseBuf) return _noiseBuf; var n=Math.floor(actx.sampleRate*1.0), b=actx.createBuffer(1,n,actx.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1; _noiseBuf=b; return b; }
window.__startWhoosh=function(){ try{ gctx(); var src=actx.createBufferSource(); src.buffer=noiseBuf(); src.loop=true;
  var bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=3;
  var g=actx.createGain(); g.gain.value=0.0001; src.connect(bp); bp.connect(g); g.connect(gout()); src.start();
  return {src:src,bp:bp,g:g}; }catch(e){ return null; } };
window.__updWhoosh=function(wh, dist, approaching, when){ if(!wh||!actx) return; try{ var t=(when!=null)?when:actx.currentTime;
  var near=Math.max(0, 1 - dist/14); wh.g.gain.setTargetAtTime(near*near*0.5, t, 0.03);
  wh.bp.frequency.setTargetAtTime(approaching? 700+near*1600 : 500+near*400, t, 0.04); }catch(e){} };
window.__stopWhoosh=function(wh){ if(!wh||!actx) return; try{ wh.g.gain.setTargetAtTime(0.0001, actx.currentTime, 0.05); var s=wh.src; setTimeout(function(){ try{s.stop();}catch(e){} },300); }catch(e){} };
function whizBy(){ tone(1400,300,0.25,'sawtooth',0.12); }  // 스쳐 지나가는 소리(명중 못했을 때)
/* 나무판자 부서지는 소리: 크랙 트랜지언트(하이패스 노이즈) + 우디 '톡' 공명(삼각파) + 스플린터 테일(밴드패스 노이즈) */
function woodBreak(big){ try{ gctx(); var t=actx.currentTime, out=gout();
  var nb=actx.createBufferSource(); nb.buffer=noiseBuf(); nb.loop=true;
  var hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1700;
  var ng=actx.createGain(); ng.gain.setValueAtTime(big?0.5:0.36,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  nb.connect(hp); hp.connect(ng); ng.connect(out); nb.start(t); nb.stop(t+0.1);
  var woods=[185,262,96]; for(var i=0;i<woods.length;i++){ var o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(woods[i]*(0.95+Math.random()*0.1),t); o.frequency.exponentialRampToValueAtTime(woods[i]*0.6,t+0.12);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(big?0.22:0.16,t+0.006); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+0.18); }
  var nb2=actx.createBufferSource(); nb2.buffer=noiseBuf(); nb2.loop=true;
  var bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=850; bp.Q.value=0.8;
  var ng2=actx.createGain(); ng2.gain.setValueAtTime(big?0.18:0.12,t+0.015); ng2.gain.exponentialRampToValueAtTime(0.001,t+0.26);
  nb2.connect(bp); bp.connect(ng2); ng2.connect(out); nb2.start(t); nb2.stop(t+0.3);
}catch(e){} }

/* ===== 당기기(충전) → 발사 ===== */
window.__drawing=false; var drawT0=0;
window.__drawStart=function(){ if(!playing) return; window.__drawing=true; drawT0=performance.now(); showPwr(true); };
window.__drawPower=function(){ if(!window.__drawing) return 0; return Math.min(1, (performance.now()-drawT0)/DRAW_MS); };
window.__drawRelease=function(sx,sy,sz,dx,dy,dz){ if(!window.__drawing) return; var pw=window.__drawPower(); window.__drawing=false; showPwr(false);
  if(!playing) return; fireBolt(sx,sy,sz,dx,dy,dz, pw, {owner:'me'}); };
function showPwr(on){ var w=document.getElementById('pwrap'); if(w) w.style.display=on?'block':'none'; }
setInterval(function(){ if(window.__drawing){ var b=document.getElementById('pbar'); if(b) b.style.width=(window.__drawPower()*100).toFixed(0)+'%'; } },40);

/* ===== 발사 ===== */
function speedFor(pw){ return SPEED_MIN + Math.min(1,Math.max(0,pw))*(SPEED_MAX-SPEED_MIN); }
function fireBolt(sx,sy,sz,dx,dy,dz,pw,opts){ opts=opts||{}; var sp=opts.speed || speedFor(pw);
  if(opts.owner==='me'){ if(!playing) return;
    if(GTYPE==='duel'){ if(!duel||duel.over||duel.turn!=='me'||duel.busy) return; duel.busy=true; }
    else if(GTYPE==='practice'){ if(boltsLeft<=0) return; boltsLeft--; }
    shots++; twang(pw); updateHUD();
    if(GTYPE==='practice' && boltsLeft<=0 && remaining>0){ var cl=level; setTimeout(function(){ if(playing && level===cl && remaining>0) gameOverFail(); }, 2800); } }
  else if(opts.owner==='ai'){ if(duel) duel.busy=true; }
  var n=Math.sqrt(dx*dx+dy*dy+dz*dz)||1; dx/=n; dy/=n; dz/=n;
  var b=document.createElement('a-entity'); b.setAttribute('class','boltEnt');
  b.innerHTML='<a-cylinder radius="0.016" height="0.5" rotation="90 0 0" material="roughness:0.8; metalness:0; color:#4a3826"></a-cylinder>'+
    '<a-cone radius-bottom="0.05" radius-top="0" height="0.16" position="0 0 -0.3" rotation="-90 0 0" material="roughness:0.35; metalness:0.6; color:#c8ccd4"></a-cone>'+
    '<a-box width="0.001" height="0.11" depth="0.1" position="0 0 0.22" material="shader:flat; color:'+(opts.owner==='ai'?'#4aa3ff':'#e23b4e')+'; side:double; opacity:0.95; transparent:true"></a-box>'+
    '<a-box width="0.11" height="0.001" depth="0.1" position="0 0 0.22" material="shader:flat; color:#ffffff; side:double; opacity:0.95; transparent:true"></a-box>';
  b.setAttribute('position', sx.toFixed(2)+' '+sy.toFixed(2)+' '+sz.toFixed(2));
  b.setAttribute('bolt','vx:'+(dx*sp).toFixed(2)+'; vy:'+(dy*sp).toFixed(2)+'; vz:'+(dz*sp).toFixed(2)+'; incoming:'+(opts.owner==='ai'?'true':'false')+'; owner:'+(opts.owner||'me'));
  scene.appendChild(b);
}
/* 탄도 해법: 발사점 S에서 목표 T를 맞추는 속도벡터(속도 v 고정). 못 닿으면 null */
function ballisticAim(S, T, v, g){ var dx=T.x-S.x, dz=T.z-S.z, dy=T.y-S.y; var dxz=Math.sqrt(dx*dx+dz*dz);
  var disc=v*v*v*v - g*(g*dxz*dxz + 2*dy*v*v); if(disc<0) return null;
  var ang=Math.atan((v*v - Math.sqrt(disc))/(g*dxz));   // 낮은 각(직사)
  var horiz={x:dx/dxz, z:dz/dxz}; return { x:horiz.x*Math.cos(ang), y:Math.sin(ang), z:horiz.z*Math.cos(ang) }; }
/* 바람 보정 조준(예측-보정): 바람 무시 해를 구해 실제 바람 궤적의 착탄 잔차만큼 가상 조준점을 당겨 재해석. 2~3회면 수렴. */
function ballisticAimWind(S, T, v, g, wind, iters){ wind=wind||window.__wind||{x:0,z:0}; iters=iters||3;
  var aimT={x:T.x,y:T.y,z:T.z}; var aim=ballisticAim(S,aimT,v,g);
  for(var it=0; it<iters && aim; it++){ var m=Math.sqrt(aim.x*aim.x+aim.y*aim.y+aim.z*aim.z)||1;
    var v0={x:aim.x/m*v,y:aim.y/m*v,z:aim.z/m*v};
    var sim=window.__integrateBolt(S,v0,{grav:g,wind:wind,dt:1/120,groundY:-999,maxT:7});
    var best=1e9,bp=null; for(var i=0;i<sim.traj.length;i++){ var s=sim.traj[i]; var d=Math.hypot(s.x-T.x,s.y-T.y,s.z-T.z); if(d<best){best=d;bp=s;} }
    if(!bp || best<0.04) break;
    aimT.x += (T.x-bp.x); aimT.y += (T.y-bp.y); aimT.z += (T.z-bp.z); aim=ballisticAim(S,aimT,v,g); }
  return aim; }

/* 내 화살이 .target(과녁/적)에 명중 → 모드별 분기 */
window.__boltHit=function(t, prox){ if(t.dataset.dead) return;
  var pos=t.getAttribute('position'); var r=parseFloat(t.dataset.r)||0.5;
  if(GTYPE==='war'){ return enemyShot(t, prox, pos, r, 'war'); }
  if(GTYPE==='duel'){ return enemyShot(t, prox, pos, r, 'duel'); }
  // ----- 연습: 과녁 명중 -----
  t.dataset.dead='1'; var pts = prox<0.11?10:(prox<0.24?5:2);
  woodBreak(pts>=10);
  if(pos){ floatText('+'+pts, (pos.x||0)+' '+((pos.y||2)+0.25)+' '+(pos.z||-6), pts>=10?'#ffcf3f':'#ffffff');
    shatter((pos.x||0),(pos.y||2),(pos.z||-6), r, pts>=10?'#ffcf3f':'#d63a3a'); }
  t.setAttribute('scale','0.01 0.01 0.01'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },40);
  score+=pts; remaining--; updateHUD(); if(remaining<=0) levelClear();
};

/* ===== 비주얼 효과 ===== */
function floatText(txt,pos,color){ var e=document.createElement('a-entity'); e.setAttribute('ktext','value: '+txt+'; color:'+(color||'#ffd23f')+'; size:0.34');
  e.setAttribute('position',pos); e.setAttribute('billboard','');
  var y=parseFloat(pos.split(' ')[1]); e.setAttribute('animation','property: position; to: '+pos.split(' ')[0]+' '+(y+0.7).toFixed(2)+' '+pos.split(' ')[2]+'; dur:650');
  scene.appendChild(e); setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },700); }
function burst(x,y,z,color){ for(var i=0;i<8;i++){ var c=(i%2)?(color||'#d6c088'):'#8a6a3a';
    var s=document.createElement('a-entity'); s.setAttribute('geometry','primitive:box; width:0.05; height:0.05; depth:0.05');
    s.setAttribute('material','shader:flat; color:'+c+'; opacity:1; transparent:true'); s.setAttribute('position',x+' '+y+' '+z);
    s.setAttribute('animation__p','property:position; to:'+(x+(Math.random()-0.5)*0.9).toFixed(2)+' '+(y+(Math.random()-0.15)*0.9).toFixed(2)+' '+(z+(Math.random()-0.5)*0.9).toFixed(2)+'; dur:360; easing:easeOutQuad');
    s.setAttribute('animation__o','property:material.opacity; from:1; to:0; dur:380'); scene.appendChild(s);
    (function(e){ setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },400); })(s); }
  var ring=document.createElement('a-entity'); ring.setAttribute('geometry','primitive:ring; radius-inner:0.04; radius-outer:0.09');
  ring.setAttribute('material','shader:flat; color:#fff3b0; opacity:0.9; transparent:true; side:double'); ring.setAttribute('position',x+' '+y+' '+z); ring.setAttribute('billboard','');
  ring.setAttribute('animation__s','property:scale; from:1 1 1; to:4.5 4.5 4.5; dur:300'); ring.setAttribute('animation__o','property:material.opacity; from:0.9; to:0; dur:320');
  scene.appendChild(ring); setTimeout(function(){ if(ring.parentNode) ring.parentNode.removeChild(ring); },340); }
/* 과녁 파괴: 나무판자/과녁면 조각이 바깥·아래로 튀며 회전·페이드(부서지는 연출) */
function shatter(x,y,z,r,faceColor){ var cols=['#8a6038','#6b4a2a','#5a3d22','#c9b48f',faceColor||'#d6c088','#ffffff'];
  var N=12; for(var i=0;i<N;i++){ var sh=document.createElement('a-entity');
    var w=(0.04+Math.random()*0.08).toFixed(3), h=(0.02+Math.random()*0.05).toFixed(3), d=(0.1+Math.random()*(r*0.9)).toFixed(3);
    sh.setAttribute('geometry','primitive:box; width:'+w+'; height:'+h+'; depth:'+d);
    sh.setAttribute('material','roughness:1; metalness:0; color:'+cols[i%cols.length]+'; transparent:true; opacity:1');
    sh.setAttribute('position', x+' '+y+' '+z); sh.setAttribute('rotation', (Math.random()*360)+' '+(Math.random()*360)+' '+(Math.random()*360));
    var ang=Math.random()*6.28, rad=r*(0.6+Math.random()*1.5);
    var tx=(x+Math.cos(ang)*rad).toFixed(2), ty=(y+(Math.random()*0.5-0.1)*r - rad*0.35).toFixed(2), tz=(z+Math.sin(ang)*rad*0.5+(Math.random()*0.4-0.2)).toFixed(2);
    sh.setAttribute('animation__p','property:position; to:'+tx+' '+ty+' '+tz+'; dur:'+(430+Math.random()*230).toFixed(0)+'; easing:easeOutQuad');
    sh.setAttribute('animation__r','property:rotation; to:'+(Math.random()*720-360).toFixed(0)+' '+(Math.random()*720-360).toFixed(0)+' '+(Math.random()*720-360).toFixed(0)+'; dur:650');
    sh.setAttribute('animation__o','property:material.opacity; from:1; to:0; dur:'+(540+Math.random()*180).toFixed(0)+'; easing:easeInQuad');
    scene.appendChild(sh); (function(e){ setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },780); })(sh); } }
function toast(msg){ document.getElementById('toastT').setAttribute('ktext','value',msg); document.getElementById('toastWrap').setAttribute('visible',true);
  setTimeout(function(){ document.getElementById('toastWrap').setAttribute('visible',false); },1200); }

/* ===== 반실사 캔버스 텍스처(절차 생성) + PBR 적용 — drums.html 패턴 이식 ===== */
var TEX={};
function cvs(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
// 잔디 바닥: 그린 그라데이션 + 미세 스펙클 + 스포트 풀
function texGrass(key){ key=key||'grass'; if(TEX[key])return TEX[key]; var S=512,c=cvs(S,S),x=c.getContext('2d');
  var g=x.createRadialGradient(S*0.5,S*0.38,20,S*0.5,S*0.5,S*0.7); g.addColorStop(0,'#7bab5e'); g.addColorStop(.6,'#6f9a54'); g.addColorStop(1,'#5c8547');
  x.fillStyle=g; x.fillRect(0,0,S,S);

  duel.oppPos={x:1.5, y:1.2, z:-dist};
  document.getElementById('hud').setAttribute('visible',true); updateHUD();
  toast('⚔️ 대전 — 적을 먼저 쓰러뜨려라! 날아오는 화살은 몸을 움직여 피해요'); }
function duelPlayerDamaged(){ if(!duel||duel.over) return; duel.hpMe--; updateHUD();
  if(duel.hpMe<=0){ duel.over=true; endPlay('💀 패배 — 쓰러졌습니다','적에게 당함', 200); return; }
  duel.turn='me'; duel.busy=false; updateHUD(); toast('피격! 남은 생명 '+hearts(duel.hpMe)); }
function aiTurn(){ if(!duel||duel.over||!playing) return; duel.turn='ai'; duel.busy=false; updateHUD(); toast('적 차례 — 조심!');
  setTimeout(aiShoot, 1500); }
function aiShoot(){ if(!duel||duel.over||!playing||duel.turn!=='ai') return;
  var S=duel.oppPos, T=camWorld(), v=rand(26,32);
  var aim=ballisticAimWind(S,T,v,window.__grav,window.__wind); if(!aim){ aim={x:(T.x-S.x),y:0.3,z:(T.z-S.z)}; }
  var n=Math.sqrt(aim.x*aim.x+aim.y*aim.y+aim.z*aim.z)||1; aim.x/=n; aim.y/=n; aim.z/=n;
  var err=Math.max(0.012, 0.05 - (3-duel.hpAi)*0.005 - (3-duel.hpMe)*0.004);   // 진행될수록 정확
  aim.x+=rand(-err,err); aim.y+=rand(-err,err); aim.z+=rand(-err,err);
  muzzleFlash({x:S.x,y:S.y+0.2,z:S.z});
  fireBolt(S.x,S.y+0.2,S.z, aim.x,aim.y,aim.z, 0, {owner:'ai', speed:v}); }
/* 한 발이 명중 없이 소멸 → 턴 넘김(대전만). 명중 시엔 _hit로 콜백 안 됨 */
window.__onBoltEnd=function(owner){ if(GTYPE!=='duel'||!duel||duel.over||!playing) return;
  if(owner==='me'){ whizBy(); duel.busy=false; aiTurn(); }
  else if(owner==='ai'){ duel.busy=false; duel.turn='me'; updateHUD(); toast('내 차례 — 쏘세요!'); } };

/* ===== 전쟁(저격) 모드: 지붕 위 스나이퍼 vs 보초 적들 ===== */
function buildRooftop(){ var r=document.createElement('a-entity'); r.setAttribute('class','warrig');
  r.innerHTML=
    '<a-box width="6.5" height="0.4" depth="5" position="0 2.5 0.6" color="#6b6f76" material="roughness:0.95; metalness:0.05"></a-box>'+
    '<a-box width="6.5" height="0.9" depth="0.3" position="0 3.15 -1.8" color="#565a61" material="roughness:0.95"></a-box>'+
    '<a-box width="0.3" height="0.9" depth="5" position="-3.1 3.15 0.6" color="#565a61" material="roughness:0.95"></a-box>'+
    '<a-box width="0.3" height="0.9" depth="5" position="3.1 3.15 0.6" color="#565a61" material="roughness:0.95"></a-box>';
  field.appendChild(r); }
function setupWar(){ clearTargets(); setRigHeight(2.4);   // 지붕 위 시점
  war={total:0, down:0, over:false, hpMe:5, loop:null};
  var mag=rand(0.3,1.6), ang=rand(0,6.28); window.__wind={ x:Math.cos(ang)*mag, z:Math.sin(ang)*mag*0.3 };
  buildRooftop();
  var spots=[[-10,-22],[8,-26],[-4,-34],[14,-40],[-14,-44],[2,-50],[18,-56],[-20,-58]];
  for(var i=0;i<spots.length;i++){ var g=makeGuard(spots[i][0], spots[i][1], {hp:1, color:(i%2?'#5a4030':'#3f4a34'), hat:'#20262c'});
    if(i%3===0){ g.setAttribute('tmove','type:linear; ampx:'+rand(1.5,3).toFixed(1)+'; speed:'+rand(0.3,0.6).toFixed(2)+'; phase:'+rand(0,6.28).toFixed(2)); }
    war.total++; }
  document.getElementById('hud').setAttribute('visible',true); updateHUD();
  toast('🎯 저격 — 지붕 위에서 보초병을 전원 제거! (적도 반격합니다)');
  war.loop=setInterval(warTick, 1300); }
function warTick(){ if(!war||war.over||!playing) return;
  var gs=document.querySelectorAll('.guard'), alive=[]; for(var i=0;i<gs.length;i++){ if(!gs[i].dataset.dead) alive.push(gs[i]); }
  if(!alive.length) return;
  if(Math.random() < 0.5){ guardShoot(alive[Math.floor(Math.random()*alive.length)]); } }
function guardShoot(g){ if(!g||g.dataset.dead||!window.AFRAME) return; var wp=new AFRAME.THREE.Vector3(); try{ g.object3D.getWorldPosition(wp); }catch(e){ return; }
  var S={x:wp.x, y:wp.y+0.25, z:wp.z}, T=camWorld(), v=rand(24,30);
  var aim=ballisticAimWind(S,T,v,window.__grav,window.__wind); if(!aim) return;
  var n=Math.sqrt(aim.x*aim.x+aim.y*aim.y+aim.z*aim.z)||1; aim.x/=n; aim.y/=n; aim.z/=n;
  var err=0.06; aim.x+=rand(-err,err); aim.y+=rand(-err,err); aim.z+=rand(-err,err);
  muzzleFlash(S); fireBolt(S.x,S.y,S.z, aim.x,aim.y,aim.z, 0, {owner:'ai', speed:v}); }
function warPlayerDamaged(){ if(!war||war.over) return; war.hpMe--; updateHUD();
  if(war.hpMe<=0){ war.over=true; clearWarLoop(); endPlay('💀 작전 실패','적 '+war.down+'/'+war.total+' 제거', 200); } }
function warWin(){ if(!war||war.over) return; war.over=true; clearWarLoop();
  endPlay('🏆 작전 성공 — 전원 제거!','적 '+war.down+'/'+war.total+'  ·  남은 생명 '+hearts(war.hpMe), 900); }
function clearWarLoop(){ if(war && war.loop){ clearInterval(war.loop); war.loop=null; } }

/* ===== 입력/모드 ===== */
function applyMode(){ var cb=document.getElementById('cambow'), rh=document.getElementById('rhand'), lh=document.getElementById('lhand'), cam=document.getElementById('cam');
  if(GMODE==='mobile'){ window.__mobileAim=true; cb.setAttribute('visible',true); cb.setAttribute('bow','mount:camera'); rh.setAttribute('visible',false); lh.setAttribute('visible',false);
    cam.setAttribute('look-controls','magicWindowTrackingEnabled:true; touchEnabled:false; mouseEnabled:true; pointerLockEnabled:false');
    attachAimSmooth();
    document.getElementById('mob').classList.add('on'); document.getElementById('crosshair').classList.add('on'); document.getElementById('vignette').classList.add('on'); }
  else { window.__mobileAim=false; cb.setAttribute('visible',false); rh.setAttribute('visible',true); lh.setAttribute('visible',true);
    rh.setAttribute('bow','mount:hand'); lh.setAttribute('bow','mount:hand');
    document.getElementById('mob').classList.remove('on'); document.getElementById('crosshair').classList.remove('on'); document.getElementById('vignette').classList.remove('on'); } }
/* aim-smooth는 look-controls '뒤'에 tick해야 보간이 먹으므로, 런타임에 setAttribute로 나중에 부착 */
function attachAimSmooth(){ try{ var cam=document.getElementById('cam'); if(cam && window.AFRAME && !cam.getAttribute('aim-smooth')) cam.setAttribute('aim-smooth',''); }catch(e){} }
// 모바일: 꾹 눌러 당기고 떼면 카메라 전방으로 발사
function camForward(){ var cam=scene.camera; var s=new AFRAME.THREE.Vector3(), q=new AFRAME.THREE.Quaternion(), d=new AFRAME.THREE.Vector3();
  cam.getWorldPosition(s); cam.getWorldQuaternion(q); d.set(0,0,-1).applyQuaternion(q); return {s:s,d:d}; }
function mobDown(e){ if(GMODE!=='mobile'||!playing) return; if(e.target.closest && e.target.closest('#recenter,.back')) return; window.__drawStart(); }
function mobUp(e){ if(GMODE!=='mobile'||!playing||!window.__drawing) return; var f=camForward(); window.__drawRelease(f.s.x,f.s.y,f.s.z, f.d.x,f.d.y,f.d.z); }
window.addEventListener('touchstart', mobDown, {passive:true}); window.addEventListener('mousedown', mobDown);
window.addEventListener('touchend', mobUp, {passive:true}); window.addEventListener('mouseup', mobUp);
document.getElementById('recenter').addEventListener('click', function(ev){ ev.stopPropagation(); recenter(); });
function recenter(){ try{ var cam=scene.camera, rig=document.getElementById('rig'); var q=new AFRAME.THREE.Quaternion(); cam.getWorldQuaternion(q);
  var e=new AFRAME.THREE.Euler().setFromQuaternion(q,'YXZ'); rig.object3D.rotation.y -= e.y; toast('중앙정렬 완료'); }catch(e){} }
// 모바일 탭 핸들러(vr-common)는 발사 대신 아무 것도 — 직접 down/up으로 처리
window.__vrTapAt=function(){};

/* 메뉴 버튼 클릭 가능 토글: 게임 중엔 clickable 제거 → 숨은 버튼이 탭 레이캐스트를 가로채
   대전/모드전환이 오작동하던 버그 방지(부모 visible=false만으론 레이캐스트 제외 안 됨). */
function setMenuClickable(on){ ['modeBtn','practiceBtn','duelBtn','warBtn'].forEach(function(id){ var e=document.getElementById(id);
  if(e){ if(on) e.classList.add('clickable'); else e.classList.remove('clickable'); } }); }
function resetUI(){ document.getElementById('startWrap').setAttribute('visible',false); document.getElementById('gameover').setAttribute('visible',false);
  document.getElementById('helpWrap').setAttribute('visible',false); document.getElementById('hud').setAttribute('visible',true); setMenuClickable(false); }
function startPractice(){ GTYPE='practice'; playing=true; window.__xbowPlaying=true; score=0; shots=0; setRigHeight(0); applyMode(); resetUI(); loadLevel(1); }
function startDuel(){ GTYPE='duel'; playing=true; window.__xbowPlaying=true; shots=0; applyMode(); resetUI(); setupDuel(); }
function startWar(){ GTYPE='war'; playing=true; window.__xbowPlaying=true; shots=0; applyMode(); resetUI(); setupWar(); }
scene.addEventListener('click', function(evt){ var el=evt.target; if(!el) return;
  if(el.id==='modeBtn'){ if(playing) return; GMODE=(GMODE==='vr')?'mobile':'vr'; document.getElementById('modeLbl').setAttribute('ktext','value','조작: '+(GMODE==='vr'?'🥽 VR 모드':'📱 모바일 모드')); return; }
  if(el.id==='practiceBtn'){ if(!playing) startPractice(); return; }
  if(el.id==='duelBtn'){ if(!playing) startDuel(); return; }
  if(el.id==='warBtn'){ if(!playing) startWar(); return; } });

// 기본 모드 자동 추정
GMODE = isMobile() ? 'mobile' : 'vr';
try{ document.getElementById('modeLbl').setAttribute('ktext','value','조작: '+(GMODE==='vr'?'🥽 VR 모드':'📱 모바일 모드')); }catch(e){}

window.__CROSSBOW_TEST__={ startPractice:startPractice, startDuel:startDuel, startWar:startWar, setMode:function(m){GMODE=m;}, get mode(){return GMODE}, get gtype(){return GTYPE},
  get playing(){return playing}, get level(){return level}, get score(){return score}, get remaining(){return remaining}, get ammo(){return boltsLeft}, get best(){return best},
  get wind(){return window.__wind}, get nTargets(){return document.querySelectorAll('.target').length}, get nBolts(){return document.querySelectorAll('.boltEnt').length},
  get nGuards(){ var g=document.querySelectorAll('.guard'), a=0; for(var i=0;i<g.length;i++) if(!g[i].dataset.dead) a++; return a; },
  get duel(){return duel}, get war(){return war}, get turn(){return duel?duel.turn:null}, get busy(){return duel?duel.busy:null},
  get hpMe(){ return GTYPE==='war'?(war&&war.hpMe):(duel&&duel.hpMe); }, get hpAi(){ return duel&&duel.hpAi; },
  ballisticAim:ballisticAim, ballisticAimWind:ballisticAimWind, speedFor:speedFor, loadLevel:loadLevel,
  integrate:function(p0,v0,opts){ return window.__integrateBolt(p0,v0,opts); },
  fireAt:function(dx,dy,dz,pw){ fireBolt(0,1.6,0, dx,dy,dz, pw==null?1:pw, {owner:'me'}); },
  hit:function(prox){ var t=document.querySelector('.target'); if(t) window.__boltHit(t, prox==null?0.05:prox); },
  clearLevel:function(){ var ts=document.querySelectorAll('.target:not(.guard)'); for(var i=0;i<ts.length;i++) window.__boltHit(ts[i],0.05); },
  aiShoot:aiShoot,
  /* 헤드리스 전투 시뮬(bolt가 안 날므로 소멸/명중/피격을 직접 구동) */
  playerMiss:function(){ window.__onBoltEnd('me'); },
  aiMiss:function(){ window.__onBoltEnd('ai'); },
  shootGuard:function(){ var t=document.querySelector('.target.guard:not([data-dead])'); if(t) window.__boltHit(t,0.05); },
  playerStruckHit:function(){ window.__playerStruck('hit'); },
  playerStruckGraze:function(){ window.__playerStruck('graze'); },
  warTick:function(){ if(typeof warTick==='function') warTick(); },
  /* 오프라인 오디오 렌더: 실제 synth 경로를 OfflineAudioContext로 뽑아 분석(엔벨로프/피치/클리핑). */
  renderAudioOffline: async function(kind, seconds){ seconds=seconds||1.5;
    var saved={actx:actx, M:GMASTER, V:GVERB, nb:_noiseBuf};
    var sr=44100, oac=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1, Math.ceil(sr*seconds), sr);
    actx=oac; GMASTER=null; GVERB=null; _noiseBuf=null; buildBus();
    if(kind==='whoosh'){ var wh=window.__startWhoosh();
      var N=90; for(var i=0;i<=N;i++){ var tt=i/N*seconds, dist=30*(1-i/N); window.__updWhoosh(wh, dist, true, tt); } }
    else if(kind==='twang'){ twang(1); }
    else if(kind==='hit'){ tone(1250,0,0.09,'square',0.16); }
    else if(kind==='woodbreak'){ woodBreak(true); }
    else if(kind==='thud'){ impactThud(); }
    else if(kind==='whiz'){ whizBy(); }
    var buf=await oac.startRendering();
    actx=saved.actx; GMASTER=saved.M; GVERB=saved.V; _noiseBuf=saved.nb;
    return { pcm:Array.from(buf.getChannelData(0)), sr:sr, dur:seconds }; } };
</script>
