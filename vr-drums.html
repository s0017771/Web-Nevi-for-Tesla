<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VR 드럼</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="vr-common.js"></script>
<script src="vr-songs.js"></script>
<script src="vr-drums-music.js"></script>
<script>
if(window.AFRAME){
  var _tp=new THREE.Vector3();
  // 드럼스틱: 컨트롤러 끝의 속도를 재서, 드럼 패드 안으로 빠르게 들어가면 타격
  AFRAME.registerComponent('drumstick',{
    schema:{hand:{default:'right'}},
    init:function(){ this.tip=new THREE.Vector3(); this.prev=new THREE.Vector3(); this.started=false; this.lastHit={};
      var s=document.createElement('a-cylinder'); s.setAttribute('radius','0.013'); s.setAttribute('height','0.42'); s.setAttribute('material','shader:flat; color:#caa268'); s.setAttribute('position','0 0 -0.21'); s.setAttribute('rotation','90 0 0'); this.el.appendChild(s);
      var tb=document.createElement('a-sphere'); tb.setAttribute('radius','0.022'); tb.setAttribute('material','shader:flat; color:#f3f3f3'); tb.setAttribute('position','0 0 -0.42'); this.el.appendChild(tb); this.tipEl=tb;
      var self=this; this.el.addEventListener('triggerdown', function(){ if(window.__hitPiece) window.__hitPiece('K',0.92); }); // 트리거=킥(발 대신)
    },
    tick:function(t,dt){ if(!this.tipEl) return; this.tipEl.object3D.getWorldPosition(this.tip);
      var sp=this.started? this.prev.distanceTo(this.tip)/((dt||16)/1000) : 0; this.prev.copy(this.tip); this.started=true;
      if(sp<1.0) return; var drums=document.querySelectorAll('.drum'), now=performance.now();
      for(var i=0;i<drums.length;i++){ var dEl=drums[i], id=dEl.dataset.piece; if(now-(this.lastHit[id]||0)<110) continue;
        dEl.object3D.getWorldPosition(_tp); if(_tp.distanceTo(this.tip) < (parseFloat(dEl.dataset.r)||0.18)){ this.lastHit[id]=now; var vel=Math.max(0.25, Math.min(1,(sp-0.9)/5)); if(window.__hitDrum) window.__hitDrum(dEl, vel); } } }
  });
}
</script>
<style>
  html,body{margin:0;height:100%;background:#0a0b12;font-family:-apple-system,"Malgun Gothic","Segoe UI","Noto Sans KR",sans-serif}
  a.back{position:fixed;top:12px;left:12px;z-index:11;color:#d8dcff;text-decoration:none;font-size:.9rem;background:#12131fcc;border:1px solid #2c2f45;border-radius:10px;padding:8px 12px}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#aeb6e0;font-size:.85rem;z-index:11;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<a-scene background="color:#0a0b12" vr-mode-ui="enabled:true" device-orientation-permission-ui="enabled:false"
  renderer="colorManagement:true; physicallyCorrectLights:true; toneMapping:ACESFilmic; exposure:1.05; antialias:true; highRefreshRate:true">
  <a-sky id="sky" color="#0b0d16"></a-sky>
  <!-- 무대 바닥 + 뒤 배경(캔버스 텍스처는 JS에서 적용) -->
  <a-entity id="floor" geometry="primitive:circle; radius:9; segments:48" rotation="-90 0 0" position="0 0.001 -0.8"
    material="shader:standard; color:#151826; metalness:0.35; roughness:0.5"></a-entity>
  <a-entity id="backdrop" geometry="primitive:cylinder; radius:9; height:7; openEnded:true; thetaStart:200; thetaLength:140; segments:32"
    position="0 3.2 -0.8" material="shader:standard; color:#12141f; metalness:0.1; roughness:0.95; side:back"></a-entity>
  <!-- 조명: 반구(자연광) + 미세 앰비언트 + 키(방향광) + 따뜻/차가운 포인트 스팟 -->
  <a-entity light="type:hemisphere; intensity:0.5; color:#cbd6ff; groundColor:#241521"></a-entity>
  <a-entity light="type:ambient; intensity:0.22; color:#8894c8"></a-entity>
  <a-entity light="type:directional; intensity:1.0; color:#fff2dc" position="-1.6 3.4 1.4"></a-entity>
  <a-entity light="type:point; intensity:0.7; distance:9; decay:2; color:#ffd7a2" position="0.9 2.5 0.5"></a-entity>
  <a-entity light="type:point; intensity:0.5; distance:9; decay:2; color:#a6bcff" position="-1.6 2.1 -1.0"></a-entity>
  <a-entity light="type:spot; intensity:0.5; angle:55; penumbra:0.6; distance:8; color:#fff" position="0 3.6 0.2" rotation="-70 0 0"></a-entity>

  <a-entity id="kit"></a-entity>

  <a-entity id="hud" position="0 2.1 -1.6">
    <a-entity id="scoreT" ktext="value: 자유 연주 🥁; color:#cfe; size:0.2" position="0 0 0" billboard></a-entity>
  </a-entity>

  <a-entity id="menuRoot" position="0 1.5 -1.95"></a-entity>
  <a-entity id="lessonHud" position="0 2.42 -1.75" visible="false">
    <a-entity id="lessonT" ktext="value: ; color:#cfe; size:0.14" billboard></a-entity>
    <a-plane id="stopBtn" class="clickable" width="0.9" height="0.26" position="0 -0.3 0" material="shader:flat; color:#b5484f" visible="false"></a-plane>
    <a-entity id="stopLbl" ktext="value: ■ 메뉴로; color:#fff; size:0.1" position="0 -0.3 0.02" visible="false"></a-entity>
  </a-entity>

  <a-entity id="rig">
    <a-camera position="0 1.6 0.6" wasd-controls="enabled:true">
      <a-entity cursor="rayOrigin:mouse" raycaster="objects:.clickable; far:30"></a-entity>
    </a-camera>
    <a-entity id="rhand" drumstick="hand:right" laser-controls="hand:right" raycaster="objects:.clickable; far:30; showLine:false" cursor="fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
    <a-entity id="lhand" drumstick="hand:left"  laser-controls="hand:left"  raycaster="objects:.clickable; far:30; showLine:false" cursor="fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
  </a-entity>
</a-scene>

<div id="hint">🥽 VR: 스틱으로 드럼 치기 · 트리거=킥 | 폰: 드럼을 탭 (PC: 마우스 클릭)</div>

<script>
'use strict';
var scene=document.querySelector('a-scene'), kit=document.getElementById('kit');
var playing=false, hits=0;

/* ===== 사운드 엔진(리얼 합성) =====
   실제 GM 드럼 샘플(FluidR3_GM, 기기에서 로드) 우선 + 레이어드 합성 폴백.
   컴프/컨벌루션 리버브 + 소프트 리미터(tanh) 버스. 벨로시티·휴머나이징·하이햇 초크.
   헤드리스 OfflineAudioContext 검증 완료(클리핑 없음·벨로시티 차등·휴머나이징·decay/밝기/음정). */
var AC=null, MASTER=null, REVERB=null;

/* 소프트 리미터 커브: 소신호 unity, 대신호 ~0.9에서 포화 → 다중 동시타에도 클리핑 방지 */
function _softCurve(){ var N=2048, c=new Float32Array(N), i, u, s;
  for(i=0;i<N;i++){ u=(i/(N-1))*2-1; s=2*u; c[i]=0.9*Math.tanh(s/0.9); } return c; }
function buildBus(){ try{
  var c=AC.createDynamicsCompressor(); c.threshold.value=-16; c.knee.value=12; c.ratio.value=2.5; c.attack.value=0.01; c.release.value=0.25;
  var g=AC.createGain(); g.gain.value=0.92;
  var pre=AC.createGain(); pre.gain.value=0.5;
  var lim=AC.createWaveShaper(); lim.curve=_softCurve(); lim.oversample='2x';
  c.connect(g); g.connect(pre); pre.connect(lim); lim.connect(AC.destination); MASTER=c;
  var len=Math.floor(AC.sampleRate*1.6), ir=AC.createBuffer(2,len,AC.sampleRate), ch, d, i;
  for(ch=0;ch<2;ch++){ d=ir.getChannelData(ch); for(i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8); }
  var conv=AC.createConvolver(); conv.buffer=ir; var wet=AC.createGain(); wet.gain.value=0.9; var vpre=AC.createGain(); vpre.gain.value=1;
  vpre.connect(conv); conv.connect(wet); wet.connect(MASTER); REVERB=vpre;
}catch(e){ MASTER=null; REVERB=null; } }
function actx(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); buildBus(); }catch(e){} } return AC; }
function out(){ return MASTER||AC.destination; }
function sendVerb(node,amt){ try{ if(REVERB){ var s=AC.createGain(); s.gain.value=amt; node.connect(s); s.connect(REVERB); } }catch(e){} }

/* ===== 샘플(기기에서만 로드): FluidR3_GM percussion-mp3 ===== */
var SFBASE='https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/', NAMES=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function midiName(m){ return NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1); }
var PERC={buf:{}, loading:{}};
function loadDrum(m){ if(PERC.buf[m]||PERC.loading[m]||!AC||typeof fetch!=='function') return; PERC.loading[m]=true;
  fetch(SFBASE+'percussion-mp3/'+midiName(m)+'.mp3').then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(function(a){ return AC.decodeAudioData(a); })
    .then(function(b){ PERC.buf[m]=b; }).catch(function(){ PERC.loading[m]=false; }); }
/* 피스: GM 노트 · 합성종류 · 기본음량 · (탐 f값) */
var PIECE={ K:{n:36,s:'kick',g:0.95}, S:{n:38,s:'snare',g:0.85}, H:{n:42,s:'hat',g:0.6}, O:{n:46,s:'ohat',g:0.62},
  Th:{n:48,s:'tom',g:0.8,f:260}, Tm:{n:47,s:'tom',g:0.8,f:200}, Tf:{n:43,s:'tom',g:0.85,f:150},
  Cr:{n:49,s:'cym',g:0.5}, Rd:{n:51,s:'cym',g:0.46} };
function preloadDrums(){ for(var k in PIECE) loadDrum(PIECE[k].n); }

/* ===================== 합성 유틸 ===================== */
function _rnd(a,b){ return a+Math.random()*(b-a); }
function _cents(f,c){ return f*Math.pow(2,c/1200); }
function _jg(v){ return v*(1+_rnd(-0.05,0.05)); }
function _mkGain(v){ var g=AC.createGain(); g.gain.value=(v==null?1:v); return g; }
function _mkOsc(type,f){ var o=AC.createOscillator(); o.type=type; o.frequency.value=f; return o; }
function _mkBiq(type,f,q){ var b=AC.createBiquadFilter(); b.type=type; b.frequency.value=f; if(q!=null) b.Q.value=q; return b; }
function _mkNoise(dur,shape){ var n=Math.max(1,Math.floor(AC.sampleRate*dur)), bf=AC.createBuffer(1,n,AC.sampleRate), d=bf.getChannelData(0), i;
  for(i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,shape==null?1:shape); var s=AC.createBufferSource(); s.buffer=bf; return s; }
function _env(g,t,peak,atk,dur){ peak=Math.max(0.0003,peak);
  g.gain.setValueAtTime(0.0003,t); g.gain.exponentialRampToValueAtTime(peak,t+atk); g.gain.exponentialRampToValueAtTime(0.0003,t+dur); }
var _METAL=[2,3,4.16,5.43,6.79,8.21,9.62,11.07,12.33];
function _metalBank(t,baseF,nUse,dur){ var pre=_mkGain(1/Math.max(1,nUse)), i,o;
  for(i=0;i<nUse;i++){ o=_mkOsc('square',_cents(baseF*_METAL[i],_rnd(-14,14))); o.connect(pre); o.start(t); o.stop(t+dur+0.05); } return pre; }

/* 하이햇 열림 상태(초크용) */
var _openHat=null;
function _chokeOpenHat(t){ if(_openHat){ try{ var gp=_openHat.gain; gp.cancelScheduledValues(t); gp.setValueAtTime(Math.max(0.0003,gp.value||0.0003),t); gp.exponentialRampToValueAtTime(0.0003,t+0.02); }catch(e){} _openHat=null; } }
var _ring={Cr:null,Rd:null};
function _chokeCym(pc,t){ var r=_ring[pc]; if(r){ try{ r.cancelScheduledValues(t); r.setValueAtTime(Math.max(0.0003,r.value||0.0003),t); r.exponentialRampToValueAtTime(0.0003,t+0.04); }catch(e){} _ring[pc]=null; } }

/* ===================== 레이어드 보이스 ===================== */
function _velGain(base,vel){ return base*(0.45+0.55*vel); }
function vKick(t,vel,P){ var g=_velGain(P.g,vel), f0=_cents(116,_rnd(-10,10));
  var o=_mkOsc('sine',f0), og=_mkGain(0.0003); o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(44,t+0.1);
  _env(og,t,_jg(0.82*g),0.006,0.36); o.connect(og); og.connect(out()); sendVerb(og,0.03); o.start(t); o.stop(t+0.42);
  var o2=_mkOsc('triangle',_cents(130,_rnd(-10,10))), g2=_mkGain(0.0003); o2.frequency.exponentialRampToValueAtTime(58,t+0.07);
  _env(g2,t,_jg(0.14*g),0.004,0.12); o2.connect(g2); g2.connect(out()); o2.start(t); o2.stop(t+0.15);
  var cl=_mkNoise(0.022,3), hp=_mkBiq('highpass',1600+1200*vel,0.7), cg=_mkGain(0.0003);
  _env(cg,t,_jg(0.24*g*(0.5+0.5*vel)),0.0015,0.02); cl.connect(hp); hp.connect(cg); cg.connect(out()); cl.start(t); }
function vSnare(t,vel,P){ var g=_velGain(P.g,vel);
  var t1=_mkOsc('triangle',_cents(185,_rnd(-12,12))), g1=_mkGain(0.0003); _env(g1,t,_jg(0.5*g),0.003,0.12); t1.connect(g1); g1.connect(out()); sendVerb(g1,0.08); t1.start(t); t1.stop(t+0.14);
  var t2=_mkOsc('triangle',_cents(262,_rnd(-12,12))), g2=_mkGain(0.0003); _env(g2,t,_jg(0.34*g),0.003,0.10); t2.connect(g2); g2.connect(out()); t2.start(t); t2.stop(t+0.12);
  var nz=_mkNoise(0.2,2.2), hp=_mkBiq('highpass',1300,0.7), bp=_mkBiq('bandpass',3200*(0.8+0.5*vel),0.6), ng=_mkGain(0.0003);
  _env(ng,t,_jg(0.75*g),0.002,0.17); nz.connect(hp); hp.connect(bp); bp.connect(ng); ng.connect(out()); sendVerb(ng,0.12); nz.start(t); }
function vHat(t,vel,P,open){ var g=_velGain(P.g,vel), dur=open?_rnd(0.32,0.46):0.055, nUse=open?8:6;
  nUse=Math.max(4,Math.round(nUse*(0.6+0.4*vel)));
  _chokeOpenHat(t);
  var bank=_metalBank(t,316,nUse,dur), hp=_mkBiq('highpass',7000*(0.85+0.35*vel),0.7), bp=_mkBiq('bandpass',10500,0.9), hg=_mkGain(0.0003);
  bank.connect(hp); hp.connect(bp); bp.connect(hg); hg.connect(out()); sendVerb(hg,open?0.12:0.04);
  var nz=_mkNoise(dur,open?1.4:2.5), nhp=_mkBiq('highpass',8000,0.7), ng=_mkGain(0.0003);
  _env(ng,t,_jg(0.3*g),0.001,dur*0.7); nz.connect(nhp); nhp.connect(ng); ng.connect(hg); nz.start(t);
  _env(hg,t,_jg((open?0.85:1.0)*g),0.0008,dur);
  if(open){ _openHat=hg; (function(h){ setTimeout(function(){ if(_openHat===h) _openHat=null; },(dur*1000)|0); })(hg); } }
function vTom(t,vel,P){ var g=_velGain(P.g,vel), f0=_cents(P.f,_rnd(-10,10)), dur=0.26+ (P.f<180?0.12:0.0);
  var o=_mkOsc('sine',f0), og=_mkGain(0.0003); o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f0*0.56,t+0.18);
  _env(og,t,_jg(1.0*g),0.004,dur); o.connect(og); og.connect(out()); sendVerb(og,0.1); o.start(t); o.stop(t+dur+0.05);
  var o2=_mkOsc('triangle',_cents(f0*2,_rnd(-10,10))), g2=_mkGain(0.0003); o2.frequency.exponentialRampToValueAtTime(f0*1.1,t+0.1);
  _env(g2,t,_jg(0.2*g),0.004,dur*0.6); o2.connect(g2); g2.connect(out()); o2.start(t); o2.stop(t+dur);
  var nz=_mkNoise(0.02,2), bp=_mkBiq('bandpass',500,0.8), ng=_mkGain(0.0003); _env(ng,t,_jg(0.22*g*(0.5+0.5*vel)),0.001,0.02); nz.connect(bp); bp.connect(ng); ng.connect(out()); nz.start(t); }
function vCym(t,vel,P,ride){ var g=_velGain(P.g,vel);
  var dur=ride?_rnd(0.5,0.72):_rnd(1.1,1.55), nUse=ride?7:9; nUse=Math.max(5,Math.round(nUse*(0.65+0.35*vel)));
  var baseF=ride?300:188, hpF=(ride?6000:5000)*(0.8+0.35*vel);
  var bank=_metalBank(t,baseF,nUse,dur), hp=_mkBiq('highpass',hpF,0.6), bp=_mkBiq('bandpass',ride?9000:8000,0.7), cg=_mkGain(0.0003);
  bank.connect(hp); hp.connect(bp); bp.connect(cg); cg.connect(out()); sendVerb(cg,ride?0.12:0.22);
  var nz=_mkNoise(dur,ride?1.6:1.1), nhp=_mkBiq('highpass',ride?6500:5500,0.6), ng=_mkGain(0.0003);
  _env(ng,t,_jg((ride?0.2:0.34)*g),0.002,dur*(ride?0.7:0.95)); nz.connect(nhp); nhp.connect(cg); nz.start(t);
  _env(cg,t,_jg((ride?0.9:0.85)*g),ride?0.003:0.012,dur);
  if(ride){ var bell=_mkOsc('triangle',_cents(baseF*2.02,_rnd(-8,8))), bg=_mkGain(0.0003); _env(bg,t,_jg(0.3*g),0.002,0.28);
    bell.connect(bg); bg.connect(out()); sendVerb(bg,0.1); bell.start(t); bell.stop(t+0.32); }
  _ring[ride?'Rd':'Cr']=cg.gain; (function(k){ setTimeout(function(){ if(_ring[k]===cg.gain) _ring[k]=null; },(dur*1000)|0); })(ride?'Rd':'Cr'); }
function synth(pc,P,t,vel){ var s=P.s;
  if(s==='kick') vKick(t,vel,P);
  else if(s==='snare') vSnare(t,vel,P);
  else if(s==='hat') vHat(t,vel,P,false);
  else if(s==='ohat') vHat(t,vel,P,true);
  else if(s==='tom') vTom(t,vel,P);
  else if(s==='cym') vCym(t,vel,P,pc==='Rd'); }

/* 샘플 있으면 BufferSource(벨로시티+플레이백레이트 지터), 없으면 레이어드 합성 */
function playPiece(pc,vel){ var P=PIECE[pc]; if(!P||!actx()) return;
  if(vel==null) vel=0.8; if(vel<0.05) vel=0.05; if(vel>1) vel=1;
  var t=AC.currentTime+0.001, buf=PERC.buf[P.n];
  if(buf){ try{ var src=AC.createBufferSource(); src.buffer=buf; src.playbackRate.value=1+_rnd(-0.02,0.02);
      var gg=_mkGain(_jg(_velGain(P.g,vel))); src.connect(gg); gg.connect(out()); sendVerb(gg, pc==='K'?0.05:0.14); src.start(t); return; }catch(e){} loadDrum(P.n); }
  else loadDrum(P.n);
  synth(pc,P,t,vel); }
function chokeCymbal(pc){ if(!AC) return; _chokeCym(pc,AC.currentTime); }
window.__chokeCymbal=chokeCymbal;
window.__hitPiece=function(pc,vel){ if(!playing) actx(); playPiece(pc, (vel==null?0.8:vel)); hits++;
  try{ if(typeof lessonHit==='function') lessonHit(pc); }catch(e){}
  try{ if(!window.__LESSON) document.getElementById('scoreT').setAttribute('ktext','value','🥁 '+hits+' 타'); }catch(e){} };

/* ===== 반실사 텍스처 생성(캔버스) — 금속 심벌/우드·스파클 셸/코티드 헤드/크롬 ===== */
var TEX={};
function cvs(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
// 코티드(흰) 드럼 헤드: 미세 스펙클 + 동심원 + 가장자리 음영
function texHead(key,tint){ if(TEX[key])return TEX[key]; var c=cvs(256,256),x=c.getContext('2d');
  var g=x.createRadialGradient(118,112,8,128,128,132); g.addColorStop(0,'#fefefc'); g.addColorStop(.7,tint||'#eef0ee'); g.addColorStop(1,'#cacdc9');
  x.fillStyle=g; x.fillRect(0,0,256,256);
  for(var i=0;i<14000;i++){ var a=Math.random()*0.05; x.fillStyle=(Math.random()<0.5?'rgba(255,255,255,':'rgba(90,90,90,')+a+')'; x.fillRect(Math.random()*256,Math.random()*256,1,1); }
  x.strokeStyle='rgba(130,130,130,0.06)'; for(var r=16;r<126;r+=13){ x.beginPath(); x.arc(128,128,r,0,7); x.stroke(); }

  if(pc==='O') return 0.62; if(pc==='Cr') return 0.95; if(pc==='Rd') return (ssub%4===0?0.6:0.46); return 0.78; }
function piecesAt(groove, ssub){ var out=[], h=groove.hits, k; for(k in h){ if(h[k].indexOf(ssub)>=0){ var pc=LEGACYT[k]||k; out.push({pc:pc, v:velFor(pc,ssub)}); } } return out; }

/* 곡 메타(멜로디 모듈이 있으면 실제 파싱, 없으면 헤더만) */
function songMeta(abc){ if(window.DrumMusic&&window.DrumMusic.parseMelody){ try{ var m=window.DrumMusic.parseMelody(abc); if(m&&m.stepsPerBar) return m; }catch(e){} }
  var mm=(abc||'').match(/^M:\s*(\d+)\s*\/\s*(\d+)/m), tn=mm?+mm[1]:4, td=mm?+mm[2]:4;
  var qm=(abc||'').match(/Q:\s*\d+\/\d+\s*=\s*(\d+)/); var tempo=qm?+qm[1]:100;
  var spb=Math.round(16*tn/td)||16;
  return {tempo:tempo, meterNum:tn, meterDen:td, stepsPerBar:spb, notes:[], totalSteps:spb*8, tempoMap:[{on:0,tempo:tempo}]}; }
function tempoAt(meta,g){ var tm=meta.tempoMap||[{on:0,tempo:meta.tempo}], t=meta.tempo; for(var i=0;i<tm.length;i++){ if(tm[i].on<=g) t=tm[i].tempo; else break; } return t; }

/* 타깃 하이라이트 */
function drumEl(pc){ return document.querySelector('.drum[data-piece="'+pc+'"]'); }
function emissive(h,color,inten){ if(!h||!h.getObject3D) return; var m=h.getObject3D('mesh'); if(!m||!m.material) return; var mt=m.material.length?m.material[0]:m.material; if(!mt.emissive) return; mt.emissive.set(color); mt.emissiveIntensity=inten; }
function glow(pc,on){ var el=drumEl(pc); if(!el) return; emissive(el.__hit||el, on?'#39d98a':'#000', on?0.85:0); }
function glowPulse(pc,dur){ glow(pc,true); setTimeout(function(){ glow(pc,false); }, Math.min((dur||0.2),0.22)*1000); }
function glowOff(){ ['K','S','H','O','Th','Tm','Tf','Cr','Rd'].forEach(function(p){ glow(p,false); }); }
function pulseEl(pc){ var el=drumEl(pc); if(el) flashDrum(el); }

/* ===== 레슨 상태/스케줄러 ===== */
var LESSON=null, lessonTimer=null;
var SEL={ song:-1, tech:-1, mul:1.0 };   // song -1=자유연주, tech -1=추천(자동)
function startLesson(mode){ actx(); preloadDrums(); if(!document.querySelector('.drum')) buildKit();
  playing=true; window.__LESSON=true; hideMenu();
  var abc = (SEL.song<0||!SONGS[SEL.song])? '' : SONGS[SEL.song].abc;
  var meta = songMeta(abc), hasMel=meta.notes&&meta.notes.length;
  var gi = (SEL.tech<0)? recommendKit(abc) : (SEL.tech%DKITS.length), groove=DKITS[gi];
  var total = hasMel? meta.totalSteps : groove.len*8;
  LESSON={ mode:mode, meta:meta, groove:groove, spb:(meta.stepsPerBar||groove.len), step:0, total:total, good:0, nTarget:0, mul:SEL.mul, targets:[], awaiting:null, melOn:{} };
  (meta.notes||[]).forEach(function(n){ (LESSON.melOn[n.on]=LESSON.melOn[n.on]||[]).push(n); });
  try{ if(window.DrumMusic&&window.DrumMusic.preload&&hasMel){ var ms={}; meta.notes.forEach(function(n){ ms[n.midi]=1; }); window.DrumMusic.preload(AC, Object.keys(ms).map(Number)); } }catch(e){}
  showLessonHud(); clearTimeout(lessonTimer); lessonStep();
}
function lessonStep(){ if(!LESSON) return; var L=LESSON;
  if(L.step>=L.total){ if(L.mode==='demo'){ L.step=0; } else return lessonEnd(); }
  var g=L.step, ssub=g%L.groove.len, tempo=tempoAt(L.meta,g), dur=(60/tempo/4)/L.mul, t=(AC?AC.currentTime:0)+0.03;
  var mn=L.melOn[g]; if(mn&&window.DrumMusic&&window.DrumMusic.playNote){ mn.forEach(function(n){ try{ window.DrumMusic.playNote(AC,out(),sendVerb,n.freq,t,Math.max(0.12,(n.dur||2)*dur*0.95),0.6); }catch(e){} }); }
  var pcs=piecesAt(L.groove,ssub);
  if(L.mode==='demo'){ pcs.forEach(function(p){ playPiece(p.pc,p.v); pulseEl(p.pc); }); L.step++; updateLessonHud(); lessonTimer=setTimeout(lessonStep,dur*1000); }
  else if(L.mode==='realtime'){ pcs.forEach(function(p){ if(p.pc==='H'){ playPiece('H',p.v); pulseEl('H'); } else { L.targets.push({pc:p.pc,when:t,hit:false}); L.nTarget++; glowPulse(p.pc,dur); } });
    if(L.targets.length>64) L.targets=L.targets.slice(-48); L.step++; updateLessonHud(); lessonTimer=setTimeout(lessonStep,dur*1000); }
  else { // wait: 내 속도로 — 사용자가 칠 피스는 글로우 후 대기
    var userP=[]; pcs.forEach(function(p){ if(p.pc==='H'){ playPiece('H',p.v); } else userP.push(p.pc); });
    if(userP.length===0){ L.step++; lessonTimer=setTimeout(lessonStep,Math.min(dur,0.1)*1000); }
    else { L.awaiting=userP.slice(); userP.forEach(function(pc){ glow(pc,true); }); updateLessonHud(); }
  }
}
function lessonHit(pc){ if(!LESSON) return; var L=LESSON, now=AC?AC.currentTime:0;
  if(L.mode==='realtime'){ var w=0.22/L.mul, best=-1, bd=1e9; for(var i=0;i<L.targets.length;i++){ var tg=L.targets[i]; if(tg.hit||tg.pc!==pc) continue; var d=Math.abs(now-tg.when); if(d<w&&d<bd){ bd=d; best=i; } }
    if(best>=0){ L.targets[best].hit=true; L.good++; } updateLessonHud(); }
  else if(L.mode==='wait'){ if(!L.awaiting) return; var k=L.awaiting.indexOf(pc); if(k>=0){ L.awaiting.splice(k,1); glow(pc,false);
    if(L.awaiting.length===0){ L.good++; L.awaiting=null; L.step++; updateLessonHud(); lessonTimer=setTimeout(lessonStep,60); } } }
}
function lessonEnd(){ clearTimeout(lessonTimer); glowOff(); var L=LESSON; var msg;
  if(L.mode==='realtime'){ var acc=L.nTarget?Math.round(100*L.good/L.nTarget):0; msg='완료! 🥁 정확도 '+acc+'% ('+L.good+'/'+L.nTarget+')'; }
  else msg='잘했어요! 🥁 '+L.good+'마디 완주'; LESSON=null; setLessonText(msg); showStop(true); }
function stopLesson(){ clearTimeout(lessonTimer); LESSON=null; window.__LESSON=false; glowOff(); playing=false; hideLessonHud(); showMenu(); }

/* ===== 레슨 HUD ===== */
function showLessonHud(){ var h=document.getElementById('lessonHud'); if(h) h.setAttribute('visible',true); showStop(true); }
function hideLessonHud(){ var h=document.getElementById('lessonHud'); if(h) h.setAttribute('visible',false); }
function setLessonText(s){ var t=document.getElementById('lessonT'); if(t) t.setAttribute('ktext','value',s); }
function showStop(on){ ['stopBtn','stopLbl'].forEach(function(id){ var e=document.getElementById(id); if(e) e.setAttribute('visible',on); }); }
function updateLessonHud(){ if(!LESSON) return; var L=LESSON, MN={demo:'👂 들어보기',wait:'⏸ 기다려주기',realtime:'▶ 안기다려주기'};
  var spb=L.spb||16, bar=Math.floor(L.step/spb)+1, bars=Math.max(1,Math.round(L.total/spb));
  var prog=L.mode==='realtime'?(' · 정확 '+L.good+'/'+L.nTarget):(L.mode==='wait'?(' · '+L.good+'마디'):'');
  setLessonText(MN[L.mode]+' · '+L.groove.name+' · '+bar+'/'+bars+'마디'+prog); }

/* ===== 자유 연주 ===== */
function startGame(){ actx(); preloadDrums(); if(!document.querySelector('.drum')) buildKit(); playing=true; window.__LESSON=false; hits=0; hideMenu();
  showLessonHud(); setLessonText('자유 연주 🥁 (쳐보세요!)'); }

/* ===== 메뉴 ===== */
function mkText(x,y,label,size,color){ var r=document.getElementById('menuRoot'); if(!r) return; var t=document.createElement('a-entity');
  t.setAttribute('ktext','value: '+label+'; color:'+(color||'#dfe4ff')+'; size:'+(size||0.1)); t.setAttribute('position',x+' '+y+' 0'); r.appendChild(t); return t; }
function mkBtn(id,x,y,w,h,label,size,color){ var r=document.getElementById('menuRoot'); if(!r) return; var p=document.createElement('a-plane');
  p.id=id; p.classList.add('clickable'); p.setAttribute('width',w); p.setAttribute('height',h); p.setAttribute('position',x+' '+y+' 0');
  p.setAttribute('material','shader:flat; color:'+(color||'#2b2f49')); var t=document.createElement('a-entity');
  t.setAttribute('ktext','value: '+label+'; color:#fff; size:'+(size||0.1)); t.setAttribute('position','0 0 0.02'); p.appendChild(t); r.appendChild(p); return p; }
function refreshMenu(){ var r=document.getElementById('menuRoot'); if(!r) return; r.innerHTML='';
  mkText(0,1.18,'🥁 드럼 레슨 — 리듬세이버 곡으로',0.12,'#cfe');
  mkText(-0.95,0.92,'곡 선택',0.09,'#9fb0e8');
  var items=[{i:-1,t:'🥁 자유 연주'}]; SONGS.forEach(function(s,i){ items.push({i:i,t:s.title}); });
  var yy=0.72; items.forEach(function(it){ var sel=SEL.song===it.i; mkBtn('song:'+it.i,-0.95,yy,1.8,0.2,(sel?'● ':'')+(it.i<0?it.t:'🎵 '+it.t),0.082,sel?'#4a5cff':'#262a44'); yy-=0.24; });
  if(SEL.song<0){ mkBtn('mode:free',0.95,0.6,1.7,0.42,'▶ 연주 시작',0.15,'#2e7d57'); mkText(0.95,0.18,'스틱으로 드럼 치기',0.08,'#9fb0e8'); mkText(0.95,0.04,'트리거=킥 · 폰은 드럼 탭',0.072,'#9fb0e8'); }
  else { var abc=SONGS[SEL.song].abc, recName=DKITS[recommendKit(abc)].name;
    mkText(0.95,0.92,'기법  (추천: '+recName+')',0.082,'#9fb0e8');
    var techLabel=SEL.tech<0?('추천 ✨ '+recName):DKITS[SEL.tech%DKITS.length].name;
    mkBtn('tech',0.95,0.70,1.7,0.2,'🥁 '+techLabel+'   ⟳',0.082,'#3a2f6e');
    mkText(0.6,0.47,'속도',0.082,'#9fb0e8');
    mkBtn('mul:0.5',0.42,0.29,0.46,0.18,(SEL.mul===0.5?'●':'')+'0.5×',0.075,SEL.mul===0.5?'#4a5cff':'#262a44');
    mkBtn('mul:0.75',0.92,0.29,0.52,0.18,(SEL.mul===0.75?'●':'')+'0.75×',0.07,SEL.mul===0.75?'#4a5cff':'#262a44');
    mkBtn('mul:1',1.42,0.29,0.46,0.18,(SEL.mul===1?'●':'')+'1.0×',0.075,SEL.mul===1?'#4a5cff':'#262a44');
    mkText(0.6,0.08,'모드',0.082,'#9fb0e8');
    mkBtn('mode:demo',0.95,-0.12,1.7,0.2,'👂 들어보기',0.09,'#2b2f49');
    mkBtn('mode:wait',0.95,-0.36,1.7,0.2,'⏸ 기다려주기 (내 속도)',0.088,'#2b2f49');
    mkBtn('mode:realtime',0.95,-0.60,1.7,0.2,'▶ 안기다려주기 (실전)',0.088,'#2b2f49');
  }
}
function showMenu(){ var r=document.getElementById('menuRoot'); if(r) r.setAttribute('visible',true); refreshMenu(); }
function hideMenu(){ var r=document.getElementById('menuRoot'); if(r) r.setAttribute('visible',false); }

scene.addEventListener('click', function(evt){ var el=evt.target; if(!el||!el.id&&!el.closest) return; var id=el.id||'';
  if(id.indexOf('song:')===0){ SEL.song=+id.split(':')[1]; SEL.tech=-1; refreshMenu(); return; }
  if(id==='tech'){ SEL.tech=SEL.tech<0?0:SEL.tech+1; if(SEL.tech>=DKITS.length) SEL.tech=-1; refreshMenu(); return; }
  if(id.indexOf('mul:')===0){ SEL.mul=parseFloat(id.split(':')[1]); refreshMenu(); return; }
  if(id==='mode:free'){ startGame(); return; }
  if(id.indexOf('mode:')===0){ startLesson(id.split(':')[1]); return; }
  if(id==='stopBtn'||id==='stopLbl'){ stopLesson(); return; }
  var d=el.closest?el.closest('.drum'):null; if(playing && d){ window.__hitDrum(d); } });
/* 모바일: 드럼을 탭하면 타격(.clickable로 click 발생 → 위 핸들러) */
window.__vrTapAt=function(){ if(!playing) actx(); };
/* 메뉴 최초 표시 */
if(scene){ if(scene.hasLoaded) showMenu(); else scene.addEventListener('loaded', showMenu); }

window.__DRUMS_TEST__={ start:startGame, get playing(){return playing}, get hits(){return hits}, get nDrums(){return document.querySelectorAll('.drum').length},
  hit:function(pc){ window.__hitPiece(pc); }, pieces:Object.keys(PIECE), nSongs:SONGS.length, nKits:DKITS.length,
  kitIds:DKITS.map(function(k){return k.id;}), recommend:function(i){ return SONGS[i]?DKITS[recommendKit(SONGS[i].abc)].id:null; },
  piecesAt:function(id,ssub){ return piecesAt(DKITS[kitIdx(id)],ssub).map(function(x){return x.pc;}); },
  select:function(s,t,m){ SEL.song=(s==null?-1:s); SEL.tech=(t==null?-1:t); SEL.mul=(m||1); },
  startLesson:startLesson, stopLesson:stopLesson, get lessonMode(){ return LESSON?LESSON.mode:null; },
  get lessonStep(){ return LESSON?LESSON.step:-1; }, get lessonGood(){ return LESSON?LESSON.good:0; },
  get nTarget(){ return LESSON?LESSON.nTarget:0; }, get awaiting(){ return LESSON&&LESSON.awaiting?LESSON.awaiting.slice():null; },
  songMeta:function(i){ var m=songMeta(SONGS[i]?SONGS[i].abc:''); return {tempo:m.tempo,spb:m.stepsPerBar,notes:(m.notes||[]).length,total:m.totalSteps}; } };
</script>
