<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>리듬 세이버</title>

<script src="vr-common.js"></script>

<script>
if(window.AFRAME){
  AFRAME.registerComponent('flyblock',{
    schema:{speed:{default:6}},
    tick:function(t,dt){ if(!window.__saberPlaying) return; var p=this.el.object3D.position; p.z += this.data.speed*((dt||16)/1000);
      if(p.z>0.8 && !this.el.dataset.dead){ if(window.__saberMiss) window.__saberMiss(this.el); } }
  });
  AFRAME.registerComponent('debris',{
    schema:{vx:{default:0},vy:{default:0},vz:{default:0}},
    init:function(){ this.v=new THREE.Vector3(this.data.vx,this.data.vy,this.data.vz); this.rx=(Math.random()-0.5)*0.5; this.ry=(Math.random()-0.5)*0.5; },
    tick:function(t,dt){ var k=(dt||16)/1000; this.v.y-=7*k; var p=this.el.object3D.position; p.x+=this.v.x*k; p.y+=this.v.y*k; p.z+=this.v.z*k;
      this.el.object3D.rotation.x+=this.rx; this.el.object3D.rotation.y+=this.ry; }
  });
  AFRAME.registerComponent('saber',{
    schema:{color:{default:'red'}},
    init:function(){ var c=this.data.color==='red'?'#ff3b64':'#3ba0ff';
      var grip=document.createElement('a-cylinder'); grip.setAttribute('radius','0.02'); grip.setAttribute('height','0.14'); grip.setAttribute('material','shader:flat; color:#222'); grip.setAttribute('position','0 0 -0.07'); grip.setAttribute('rotation','90 0 0'); this.el.appendChild(grip);
      var blade=document.createElement('a-cylinder'); blade.setAttribute('radius','0.024'); blade.setAttribute('height','0.98'); blade.setAttribute('material','shader:flat; color:'+c); blade.setAttribute('position','0 0 -0.63'); blade.setAttribute('rotation','90 0 0'); this.el.appendChild(blade);
      this.prev=new THREE.Vector3(); this.cur=new THREE.Vector3(); this._q=new THREE.Quaternion(); this._dir=new THREE.Vector3(); this._bw=new THREE.Vector3(); this._pt=new THREE.Vector3(); this.started=false; },
    tick:function(t,dt){ this.el.object3D.getWorldPosition(this.cur);
      var sp=this.started?this.prev.distanceTo(this.cur)/((dt||16)/1000):0; this.prev.copy(this.cur); this.started=true;
      if(!window.__saberPlaying || sp<1.6) return;
      this.el.object3D.getWorldQuaternion(this._q); this._dir.set(0,0,-1).applyQuaternion(this._q);
      var blocks=document.querySelectorAll('.block');
      for(var i=0;i<blocks.length;i++){ if(blocks[i].dataset.dead) continue; blocks[i].object3D.getWorldPosition(this._bw);
        for(var seg=0.1; seg<=1.0; seg+=0.22){ this._pt.copy(this.cur).addScaledVector(this._dir, seg*0.98);
          if(this._pt.distanceTo(this._bw)<0.34){ if(window.__saberHit) window.__saberHit(blocks[i], this.data.color); break; } } }
    }
  });
}
</script>
<style>
  html,body{margin:0;height:100%;background:#05060d;font-family:-apple-system,"Malgun Gothic","Segoe UI","Noto Sans KR",sans-serif}

  <a-entity id="gameover" visible="false" position="0 2.35 -3.0">

    <a-entity id="goTitle" ktext="value: 클리어! 🗡️; color:#dff; size:0.19" position="0 0.82 0.02"></a-entity>
    <a-entity id="goGrade" ktext="value: ; color:#ffd23f; size:0.52" position="0 0.4 0.02"></a-entity>

<div id="hint">🥽 VR 입장 → 음악 비트에 맞춰 색 맞는 검으로 베기! (PC·폰은 시작만 마우스)</div>

<script>
'use strict';
window.__saberPlaying=false;
var scene=document.querySelector('a-scene'), field=document.getElementById('field');
var score=0, combo=0, maxCombo=0, timeLeft=60, best=0, timer=null;
var hits=0, misses=0;                 // 채점: 정확히 벤 수 / 놓친 수 → 정확도·등급(A~F)
/* 기기 판별: WebXR 헤드셋이면 VR 모드, 아니면 모바일/PC 터치 모드 */
var IS_MOBILE=false; try{ IS_MOBILE = ('ontouchstart' in window) || (navigator.maxTouchPoints>0); }catch(e){}
function gradeOf(pct){ return pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F'; }
function gradeEmoji(g){ return g==='A'?'🏆':g==='B'?'🥈':g==='C'?'🥉':g==='D'?'👍':'💪'; }
function accPct(){ var n=hits+misses; return n>0?Math.round(hits/n*100):0; }
function resetScore(){ score=0; combo=0; maxCombo=0; hits=0; misses=0; spawnN=0; }
var MODE='level', songTempo=100, songTitle='', songEndTimer=null, songStart=0, songDurMs=0, songTempoMap=[{on:0,tempo:100}];
function tempoAtPos(pos){ var t=songTempoMap[0].tempo; for(var i=0;i<songTempoMap.length;i++){ if(songTempoMap[i].on<=pos) t=songTempoMap[i].tempo; else break; } return t; }
try{ best=parseInt(localStorage.getItem('saber_best')||'0',10)||0; }catch(e){}

/* ===== 멜로디 기반 음악 엔진 (Web Audio) =====
   블록이 "실제 멜로디 음표"에 맞춰 날아옵니다. 자르면 그 음이 울려요.
   악보는 브로가드 뮤직랩 combine.html 과 같은 계이름 표기:
     계이름 도 레 미 파 솔 라 시 · 낮은음 ,도 · 높은음 도' · 쉼표 0 · 마디구분 r
     리듬 숫자: 1=8분 2=4분 4=2분 8=온음표 (멜로디 토큰과 1:1, r은 마디구분)
   => 아래 MEL 의 mel/rhy 문자열만 뮤직랩 노래로 바꾸면 그 곡으로 플레이됩니다. */
var AC=null, nextT=0, schT=null, stepClock=0;
var level=1, MAXLV=10, levelTime=0, LEVEL_SECS=20, songNotes=[], songLen=16, spawnN=0, bassNotes=[], bassLen=16;
/* ════════ 사운드 사양서(뮤직랩 원장) 반영: 리버브/컴프레서 수치 + 공간감 ════════
   보통 프리셋: IR tail 1.6s, decay 2.8, wet 0.22, dry 0.95 / 컴프 -16dB knee12 ratio2.5 atk10ms rel250ms */
var MASTER=null, REVERB=null, PIANOWAVE=null;
var VERB={tail:1.6, decay:2.8, wet:0.22};   // 공간감 프리셋(살짝/보통/깊게 중 보통)
function buildMaster(){ try{ var c=AC.createDynamicsCompressor();
  c.threshold.value=-16; c.knee.value=12; c.ratio.value=2.5; c.attack.value=0.01; c.release.value=0.25;
  var g=AC.createGain(); g.gain.value=0.9; c.connect(g); g.connect(AC.destination); MASTER=c;
  buildReverb(); PIANOWAVE=null; }catch(e){ MASTER=null; } }
/* 공간감: 길이 tail초의 감쇠 백색소음 IR, 곡선 (1 - t/tail)^decay (사양서 그대로) */
function buildReverb(){ try{ var len=Math.max(1,Math.floor(AC.sampleRate*VERB.tail)), ch=(AC.destination&&AC.destination.channelCount>1?2:1);
  var ir=AC.createBuffer(ch, len, AC.sampleRate);
  for(var c=0;c<ch;c++){ var d=ir.getChannelData(c); for(var i=0;i<len;i++){ var t=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-t,VERB.decay); } }
  var conv=AC.createConvolver(); conv.buffer=ir; var pre=AC.createGain(); pre.gain.value=1; var wet=AC.createGain(); wet.gain.value=1;
  pre.connect(conv); conv.connect(wet); wet.connect(MASTER||AC.destination); REVERB=pre; }catch(e){ REVERB=null; } }
function out(){ return MASTER||AC.destination; }
function sendVerb(node, amt){ try{ if(REVERB){ var s=AC.createGain(); s.gain.value=(amt==null?VERB.wet:amt); node.connect(s); s.connect(REVERB); } }catch(e){} }
/* ════════ 사운드폰트 샘플 음원(사양서 1번 요소) — FluidR3_GM(MIT) 피아노 ════════
   퀘스트/Vercel에선 실제 녹음 샘플을 로드해 재생, 로드 전/오프라인이면 오실레이터 폴백 */
var SF={ base:'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/', instr:'acoustic_grand_piano', buf:{}, loading:{} };
var SFNAMES=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function midiToName(m){ return SFNAMES[((m%12)+12)%12]+(Math.floor(m/12)-1); }
function freqToMidi(f){ return Math.round(69+12*Math.log2(f/440)); }
function loadSample(m){ if(SF.buf[m]||SF.loading[m]||!AC||typeof fetch!=='function'||OFFLINE) return; SF.loading[m]=true;
  var url=SF.base+SF.instr+'-mp3/'+midiToName(m)+'.mp3';
  fetch(url).then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(function(ab){ return AC.decodeAudioData(ab); })
    .then(function(b){ SF.buf[m]=b; }).catch(function(){ SF.loading[m]=false; }); }
function preloadSamples(freqs){ var done={}; for(var i=0;i<freqs.length;i++){ var f=freqs[i]; if(f>0){ var m=freqToMidi(f); if(!done[m]){ done[m]=1; loadSample(m); } } } }
function samplePlay(freq,time,dur,peak,verb){ if(!freq) return true; var m=freqToMidi(freq), buf=SF.buf[m];
  if(!buf){ loadSample(m); return false; }                 // 아직 없으면 폴백 신호
  try{ var src=AC.createBufferSource(); src.buffer=buf; var g=AC.createGain(); src.connect(g); g.connect(out()); sendVerb(g, verb);
    var d=Math.max(0.2, dur), p=peak||0.5;
    g.gain.setValueAtTime(p, time); g.gain.setValueAtTime(p, time+Math.max(0.04,d-0.12)); g.gain.exponentialRampToValueAtTime(0.0001, time+d+0.14);
    src.start(time); src.stop(time+d+0.18); }catch(e){ return false; } return true; }
/* ════════ 실제 드럼 샘플 — FluidR3_GM 'percussion'(GM 드럼 키트) ════════
   GM 드럼 노트: 36킥 38스네어 42닫은햇 46열린햇 47탐. 로드 전/오프라인이면 합성 드럼 폴백 */
var PERC={ instr:'percussion', buf:{}, loading:{} };
var DRUMNOTE={ K:36, S:38, H:42, O:46, T:47 };
var DRUMGAIN={ K:0.85, S:0.7, H:0.35, O:0.5, T:0.6 };
function loadDrumSample(m){ if(PERC.buf[m]||PERC.loading[m]||!AC||typeof fetch!=='function'||OFFLINE) return; PERC.loading[m]=true;
  var url=SF.base+PERC.instr+'-mp3/'+midiToName(m)+'.mp3';
  fetch(url).then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(function(ab){ return AC.decodeAudioData(ab); })
    .then(function(b){ PERC.buf[m]=b; }).catch(function(){ PERC.loading[m]=false; }); }
function preloadDrums(){ for(var k in DRUMNOTE) loadDrumSample(DRUMNOTE[k]); }
function drumSample(pc, time){ var m=DRUMNOTE[pc]; if(m==null) return false; var buf=PERC.buf[m];
  if(!buf){ loadDrumSample(m); return false; }
  try{ var src=AC.createBufferSource(); src.buffer=buf; var g=AC.createGain(); g.gain.value=DRUMGAIN[pc]||0.6; src.connect(g); g.connect(out()); sendVerb(g, pc==='K'?0.05:0.14);
    src.start(time); }catch(e){ return false; } return true; }
function osc(freq,time,dur,type,vol){ var o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=freq; o.connect(g); g.connect(out());
  g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(vol,time+0.012); g.gain.exponentialRampToValueAtTime(0.0001,time+dur); o.start(time); o.stop(time+dur+0.02); }
/* 피아노 파형: 피아노다운 배음 구성(주기파형 1개로 가볍게) */
function pianoWave(){ if(PIANOWAVE) return PIANOWAVE; var n=14, real=new Float32Array(n), imag=new Float32Array(n);
  var amp=[0,1,0.55,0.40,0.26,0.17,0.12,0.085,0.06,0.045,0.033,0.024,0.017,0.012];
  for(var i=1;i<n;i++) imag[i]=amp[i]; try{ PIANOWAVE=AC.createPeriodicWave(real, imag, {disableNormalization:false}); }catch(e){ PIANOWAVE=null; } return PIANOWAVE; }
/* 멜로디 = 피아노: 실제 샘플 우선, 없으면 오실레이터 폴백 */
function noteVoice(freq,time,dur){ if(samplePlay(freq, time, Math.max(0.2,dur*0.98), 0.5, VERB.wet)) return; oscPiano(freq,time,dur); }
function oscPiano(freq,time,dur){
  var d=Math.max(0.18, dur*0.95);
  var o=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter();
  var w=pianoWave(); if(w) o.setPeriodicWave(w); else o.type='triangle'; o.frequency.value=freq;
  f.type='lowpass'; f.frequency.value=Math.min(8500, freq*7+1400); f.Q.value=0.2;
  o.connect(f); f.connect(g); g.connect(out()); sendVerb(g, 0.22);
  var pk=0.15, tail=Math.min(d, 1.1);
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(pk, time+0.006);                 // 해머 어택
  g.gain.exponentialRampToValueAtTime(pk*0.32, time+tail);             // 자연 감쇠
  g.gain.exponentialRampToValueAtTime(0.0001, time+d+0.18);            // 꼬리
  o.start(time); o.stop(time+d+0.22);
  // 해머 틱(타건감)

  if(PLAYTARGET==='drum'){ var pcs=piecesAt(step); for(var i=0;i<pcs.length;i++){ if(pcs[i]!=='H' && pcs[i]!=='K') spawnDrumCube(pcs[i], speed); } return; }  // 킥은 자동(발 북)
  var sp=step%songLen;
  for(var j=0;j<songNotes.length;j++){ if(songNotes[j].on===sp && songNotes[j].f>0){ spawnBlock(songNotes[j].f, speed); break; } }
}
var DRUMVIS={ K:{c:'#ff3b64',y:1.0,x:0,sz:0.42}, S:{c:'#ffd23f',y:1.46,x:0,sz:0.36}, O:{c:'#45e0ff',y:1.98,x:0.95,sz:0.3}, T:{c:'#b98cff',y:1.5,x:-0.95,sz:0.34} };
function spawnDrumCube(pc, speed){ if(!window.__saberPlaying) return; var m=DRUMVIS[pc]||DRUMVIS.K;
  var e=document.createElement('a-box'); e.setAttribute('class','block'); e.dataset.drum=pc; e.dataset.color='drum';
  e.setAttribute('depth',m.sz); e.setAttribute('width',m.sz); e.setAttribute('height',m.sz);
  e.setAttribute('material','shader:flat; color:'+m.c);
  e.innerHTML='<a-box width="'+(m.sz*0.34).toFixed(2)+'" height="'+(m.sz*0.34).toFixed(2)+'" depth="0.02" position="0 0 '+(m.sz/2+0.01).toFixed(2)+'" material="shader:flat; color:#06121f; opacity:0.85"></a-box>';
  e.setAttribute('position', (m.x+(Math.random()*0.4-0.2)).toFixed(2)+' '+m.y+' -14');
  e.setAttribute('flyblock','speed: '+speed.toFixed(1)); field.appendChild(e);
}
function scheduler(){ if(!AC) return;
  while(nextT < AC.currentTime + 0.12){ stepAudio(nextT); nextT += (60/curTempo())/4; stepClock++; }   // 소리
  if(!OFFLINE){ var guard=0;                                                                              // 큐브(리드타임 앞서)
    while((MODE!=='song' || spawnStep<songLen) && (spawnAudioT - leadFor(spawnStep) <= AC.currentTime+0.04) && guard++<128){
      spawnForStep(spawnStep, spawnAudioT); spawnAudioT += (60/tempoAtPos(spawnStep%songLen))/4; spawnStep++; } }
  schT=setTimeout(scheduler,25); }
function startMusic(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
  if(!MASTER) buildMaster(); preloadForCurrent(); stepClock=0; var lead0=leadFor(0); nextT=AC.currentTime+0.1+lead0;   // 음악은 리드타임 뒤 시작 → 첫 큐브 도착과 동시에
  spawnStep=0; spawnAudioT=nextT; clearTimeout(schT); scheduler(); }catch(e){} }
function preloadForCurrent(){ try{ var fs=[]; var i;
  for(i=0;i<songNotes.length;i++) fs.push(songNotes[i].f);
  for(i=0;i<bassNotes.length;i++) fs.push(bassNotes[i].f);
  preloadSamples(fs); preloadDrums(); }catch(e){} }
function stopMusic(){ clearTimeout(schT); schT=null; }
function sfx(f1,f2,d,type,vol){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f1,AC.currentTime); if(f2) o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d); o.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(vol||0.14,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d); o.start(); o.stop(AC.currentTime+d); }catch(e){} }

function haptic(col){ try{ var hand=(col==='red')?document.getElementById('rhand'):document.getElementById('lhand');
  var tc=hand && hand.components && hand.components['tracked-controls']; var gp=tc && tc.controller;
  if(gp && gp.hapticActuators && gp.hapticActuators[0]) gp.hapticActuators[0].pulse(0.7,55); }catch(e){} }

/* ════════ 실감 효과음 (합성) — 베기 '휙+쉬잉' / 깨짐 '크리스탈 파편' / 미스 '툭' ════════
   사운드 전담 에이전트 검증본(OfflineAudioContext로 클리핑 없음·광대역·완전감쇠 확인).
   오디오 그래프: out()=마스터 컴프레서 버스, sendVerb()=리버브 send. 연타(베기→깨짐) 최악 피크 ~0.83 (<0.99). */
function noiseBuf(dur, curve){ var n=Math.max(1,Math.floor(AC.sampleRate*dur)), bf=AC.createBuffer(1,n,AC.sampleRate), d=bf.getChannelData(0);
  for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/n, curve==null?1:curve); } return bf; }
/* 공용 노이즈버퍼 캐시(AC별) — 매 호출 재생성 방지 */
function _sbNoiseBuf(dur){ try{ if(!AC._sbNoise) AC._sbNoise={}; var key=Math.max(1,Math.round(dur*1000));
  if(AC._sbNoise[key]) return AC._sbNoise[key];
  var len=Math.max(1,Math.floor(AC.sampleRate*(key/1000))), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1; AC._sbNoise[key]=b; return b; }catch(e){ return null; } }
/* 베기 = 칼이 공기를 가르는 '휙' (바람 스와이프). 밴드패스 2200→500Hz 하강, 짧고 바람기 있는 노이즈. 금속 링 없음. */
function sliceSound(time, opt){ try{ if(!AC) return; opt=opt||{};
  var t=(typeof time==='number'&&isFinite(time))?time:AC.currentTime;
  var speed=(opt&&typeof opt.speed==='number'&&isFinite(opt.speed))?opt.speed:1; speed=Math.max(0.6,Math.min(1.8,speed));
  var color=(opt&&opt.color)||'red'; var bright=0.9+(speed-1)*0.35; var pan=(color==='blue')?-0.22:0.22;
  var pre=AC.createGain(); pre.gain.value=1; var panner=null;
  try{ if(AC.createStereoPanner){ panner=AC.createStereoPanner(); panner.pan.value=pan; } }catch(e){ panner=null; }
  if(panner){ pre.connect(panner); panner.connect(out()); } else { pre.connect(out()); }
  try{ sendVerb(pre,0.10); }catch(e){}
  var swDur=0.13+Math.random()*0.03;                 // ~110~160ms
  var nb=_sbNoiseBuf(0.25);
  if(nb){ var src=AC.createBufferSource(); src.buffer=nb; src.loop=true; src.playbackRate.value=0.9+Math.random()*0.18;
    var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.8;      // 넓은 밴드 → 바람 질감
    var f0=2200*bright*(0.95+Math.random()*0.1), f1=500*bright;
    bp.frequency.setValueAtTime(Math.min(6000,f0),t);
    bp.frequency.exponentialRampToValueAtTime(Math.max(140,f1),t+swDur*0.9);   // 아래로 쓸림
    var hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=280; // 숨결 아래 깎기
    var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5200; // 쇳소리 억제
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.52,t+0.012);                          // 빠른 스웰
    g.gain.exponentialRampToValueAtTime(0.22,t+swDur*0.55);
    g.gain.exponentialRampToValueAtTime(0.0001,t+swDur);
    src.connect(bp); bp.connect(hp); hp.connect(lp); lp.connect(g); g.connect(pre);
    src.start(t); src.stop(t+swDur+0.03); }
  // 바람기(에어리) 보강: 더 높은 밴드의 아주 옅은 숨결층
  var ab=_sbNoiseBuf(0.18);
  if(ab){ var a=AC.createBufferSource(); a.buffer=ab; a.loop=true; a.playbackRate.value=1.0+Math.random()*0.2;
    var abp=AC.createBiquadFilter(); abp.type='bandpass'; abp.Q.value=0.6; abp.frequency.setValueAtTime(3400*bright,t); abp.frequency.exponentialRampToValueAtTime(1400,t+swDur*0.8);
    var ag=AC.createGain(); ag.gain.setValueAtTime(0.0001,t); ag.gain.exponentialRampToValueAtTime(0.10,t+0.02); ag.gain.exponentialRampToValueAtTime(0.0001,t+swDur*0.85);
    a.connect(abp); abp.connect(ag); ag.connect(pre); a.start(t); a.stop(t+swDur+0.02); }
}catch(e){} }
/* 깨짐 = 무를 써는 순간 + 도마 '툭'. (1)접촉 트랜지언트 (2)섬유질 크런치(그래뉼러) (3)도마 바디. 유리/벨 느낌 없음. */
function shatterSound(time, opt){ try{ if(!AC) return; opt=opt||{};
  var t=(typeof time==='number'&&isFinite(time))?time:AC.currentTime;
  var drum=(opt&&opt.kind==='drum');
  var pre=AC.createGain(); pre.gain.value=1; pre.connect(out()); try{ sendVerb(pre,0.09); }catch(e){}
  // 1) 접촉 트랜지언트: 껍질/섬유가 '쉭' 갈라지는 아주 짧고 밝은 하이패스 노이즈
  var cb=_sbNoiseBuf(0.03);
  if(cb){ var cs=AC.createBufferSource(); cs.buffer=cb; cs.playbackRate.value=0.95+Math.random()*0.2;
    var chp=AC.createBiquadFilter(); chp.type='highpass'; chp.frequency.value=drum?3200:4200;
    var clp=AC.createBiquadFilter(); clp.type='lowpass'; clp.frequency.value=11000;
    var cg=AC.createGain(); var cdur=(drum?0.016:0.011)+Math.random()*0.006;
    cg.gain.setValueAtTime(0.0001,t); cg.gain.exponentialRampToValueAtTime(drum?0.13:0.15,t+0.0015);
    cg.gain.exponentialRampToValueAtTime(0.0001,t+cdur);
    cs.connect(chp); chp.connect(clp); clp.connect(cg); cg.connect(pre); cs.start(t); cs.stop(t+cdur+0.02); }
  // 2) 섬유질 크런치 바디: 밴드패스(800~2500)+로우패스 롤오프, 그래뉼러 진폭(섬유 찢김). 매번 랜덤.
  var fb=_sbNoiseBuf(0.14);
  if(fb){ var fs=AC.createBufferSource(); fs.buffer=fb; fs.loop=true; fs.playbackRate.value=0.85+Math.random()*0.35;
    var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.9;
    var bc=(drum?900:1200)+Math.random()*900;                 // 섬유 대역 중심
    bp.frequency.setValueAtTime(bc*1.25,t); bp.frequency.exponentialRampToValueAtTime(Math.max(500,bc*0.7),t+0.09);
    var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=drum?2600:3200; lp.Q.value=0.4; // 젖은/먹먹한 롤오프
    var cg=AC.createGain(); cg.gain.setValueAtTime(0.0001,t);
    var tp=t, grains=4+Math.floor(Math.random()*3);           // 4~6개 그레인
    for(var gi=0;gi<grains;gi++){
      var dt=0.010+Math.random()*0.020;                       // 그레인 간격
      var amp=(0.078+Math.random()*0.062)*(1-gi/(grains+1)*0.55); // 뒤로 갈수록 작아짐
      cg.gain.exponentialRampToValueAtTime(Math.max(0.01,amp),tp+dt*0.4);
      cg.gain.exponentialRampToValueAtTime(Math.max(0.004,amp*0.25),tp+dt);
      tp+=dt;
    }
    var bodyEnd=tp+0.03; cg.gain.exponentialRampToValueAtTime(0.0001,bodyEnd);
    fs.connect(bp); bp.connect(lp); lp.connect(cg); cg.connect(pre); fs.start(t); fs.stop(bodyEnd+0.03); }
  // 3) 도마 '툭' + 조각 무게감: 짧은 저중역 사인/삼각.
  var bo=AC.createOscillator(); bo.type=drum?'sine':'triangle';
  var bf=drum?105:135; bo.frequency.setValueAtTime(bf*(0.95+Math.random()*0.1),t);
  bo.frequency.exponentialRampToValueAtTime(bf*0.55,t+(drum?0.085:0.07));
  var blp=AC.createBiquadFilter(); blp.type='lowpass'; blp.frequency.value=drum?420:600;
  var bg=AC.createGain(); bg.gain.setValueAtTime(0.0001,t);          // t에서 0으로 고정(기본값 1.0 블립 방지)
  bg.gain.setValueAtTime(0.0001,t+0.004);                            // 접촉 뒤까지 대기
  bg.gain.exponentialRampToValueAtTime(drum?0.33:0.30,t+0.014);
  bg.gain.exponentialRampToValueAtTime(0.0001,t+(drum?0.15:0.11));
  bo.connect(blp); blp.connect(bg); bg.connect(pre); bo.start(t); bo.stop(t+(drum?0.18:0.14));
}catch(e){} }
function missSound(time){ try{ if(!AC) return;  // 놓침: 음악을 해치지 않는 부드러운 '툭' (삐 소리 X)
  var s=AC.createBufferSource(); s.buffer=noiseBuf(0.09,2.2); var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600;
  var g=AC.createGain(); g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(0.09,time+0.008); g.gain.exponentialRampToValueAtTime(0.0001,time+0.1);
  s.connect(lp); lp.connect(g); g.connect(out()); sendVerb(g,0.1); s.start(time); s.stop(time+0.12); }catch(e){} }

function updateHUD(){ document.getElementById('scoreT').setAttribute('ktext','value','점수 '+score);
  var mid; if(MODE==='song'){ var pct=songDurMs>0?Math.max(0,Math.min(100,Math.round((Date.now()-songStart)/songDurMs*100))):0; mid='🎵 '+pct+'%'; }
  else mid=level+'단계 · '+Math.max(0,levelTime)+'s';
  document.getElementById('timeT').setAttribute('ktext','value', mid);
  document.getElementById('comboT').setAttribute('ktext','value', combo>1?('x'+combo+' 콤보!'):''); }

function spawnBlock(freq, speed){ if(!window.__saberPlaying) return;
  // 손을 번갈아 쓰도록 색을 교대 — 높은음은 위, 낮은음은 아래로
  var col=(spawnN++%2===0)?'red':'blue';
  var ny=1.1; if(freq){ var r=Math.max(0,Math.min(1, Math.log(freq/247)/Math.log(1000/247))); ny=0.95+r*1.25; } // 음높이(로그)→높낮이
  var e=document.createElement('a-box'); e.setAttribute('class','block'); e.dataset.color=col;
  e.setAttribute('depth','0.32'); e.setAttribute('width','0.32'); e.setAttribute('height','0.32');
  e.setAttribute('material','shader:flat; color:'+(col==='red'?'#ff3b64':'#3ba0ff'));
  // 방향 화살표(어느 손으로 벨지) — 네온 삼각형 느낌의 작은 표식
  e.innerHTML='<a-box width="0.1" height="0.1" depth="0.02" position="0 0 0.18" rotation="0 0 45" material="shader:flat; color:#fff; opacity:0.9"></a-box>';
  e.setAttribute('position', (Math.random()*2.0-1.0).toFixed(2)+' '+ny.toFixed(2)+' -14');
  e.setAttribute('flyblock','speed: '+(speed||5.6).toFixed(1));   // 리드타임으로 계산된 속도 그대로 → 음표 울릴 때 판정선 도착(랜덤 가산 금지)
  field.appendChild(e);
}
function sliceBlock(block, col){ var p=block.getAttribute('position')||{x:0,y:1.5,z:0}; var c=(col==='red'?'#ff3b64':'#3ba0ff');
  for(var h=-1; h<=1; h+=2){ var half=document.createElement('a-box'); half.setAttribute('width','0.32'); half.setAttribute('height','0.15'); half.setAttribute('depth','0.32');
    half.setAttribute('material','shader:flat; color:'+c); half.setAttribute('position', (p.x||0)+' '+((p.y||1.5)+h*0.09)+' '+(p.z||0));
    half.setAttribute('debris','vx:'+((Math.random()-0.5)*1.6).toFixed(2)+'; vy:'+(h*1.3+Math.random()*0.4).toFixed(2)+'; vz:1'); scene.appendChild(half);
    (function(x){ setTimeout(function(){ if(x.parentNode) x.parentNode.removeChild(x); },820); })(half); }
  for(var i=0;i<5;i++){ var pt=document.createElement('a-box'); pt.setAttribute('width','0.05'); pt.setAttribute('height','0.05'); pt.setAttribute('depth','0.05');
    pt.setAttribute('material','shader:flat; color:'+c); pt.setAttribute('position', (p.x||0)+' '+(p.y||1.5)+' '+(p.z||0));
    pt.setAttribute('debris','vx:'+((Math.random()-0.5)*3.5).toFixed(2)+'; vy:'+(Math.random()*2.8).toFixed(2)+'; vz:'+(Math.random()*1.6).toFixed(2)); scene.appendChild(pt);
    (function(x){ setTimeout(function(){ if(x.parentNode) x.parentNode.removeChild(x); },700); })(pt); }
  try{ var tnow=AC?AC.currentTime:0, sp=parseFloat((block.getAttribute('flyblock')||{}).speed)||6;
    sliceSound(tnow,{color:col, speed:sp/5.5}); shatterSound(tnow+0.015,{kind:block.dataset.drum?'drum':'cube'}); }catch(e){}
  haptic(col);
}
window.__saberHit=function(block, saberColor){ if(!block || block.dataset.dead) return;
  if(block.dataset.drum){                      // 드럼 큐브: 아무 검으로나 '치면' 그 드럼 소리
    block.dataset.dead='1';
    if(MODE==='lesson'){ lessonGood++; } else { hits++; combo++; maxCombo=Math.max(maxCombo,combo); score+=10*Math.min(8,combo); updateHUD(); }
    try{ playPiece(block.dataset.drum, AC.currentTime); }catch(e){}
    sliceBlock(block, block.dataset.drum==='S'?'blue':'red'); if(block.parentNode) block.parentNode.removeChild(block);
    if(MODE==='lesson' && LESSON && LESSON.sub==='wait' && block.dataset.lesson){ lessonWaitAdvance(); }
    return; }
  if(block.dataset.color!==saberColor) return;
  block.dataset.dead='1'; hits++; combo++; maxCombo=Math.max(maxCombo,combo); score+=10*Math.min(8,combo);
  updateHUD(); sliceBlock(block, saberColor); if(block.parentNode) block.parentNode.removeChild(block); };
window.__saberMiss=function(block){ if(!block || block.dataset.dead) return; block.dataset.dead='1';
  if(MODE!=='lesson') misses++;                 // 놓친 블록 → 정확도에 반영 (게임은 계속 진행)
  combo=0; updateHUD(); missSound(AC?AC.currentTime:0); if(block.parentNode) block.parentNode.removeChild(block); };

function showGame(){ document.getElementById('hud').setAttribute('visible',true);
  document.getElementById('startWrap').setAttribute('visible',false);
  document.getElementById('gameover').setAttribute('visible',false);
  document.getElementById('helpWrap').setAttribute('visible',false);

function hideHitline(){ try{ document.getElementById('hitline').setAttribute('visible',false); }catch(e){} }
function startGame(){ MODE='level'; resetScore(); level=1; levelTime=LEVEL_SECS; window.__saberPlaying=true;
  activeKit = kitAuto ? idByName('basic') : drumKit;
  clearTimeout(songEndTimer); buildSong(); updateHUD(); levelBanner(); showGame();
  clearBlocks(); startMusic(); clearInterval(timer); timer=setInterval(tick,1000);
}
function startSong(idx){ var s=SONGS[idx]; if(!s) return startGame();
  MODE='song'; resetScore(); window.__saberPlaying=true;
  activeKit = resolveKit(s.abc);
  var r=parseABC(s.abc); songNotes=r.notes; songLen=r.songLen; songTempo=r.tempo; songTitle=s.title;
  var rb=parseABC(s.abc, 2, 'bottom'); bassNotes=rb.notes; bassLen=rb.songLen||songLen;
  songTempoMap=(r.tempoMap&&r.tempoMap.length)?r.tempoMap:[{on:0,tempo:r.tempo}];
  var dur=0; for(var q=0;q<songLen;q++) dur+=(60/tempoAtPos(q))/4; songDurMs=dur*1000;
  var leadMs=(0.1+leadFor(0))*1000; songStart=Date.now()+leadMs;   // 음악은 리드타임 뒤 시작 → 진행%/종료도 그만큼 미룸
  updateHUD(); songBanner(songTitle); showGame();
  clearBlocks(); startMusic(); clearInterval(timer); timer=setInterval(tick,1000);
  clearTimeout(songEndTimer); songEndTimer=setTimeout(endGame, leadMs+songDurMs+900);
}
function songBanner(txt){ var b=document.getElementById('lvBanner'); if(!b) return;
  b.setAttribute('ktext','value: 🎵 '+txt+'; color:#8fe3ff; size:0.34'); b.setAttribute('visible',true);
  clearTimeout(levelBanner._t); levelBanner._t=setTimeout(function(){ try{ b.setAttribute('visible',false); b.setAttribute('ktext','size',0.6); }catch(e){} },2600); }
function tick(){ if(!window.__saberPlaying) return;
  if(MODE==='lesson'){ return; }               // 레슨은 자체 타이머로 진행
  if(MODE==='song'){ updateHUD(); return; }   // 노래 모드는 songEndTimer가 종료 담당
  levelTime--;

/* 보이지 않는(부모가 숨겨진) 버튼의 메시가 레이캐스트에 잡혀도 클릭 무시 — 빈 곳 탭으로 메뉴가 뜨거나 리셋되는 것 방지 */

/* 📱 모바일 버전: '판정선(STRIKE_Z)'에 온 블록을 음악 타이밍에 맞춰 터치하면 깨진다.
   - 판정선 부근(±HIT_WIN)의 블록만 대상 → 아직 멀거나 지나간 블록은 안 깨짐(의도치 않은 파괴 방지).
   - 선 안에 블록이 있으면 화면 어디를 눌러도 '선에 가장 가깝고 조준에 가까운' 블록을 깬다(작은 블록도 잘 깨짐).
   - 선 안에 블록이 없을 때 빈 곳을 눌러도 아무 일 없음 → 리셋·오작동 없음. */
var HIT_WIN=1.6;   // 판정선 기준 z 허용폭(타이밍 창, m)
/* 순수 선택 로직(검증용): 후보 [{z, dray, dead}] 중 판정선에 가깝고 조준에 가까운 블록 인덱스. 없으면 -1 */
function pickHitBlock(cands){ var best=-1, bestScore=1e9;
  for(var i=0;i<cands.length;i++){ var c=cands[i]; if(c.dead) continue;
    var dz=Math.abs(c.z-STRIKE_Z); if(dz>HIT_WIN) continue;
    var score=dz*1.0 + (c.dray||0)*0.5; if(score<bestScore){ bestScore=score; best=i; } }
  return best; }
window.__vrTapAt=function(x,y,ndc,cam,ray){ if(!window.__saberPlaying) return;
  var els=document.querySelectorAll('.block'); if(!els.length) return;
  var wp=new THREE.Vector3(), cands=[], refs=[];
  for(var i=0;i<els.length;i++){ var b=els[i]; if(b.dataset.dead||!b.object3D) continue;
    b.object3D.getWorldPosition(wp);
    cands.push({z:wp.z, dray:ray?ray.ray.distanceToPoint(wp):0, dead:false}); refs.push(b); }
  var idx=pickHitBlock(cands);
  if(idx>=0){ var best=refs[idx]; window.__saberHit(best, best.dataset.color||'red'); flashHitline(); } };
/* 명중 시 판정선 깜빡임(손맛 피드백) */
